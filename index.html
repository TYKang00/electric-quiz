 "피뢰기", "q": "피뢰기·피뢰침의 접지를 다른 접지와 공용하지 않는 이유를 쓰시오.", "ans": "낙뢰에 의한 이상전압 침입 시 피뢰기 접지선을 통해 다른 기기·기구에 이상전압이 침입하여 계통 사고가 확대되는 것을 방지하기 위해", "h1": "뇌서지 역류 방지", "h2": "피뢰기: “IKL = 1년에 천둥 치는 날 수”가 떠오르면 정답 문장을 복원한다 — 연간 뇌우 발생 일수", "freq": "-", "src": "-", "verify": "전기요약집 p.197 · 350제 191번 일치"}, {"id": 222, "chap": "피뢰기·서지·절연협조", "topic": "피뢰기", "q": "IKL(Isokeraunic level)이란 무엇인가?", "ans": "연간 뇌우 발생 일수", "h1": "IKL = 1년에 천둥 치는 날 수", "h2": "[SA] 서지흡수기 체크리스트를 펼쳐 기능 : 개폐서지 등 이상전압으로부터 2차 기기를 보호 → 설치 위치 : 개폐서지를 발생하는 차단기 후단과 보호하고자 하는 기기 전단 사이 순서로 하나씩 짚는다.", "freq": "-", "src": "-", "verify": "공사요약집 p.156 수록 문항 (공사기사 공통)"}, {"id": 223, "chap": "피뢰기·서지·절연협조", "topic": "서지흡수기", "q": "서지흡수기(SA)의 기능과 설치 위치를 쓰시오.", "ans": "기능 : 개폐서지 등 이상전압으로부터 2차 기기를 보호\n설치 위치 : 개폐서지를 발생하는 차단기 후단과 보호하고자 하는 기기 전단 사이", "h1": "SA = 차단기 뒤, 기기 앞", "h2": "[VCB] 서지흡수기 체크리스트를 펼쳐 VCB 뒤 → 몰드 앞 = SA (LA와 같은 구조 → 특성) 순서로 하나씩 짚는다.", "freq": "-", "src": "-", "verify": "공사요약집 p.164 일치 전기요약집 p.204 일치"}, {"id": 224, "chap": "피뢰기·서지·절연협조", "topic": "서지흡수기", "q": "수전전압 22.9[kV-Y]에 VCB와 몰드변압기를 사용하는 경우 개폐 이상전압으로부터 기기를 보호하기 위해 설치하는 기기의 명칭과 설치 위치를 쓰시오.", "ans": "명칭 : 서지흡수기 (SA)\n설치 위치 : 진공차단기(VCB) 2차측과 몰드변압기 1차측 사이", "h1": "VCB 뒤 · 몰드 앞 = SA (LA와 같은 구조·특성)", "h2": "서지흡수기 숫자는 3 → 6 → 10 순서로 묶고, “기름(유입)과 콘덴서만 불필요”라는 리듬으로 외운다.", "freq": "★★ 4회", "src": "[25-3] [19-1] [11-1] [03-2]", "verify": "전기요약집 p.200·공사요약집 p.172·350제 192번 일치 (HWP 원문 'VCB 1차측~몰드 2차측'은 잘못 → 정정)"}, {"id": 225, "chap": "피뢰기·서지·절연협조", "topic": "서지흡수기", "q": "VCB 사용 시 2차 보호기기별 서지흡수기(SA) 적용 여부를 쓰시오.", "ans": "전동기 : 적용 (3·6·10[kV])\n유입식 변압기 : 불필요\n몰드식·건식 변압기 : 적용\n콘덴서 : 불필요\n변압기와 유도기기 혼용 : 적용", "h1": "기름(유입)과 콘덴서만 불필요", "h2": "[kk] 서지흡수기 체크리스트를 펼쳐 4.5 kV → 5 kA 순서로 하나씩 짚는다.", "freq": "★ 2회", "src": "[19-2] [13-3]", "verify": "공사요약집 p.165 일치 전기요약집 p.201 일치"}, {"id": 226, "chap": "피뢰기·서지·절연협조", "topic": "서지흡수기", "q": "3.3[kV] 구내선로의 개폐서지로부터 2차 기기를 보호하기 위한 서지흡수기의 정격전압과 공칭방전전류는?", "ans": "정격전압 : 4.5 [kV]\n공칭방전전류 : 5 [kA]", "h1": "3.3 kV → 4.5 kV · 5 kA", "h2": "[SPD] SPD을 설치하는 목표는 SPD = 과전압 제한 + 서지 분류이다.", "freq": "-", "src": "-", "verify": "공사요약집 p.164 수록 문항 (공사기사 공통)"}, {"id": 227, "chap": "피뢰기·서지·절연협조", "topic": "SPD", "q": "과도적인 과전압을 제한하고 서지전류를 분류하는 목적으로 설치하는 장치를 쓰시오.", "ans": "서지 보호 장치 (SPD, Surge Protective Device)", "h1": "SPD = 과전압 제한 + 서지 분류", "h2": "[스위칭] SPD 체크리스트를 펼쳐 스위칭 · 제한 · 복합 → 1포트 · 2포트 순서로 하나씩 짚는다.", "freq": "★ 1회", "src": "[25-2]", "verify": "공사요약집 p.58 일치 전기요약집 p.144 일치"}, {"id": 228, "chap": "피뢰기·서지·절연협조", "topic": "SPD", "q": "SPD를 기능에 따라 3가지, 구조에 따라 2가지로 분류하시오.", "ans": "기능별 : ① 전압 스위칭형 ② 전압 제한형 ③ 복합형(조합형)\n구조별 : ① 1포트 SPD ② 2포트 SPD", "h1": "스위칭 · 제한 · 복합 / 1포트 · 2포트", "h2": "SPD 숫자는 0.5 → 16 순서로 묶고, “SPD 선은 짧게 0.5 m, 굵기 16 ㎟”라는 리듬으로 외운다.", "freq": "-", "src": "-", "verify": "공사요약집 p.166 일치 전기요약집 p.144 일치"}, {"id": 229, "chap": "피뢰기·서지·절연협조", "topic": "SPD", "q": "통합접지 시 설치하는 SPD 연결전선(a+b)의 최대 길이와 SPD Ⅰ·Ⅱ등급 연결도체의 최소 구리 굵기를 쓰시오.", "ans": "연결전선 길이 : 0.5 [m] 이하\nSPD Ⅰ등급 : 16 [㎟] / Ⅱ등급 : 16 [㎟] (구리)", "h1": "SPD 선은 짧게 0.5 m, 굵기 16 ㎟", "h2": "피뢰기는 낙뢰·개폐 이상전압에서 전기기기를 지키고, 피뢰시스템은 건물을 지킨다. 보호가 필요한 구조물과 높이 20 m 이상 건축물에 피뢰시스템을 설치한다.", "freq": "-", "src": "-", "verify": "공사요약집 p.58 수록 문항 (공사기사 공통)"}, {"id": 230, "chap": "피뢰기·서지·절연협조", "topic": "피뢰시스템", "q": "피뢰기와 피뢰시스템의 사용 목적 차이와, 피뢰시스템 설치 대상을 쓰시오.", "ans": "피뢰기 : 이상전압(낙뢰·개폐)으로부터 전력설비 기기 보호\n피뢰시스템 : 구조물 뇌격으로 인한 물리적 손상을 줄이기 위해 사용\n피뢰시스템 설치 대상 : ① 낙뢰로부터 보호가 필요한 건축물·구조물 또는 지상 높이 20[m] 이상인 것 ② 낙뢰로부터 보호가 필요한 전기·전자설비", "h1": "피뢰기 = 기기, 피뢰시스템 = 건물(20 m↑)", "h2": "[등급] 피뢰시스템에서는 등급 관련 = 크기 → 거리(회전구체 → 인하도선 → 이격 → 접지극) / 무관 = 재료 → 치수 순서로 장면을 이어 간다.", "freq": "-", "src": "-", "verify": "공사요약집 p.160 일치 전기요약집 p.199 일치"}, {"id": 231, "chap": "피뢰기·서지·절연협조", "topic": "피뢰시스템", "q": "피뢰시스템의 등급과 관계가 있는 데이터 4가지와 관계가 없는 데이터 3가지를 쓰시오.", "ans": "관계 있음 : ① 회전구체 반경·메시 크기·보호각 ② 인하도선·환상도체 간 전형적 최적 거리 ③ 위험한 불꽃방전 대비 이격거리 ④ 접지극의 최소 길이\n관계 없음 : ① 수뢰부로 쓰는 금속관 최소 두께 ② 접속도체 최소 치수 ③ 피뢰시스템 재료 및 사용조건", "h1": "등급 관련 = 크기·거리(회전구체·인하도선·이격·접지극) / 무관 = 재료·치수", "h2": "수뢰부 재료는 돌침·수평도체·메시도체, 배치 방법은 보호각법·회전구체법·메시법으로 짝지어 외운다. [돌수메·보회메]", "freq": "★ 1회", "src": "[21-2]", "verify": "전기요약집 p.205 · 350제 199번 일치"}, {"id": 232, "chap": "피뢰기·서지·절연협조", "topic": "피뢰시스템", "q": "외부 피뢰시스템의 수뢰부 구성요소 3가지와 배치 방법 3가지를 쓰시오.", "ans": "구성요소 : 돌침, 수평도체, 메시도체\n배치 방법 : 보호각법, 회전구체법, 메시법", "h1": "돌수메 / 보회메", "h2": "피뢰시스템 숫자는 10 → 15 → 20 순서로 묶고, “10 · 10 · 15 · 20”라는 리듬으로 외운다.", "freq": "-", "src": "-", "verify": "공사요약집 p.161 일치 전기요약집 p.206 일치"}, {"id": 233, "chap": "피뢰기·서지·절연협조", "topic": "피뢰시스템", "q": "피뢰설비 보호등급별(Ⅰ~Ⅳ) 인하도선 간 평균거리를 쓰시오.", "ans": "Ⅰ등급 : 10 [m]\nⅡ등급 : 10 [m]\nⅢ등급 : 15 [m]\nⅣ등급 : 20 [m]", "h1": "10 · 10 · 15 · 20", "h2": "BIL: “BIL = 번개 한 방 견디는 기준”가 떠오르면 정답 문장을 복원한다 — 기준충격절연강도 (Basic Impulse Insulation Level) : 뇌임펄스 내전압 시험값으로 절연레벨의 기준을 정하는 데 적용", "freq": "-", "src": "-", "verify": "공사요약집 p.162 수록 문항 (공사기사 공통)"}, {"id": 234, "chap": "피뢰기·서지·절연협조", "topic": "BIL", "q": "BIL이란 무엇인지 설명하시오.", "ans": "기준충격절연강도 (Basic Impulse Insulation Level) : 뇌임펄스 내전압 시험값으로 절연레벨의 기준을 정하는 데 적용", "h1": "BIL = 번개 한 방 견디는 기준", "h2": "BIL 숫자는 50 → 5 → 150 → 20 → 1.1 → 22 → 1.2 → 24 → 3 → 831.38 순서로 묶고, “BIL = 계급×5+50 → 공칭 = 계급×1.1 → 정격 = 공칭×1.2/1.1”라는 리듬으로 외운다.", "freq": "★ 2회", "src": "[19-3] [08-1]", "verify": "공사요약집 p.158 일치"}, {"id": 235, "chap": "피뢰기·서지·절연협조", "topic": "BIL", "q": "BIL 150[kV], 정격차단전류 20[kA]인 차단기의 정격전압과 정격차단용량을 구하시오. (BIL = 절연계급×5+50[kV], 공칭전압 = 절연계급×1.1)", "ans": "① 절연계급 = (BIL − 50) / 5 = (150 − 50) / 5 = 20 [호]\n② 공칭전압 = 20 × 1.1 = 22 [kV]\n③ 정격전압 = 공칭전압 × 1.2/1.1 = 22 × 1.2/1.1 = 24 [kV]\n④ 정격차단용량 = √3 × 24 × 20 = 831.38 [MVA]", "h1": "BIL = 계급×5+50 → 공칭 = 계급×1.1 → 정격 = 공칭×1.2/1.1", "h2": "절연협조: “(계)(상)(절)(계)(경)(합)”가 떠오르면 정답 문장을 복원한다 — 계통 내 각 기기·기구·애자 등의 상호 간에 적정한 절연강도를 지니게 함으로써 계통 설계를 합리적·경제적으로 할 수 있게 한 것", "freq": "★ 2회", "src": "[19-3] [08-1]", "verify": "엑셀 원문 기준 (교재·HWP 미수록)"}, {"id": 236, "chap": "피뢰기·서지·절연협조", "topic": "절연협조", "q": "전력계통의 절연협조란 무엇인지 설명하시오.", "ans": "계통 내 각 기기·기구·애자 등의 상호 간에 적정한 절연강도를 지니게 함으로써 계통 설계를 합리적·경제적으로 할 수 있게 한 것", "h1": "(계)(상)(절)(계)(경)(합)", "h2": "[선결기변피] 절연협조 작업자가 선결기변피 (선 > 콘 > 기 > 변 > 피) 순서대로 작업하는 장면을 그린다.", "freq": "★ 2회 120제", "src": "[07-3] [03-2]", "verify": "120제 일치"}, {"id": 237, "chap": "피뢰기·서지·절연협조", "topic": "절연협조", "q": "선로애자 · 결합콘덴서 · 피뢰기 · 변압기의 기준충격절연강도(BIL)를 큰 순서로 비교하시오.", "ans": "선로애자 > 결합콘덴서 > (기기부싱) > 변압기 > 피뢰기", "h1": "선결기변피 (선 > 콘 > 기 > 변 > 피)", "h2": "이상전압의 세 출발점은 스위치를 여닫는 개폐, 번개인 뇌, 땅과 닿는 지락이다. [개뇌지]로 묶는다.", "freq": "★ 2회", "src": "[07-3] [03-2]", "verify": "전기요약집 p.40 · 350제 61번 일치"}, {"id": 238, "chap": "피뢰기·서지·절연협조", "topic": "이상전압", "q": "서지 과전압(이상전압)의 발생 원인 3가지를 쓰시오.", "ans": "① 차단기 개폐에 의한 과전압 (내부 이상전압)\n② 뇌에 의한 과전압 (외부 이상전압)\n③ 지락사고에 의한 과전압", "h1": "개폐 · 뇌 · 지락", "h2": "[피가매] 이상전압 대책반이 피뢰기 → 가공지선 → 매설지선 순서로 조치하는 장면을 그린다.", "freq": "-", "src": "-", "verify": "공사요약집 p.155 수록 문항 (공사기사 공통)"}, {"id": 239, "chap": "피뢰기·서지·절연협조", "topic": "이상전압", "q": "가공전선로의 이상전압 방지대책 3가지를 쓰시오.", "ans": "① 가공지선 설치 (뇌 차폐)\n② 매설지선 설치 (철탑 접지저항 저감 → 역섬락 방지)\n③ 피뢰기 설치 (기기 보호)", "h1": "피가매 → 피뢰기 · 가공지선 · 매설지선", "h2": "매설지선이 철탑 발의 접지저항을 낮춰 주면, 번개가 뒤로 넘어오는 역섬락을 막는다.", "freq": "★ 1회 120제", "src": "[18-1]", "verify": "전기요약집 p.115 · 350제 195번 · 120제 일치"}, {"id": 240, "chap": "피뢰기·서지·절연협조", "topic": "이상전압", "q": "송전선로에서 매설지선의 설치 목적을 쓰시오.", "ans": "철탑의 탑각 접지저항을 낮추어 역섬락을 방지한다.", "h1": "매설지선 = 역섬락 방지", "h2": "[20] 피뢰시스템 체크리스트를 펼쳐 20 m 초과 → 위험물 → 옥외탱크 순서로 하나씩 짚는다.", "freq": "-", "src": "-", "verify": "공사요약집 p.163 일치"}, {"id": 241, "chap": "피뢰기·서지·절연협조", "topic": "피뢰시스템", "q": "피뢰침(피뢰설비)을 설치해야 하는 장소를 쓰시오.", "ans": "① 지면상 20[m]를 초과하는 건축물이나 공작물\n② 소방법에서 정한 위험물·화약류 저장소, 옥외 탱크 저장소 등", "h1": "20 m 초과 · 위험물 · 옥외탱크", "h2": "[케용독수돌] 피뢰시스템 체크리스트를 펼쳐 케이지 방식 → 용마루 위 도체 방식 → 독립 가공지선 방식 → 수평도체 방식 → 돌침 방식 순서로 하나씩 짚는다.", "freq": "-", "src": "-", "verify": "350제 193번 수록 문항"}, {"id": 242, "chap": "피뢰기·서지·절연협조", "topic": "피뢰시스템", "q": "피뢰방식의 종류 5가지를 쓰시오.", "ans": "① 케이지 방식\n② 용마루 위 도체 방식\n③ 독립 가공지선 방식\n④ 수평도체 방식\n⑤ 돌침 방식", "h1": "게-용-독-수-돌", "h2": "", "freq": "-", "src": "-", "verify": "350제 194번 수록 문항"}, {"id": 243, "chap": "전력용 콘덴서·역률·고조파", "topic": "역률 개선", "q": "역률을 개선하는 원리를 간단히 설명하시오.", "ans": "유도성 부하에 병렬로 콘덴서를 설치하여 진상전류를 공급함으로써 지상 무효전류(무효전력)를 감소시켜 역률을 개선한다.", "h1": "지상(L) 부하 + 진상(C) 콘덴서 = 무효분 상쇄", "h2": "[전전부설] 역률 개선 체크리스트를 펼쳐 전력손실 → 전기요금 → 전압강하 → 설비여유↓ 순서로 하나씩 짚는다.", "freq": "★★ 3회 120제", "src": "[19-1] [02-3] [01-2]", "verify": "공사요약집 p.224 일치 · 콘덴서는 부하와 병렬 접속 350제 147번 · 120제 일치"}, {"id": 244, "chap": "전력용 콘덴서·역률·고조파", "topic": "역률 개선", "q": "부하설비의 역률이 저하(90[%] 이하)하는 경우 수용가가 볼 수 있는 손해를 쓰시오.", "ans": "① 전력손실이 커진다.\n② 전기요금이 증가한다.\n③ 전압강하가 커진다.\n④ 설비용량의 여유가 감소한다(전원설비 용량 증가).", "h1": "전전부설 → 전력손실 · 전기요금 · 전압강하 · 설비여유↓", "h2": "[변전설전] 역률 개선 적용 장면에서는 변압기손실 → 전압강하 → 설비여유 → 전기요금 순서로 장점이 차례로 나타난다.", "freq": "★★ 3회", "src": "[19-1] [02-3] [01-2]", "verify": "공사요약집 p.224 일치"}, {"id": 245, "chap": "전력용 콘덴서·역률·고조파", "topic": "역률 개선", "q": "전력용 콘덴서의 설치 목적(설치 효과) 4가지를 쓰시오.", "ans": "① 변압기·배전선의 전력손실 감소\n② 전압강하 감소\n③ 설비용량의 여유분 증가\n④ 전기요금 감소", "h1": "변전설전 → 변압기손실 · 전압강하 · 설비여유 · 전기요금", "h2": "역률 개선: “콘덴서 ≤ 지상 무효분 (넘으면 과보상)”가 떠오르면 정답 문장을 복원한다 — 부하의 지상 무효전력 이하", "freq": "★★★ 5회", "src": "[14-2] [13-2] [04-3] [02-3] [01-2]", "verify": "공사요약집 p.253 일치"}, {"id": 246, "chap": "전력용 콘덴서·역률·고조파", "topic": "역률 개선", "q": "역률 개선용 전력용 콘덴서 용량은 최대 어떤 전력 이하로 설정해야 하는가?", "ans": "부하의 지상 무효전력 이하", "h1": "콘덴서 ≤ 지상 무효분 (넘으면 과보상)", "h2": "[모재계] 과보상에서는 모선 전압 상승 → 재점호에 의한 과전압 발생 → 계전기 오동작 순서로 장면을 이어 간다.", "freq": "★ 2회", "src": "[13-2] [12-1]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 247, "chap": "전력용 콘덴서·역률·고조파", "topic": "과보상", "q": "경부하 시 콘덴서가 과대 삽입(과보상)되는 경우의 결점을 쓰시오.", "ans": "① 모선 전압 상승\n② 재점호에 의한 과전압 발생\n③ 계전기 오동작\n(그 외) 고조파 왜곡 증대, 앞선 역률에 의한 전력손실 증가, 설비용량 여력 감소", "h1": "모재계 (+고모앞설)", "h2": "[콘덴서] 자기여자 관련 항목을 이유 : 콘덴서 전류가 전동기의 무부하 전류보다 큰 경우 → 현상 : 전동기 단자전압이 일시적으로 정격전압을 초과하는 현상 순서로 한 줄 기차처럼 이어 붙인다.", "freq": "★★★ 6회", "src": "[15-3] [14-3] [12-1] [11-3] [04-1] [03-3]", "verify": "전기요약집 p.180 일치"}, {"id": 248, "chap": "전력용 콘덴서·역률·고조파", "topic": "자기여자", "q": "전동기에 개별로 콘덴서를 설치할 때 발생하는 자기여자 현상의 발생 이유와 현상을 쓰시오.", "ans": "이유 : 콘덴서 전류가 전동기의 무부하 전류보다 큰 경우\n현상 : 전동기 단자전압이 일시적으로 정격전압을 초과하는 현상", "h1": "콘덴서 > 무부하전류 → 전압 치솟음", "h2": "[개퓨유] 시설기준에서는 개퓨유 금지 → 직렬L → 1 m 순서로 장면을 이어 간다.", "freq": "★ 2회", "src": "[20-3] [13-1]", "verify": "전기요약집 p.180 일치"}, {"id": 249, "chap": "전력용 콘덴서·역률·고조파", "topic": "시설기준", "q": "개개의 부하에 고압·특고압 진상콘덴서를 설치할 때의 시설 원칙 빈칸을 채우시오.\n콘덴서 용량은 부하의 ( ① )보다 크게 하지 말 것 / 본선에 직접 접속하고 전용의 ( ② ), ( ③ ), ( ④ )를 설치하지 말 것 / 고조파 증대 시 ( ⑤ ) 설치 / 가연성유 봉입 콘덴서는 가연성 벽·천장과 ( ⑥ ) 이상 이격", "ans": "① 무효분\n② 개폐기 ③ 퓨즈 ④ 유입차단기\n⑤ 직렬 리액터\n⑥ 1 [m]", "h1": "개퓨유 금지 · 직렬L · 1 m", "h2": "방전장치 숫자는 5 → 50 → 3 → 75 순서로 묶고, “고특 5-50 / 저압 3-75”라는 리듬으로 외운다.", "freq": "★ 1회", "src": "[12-1]", "verify": "전기요약집 p.181 일치"}, {"id": 250, "chap": "전력용 콘덴서·역률·고조파", "topic": "방전장치", "q": "진상용 콘덴서 방전장치의 성능 기준을 쓰시오. (고압·특고압 / 저압)", "ans": "고압·특고압 : 개로 후 5초 이내에 잔류전하를 50[V] 이하로 저하\n저압 : 개로 후 3분 이내에 잔류전하를 75[V] 이하로 저하", "h1": "고특 5-50 / 저압 3-75", "h2": "[방전코일] 방전장치을 설치하는 목표는 방전코일 = 잔류전하 방전 (감전 방지)이다.", "freq": "★ 1회", "src": "[09-1]", "verify": "전기요약집 p.183 일치"}, {"id": 251, "chap": "전력용 콘덴서·역률·고조파", "topic": "방전장치", "q": "진상 콘덴서에 연결하는 방전코일(DC)의 설치 목적을 쓰시오.", "ans": "콘덴서 회로 개방 시 콘덴서에 축적된 잔류전하를 방전시킨다.", "h1": "방전코일 = 잔류전하 방전 (감전 방지)", "h2": "[콘덴서] 직렬리액터 체크리스트를 펼쳐 기기 : 직렬 리액터 (SR) → 용도 : 제5고조파를 제거하여 전압 파형을 개선 순서로 하나씩 짚는다.", "freq": "★★★ 6회 120제", "src": "[19-3] [17-3] [13-3] [11-3] [04-3] [03-1]", "verify": "공사요약집 p.227 일치 120제 일치"}, {"id": 252, "chap": "전력용 콘덴서·역률·고조파", "topic": "직렬리액터", "q": "전력용 콘덴서에 고조파 전류가 흐를 때 사용하는 기기와 그 용도를 쓰시오.", "ans": "기기 : 직렬 리액터 (SR)\n용도 : 제5고조파를 제거하여 전압 파형을 개선", "h1": "콘덴서 + 직렬 L = 5고조파 제거", "h2": "[고콘투고] 직렬리액터 적용 장면에서는 5고조파 → 콘덴서 개방 → 투입 → 고조파 계전기 순서로 장점이 차례로 나타난다.", "freq": "★★★ 7회", "src": "[19-3] [17-3] [13-3] [13-2] [11-3] [07-3] [04-3]", "verify": "공사요약집 p.227 일치"}, {"id": 253, "chap": "전력용 콘덴서·역률·고조파", "topic": "직렬리액터", "q": "전력용 콘덴서에 설치하는 직렬 리액터의 설치 효과를 쓰시오.", "ans": "① 제5고조파에 의한 전압 파형 찌그러짐 방지\n② 콘덴서 투입 시 돌입전류 억제\n③ 콘덴서 개방 시 모선의 과전압 억제\n④ 고조파 전류 유입 억제 및 계전기 오동작 방지", "h1": "오빠는 콘개투에 고전함 → 5고조파 · 콘덴서 개방·투입 · 고조파 계전기", "h2": "직렬리액터 계산은 산출식(5고조파) : 5ωL = 1/(5ωC) → ωL = (1/25)×(1/ωC) = 0.04 × Xc 순서로 쓴다. 입으로는 “5고조파 4%(실 6%) · 3고조파 11%(실 13%)”라고 읽는다.", "freq": "- 120제", "src": "-", "verify": "공사요약집 p.227 일치 전기요약집 p.184 · 120제 일치"}, {"id": 254, "chap": "전력용 콘덴서·역률·고조파", "topic": "직렬리액터", "q": "제5고조파·제3고조파를 제거하기 위한 직렬 리액터의 용량은 콘덴서 용량의 몇 [%]인가? (이론값/실제값)", "ans": "산출식(5고조파) : 5ωL = 1/(5ωC) → ωL = (1/25)×(1/ωC) = 0.04 × Xc\n① 제5고조파 : 이론 4[%] 이상, 실제 6[%] (주파수 변동·경제성 고려, 5~6[%])\n② 제3고조파 : 이론 11[%] 이상, 실제 13[%]", "h1": "5고조파 4%(실 6%) · 3고조파 11%(실 13%)", "h2": "리액터 이름과 목적을 짝지어 걷는다. 분로는 페란티, 직렬은 제5고조파, 소호는 지락전류, 한류는 단락전류를 막는다. [분페·직오·소지·한단]", "freq": "★★ 4회", "src": "[17-2] [12-3] [07-3] [02-2]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 255, "chap": "전력용 콘덴서·역률·고조파", "topic": "리액터", "q": "리액터의 종류(분로·직렬·소호·한류)와 각각의 사용 목적을 쓰시오.", "ans": "분로(병렬) 리액터 : 페란티 현상 방지\n직렬 리액터 : 제5고조파 제거\n소호 리액터 : 지락전류 제한\n한류 리액터 : 단락전류 제한", "h1": "분페 · 직오 · 소지 · 한단", "h2": "[무부하] 페란티 관련 항목을 현상 : 수전단 전압이 송전단 전압보다 높아지는 현상 → 원인 : 장거리 송전선로의 무부하(경부하) 시 선로 정전용량에 의한 진상 충전전류 → 대책 : 분로 리액터 설치 순서로 한 줄 기차처럼 이어 붙인다.", "freq": "★★ 4회", "src": "[23-3] [17-3] [15-3] [01-1]", "verify": "공사요약집 p.227 일치"}, {"id": 256, "chap": "전력용 콘덴서·역률·고조파", "topic": "페란티", "q": "페란티 현상이란 무엇이며, 발생 원인과 방지 대책을 쓰시오.", "ans": "현상 : 수전단 전압이 송전단 전압보다 높아지는 현상\n원인 : 장거리 송전선로의 무부하(경부하) 시 선로 정전용량에 의한 진상 충전전류\n대책 : 분로 리액터 설치", "h1": "무부하 + 긴 선로 = 끝이 더 높다 → 분로 L", "h2": "무효전력: “SVC = 사이리스터 + C + L”가 떠오르면 정답 문장을 복원한다 — 사이리스터를 이용하여 병렬 콘덴서와 분로 리액터를 신속하게 접속·제어함으로써 무효전력 및 전압을 제어하는 장치 (TCR·TSC 방식)", "freq": "★★ 4회", "src": "[23-3] [19-2] [15-3] [01-1]", "verify": "공사요약집 p.270 일치"}, {"id": 257, "chap": "전력용 콘덴서·역률·고조파", "topic": "무효전력", "q": "정지형 무효전력 보상장치(SVC)에 대하여 설명하시오.", "ans": "사이리스터를 이용하여 병렬 콘덴서와 분로 리액터를 신속하게 접속·제어함으로써 무효전력 및 전압을 제어하는 장치 (TCR·TSC 방식)", "h1": "SVC = 사이리스터 + C + L", "h2": "[조상] 무효전력을 설치하는 목표는 조상 = 동기조상기 → C → 분로 L이다.", "freq": "★ 1회 120제", "src": "[14-1]", "verify": "전기요약집 p.187 · 120제 일치"}, {"id": 258, "chap": "전력용 콘덴서·역률·고조파", "topic": "무효전력", "q": "조상설비의 설치 목적과 종류 3가지를 쓰시오.", "ans": "목적 : 무효전력을 제어하여 송·수전단 전압을 일정하게 유지하고 송전손실 경감 및 안정도 향상\n종류 : ① 동기조상기 ② 전력용 콘덴서 ③ 분로 리액터", "h1": "조상 = 동기조상기 · C · 분로 L", "h2": "[무역시압류] 개폐제어 체크리스트를 펼쳐 무효전력 → 역률 → 시간 → 전압 → 전류 순서로 하나씩 짚는다.", "freq": "-", "src": "-", "verify": "공사요약집 p.226 수록 문항 (공사기사 공통)"}, {"id": 259, "chap": "전력용 콘덴서·역률·고조파", "topic": "개폐제어", "q": "전력용 콘덴서 개폐제어 중 자동조작 방식을 제어요소에 따라 분류할 때 그 제어요소를 쓰시오.", "ans": "① 무효전력에 의한 제어\n② 역률에 의한 제어\n③ 전압에 의한 제어\n④ 전류에 의한 제어\n(그 외) 시간에 의한 제어", "h1": "무역시압류 → 무효전력 · 역률 · 시간 · 전압 · 전류", "h2": "[모지] 사고·보호 관련 항목을 콘덴서 소체 파괴 및 층간 절연파괴 → 콘덴서 설비의 모선 단락 및 지락 → 콘덴서 설비 내의 배선 단락 순서로 한 줄 기차처럼 이어 붙인다.", "freq": "★ 1회", "src": "[23-1]", "verify": "전기요약집 p.182 일치"}, {"id": 260, "chap": "전력용 콘덴서·역률·고조파", "topic": "사고·보호", "q": "콘덴서 설비의 주요 사고 원인 3가지를 쓰시오.", "ans": "① 콘덴서 소체 파괴 및 층간 절연파괴\n② 콘덴서 설비의 모선 단락 및 지락\n③ 콘덴서 설비 내의 배선 단락", "h1": "모지 배 소층", "h2": "보호계전기는 저전압·과전압·과전류를 감시하고, 지락 때는 지락과전압·지락과전류를 감시한다.", "freq": "★ 1회 120제", "src": "[10-2]", "verify": "전기요약집 p.182 · 350제 154번 · 120제 일치"}, {"id": 261, "chap": "전력용 콘덴서·역률·고조파", "topic": "사고·보호", "q": "고압 회로용 진상 콘덴서 설비의 보호장치에 사용되는 계전기 3가지를 쓰시오.", "ans": "① 부족전압 계전기\n② 과전압 계전기\n③ 과전류 계전기\n(그 외) 지락 과전압 계전기, 지락 과전류 계전기", "h1": "저압류 지압류 → 저전압 · 과전압 · 과전류 / 지락과전압 · 지락과전류", "h2": "[NN] 사고·보호 관련 항목을 NCS : 콘덴서 고장 시 중성점 간에 흐르는 전류를 검출 → NVS : 콘덴서 고장 시 중성점 간의 불평형 전압을 검출 순서로 한 줄 기차처럼 이어 붙인다.", "freq": "★ 1회", "src": "[06-1]", "verify": "전기요약집 p.182 · 350제 155번 일치"}, {"id": 262, "chap": "전력용 콘덴서·역률·고조파", "topic": "사고·보호", "q": "고압 진상용 콘덴서의 내부고장 보호방식 중 NCS와 NVS의 기능을 설명하시오.", "ans": "NCS : 콘덴서 고장 시 중성점 간에 흐르는 전류를 검출\nNVS : 콘덴서 고장 시 중성점 간의 불평형 전압을 검출", "h1": "C = Current(전류), V = Voltage(전압)", "h2": "[유용단애] 사고·보호에서는 유누설 → 용기발청 → 단자 → 애자 순서로 장면을 이어 간다.", "freq": "★ 1회", "src": "[12-2]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 263, "chap": "전력용 콘덴서·역률·고조파", "topic": "사고·보호", "q": "전력용 진상 콘덴서의 정기점검(육안검사) 항목 3가지를 쓰시오.", "ans": "① 단자부 이완 및 과열 유무\n② 애자 손상 여부\n③ 기름(유) 누설 유무\n(그 외) 용기의 발청(녹) 유무", "h1": "유용단애 → 유누설 · 용기발청 · 단자 · 애자", "h2": "[집중] 설치에서는 집중 → 분산 → 개별 순서로 장면을 이어 간다.", "freq": "★ 2회", "src": "[16-2] [12-3]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 264, "chap": "전력용 콘덴서·역률·고조파", "topic": "설치", "q": "진상용 콘덴서를 설치하는 방법 3가지를 쓰시오.", "ans": "① 고압측(수전측 모선)에 집중 설치\n② 고압측과 부하측에 분산 설치\n③ 부하 말단에 분산(개별) 설치", "h1": "집중 · 분산 · 개별", "h2": "[개별] 설치 적용 장면에서는 장점 : 전력손실 경감 효과가 크다 → 단점 : 설치 및 유지보수 비용이 증가한다 순서로 장점이 차례로 나타난다.", "freq": "-", "src": "-", "verify": "공사요약집 p.225 수록 문항 (공사기사 공통)"}, {"id": 265, "chap": "전력용 콘덴서·역률·고조파", "topic": "설치", "q": "콘덴서를 부하에 개별로 설치할 경우의 장점과 단점을 쓰시오.", "ans": "장점 : 전력손실 경감 효과가 크다.\n단점 : 설치 및 유지보수 비용이 증가한다.", "h1": "개별 = 효과↑ 비용↑", "h2": "[고조파] 설치 적용 장면에서는 고조파 있을 때 → 돌입전류 클 때 순서로 장점이 차례로 나타난다.", "freq": "-", "src": "-", "verify": "전기요약집 p.180 일치"}, {"id": 266, "chap": "전력용 콘덴서·역률·고조파", "topic": "설치", "q": "콘덴서 회로에 직렬 리액터를 반드시 넣어야 하는 경우 2가지와 그 효과를 쓰시오.", "ans": "① 부하설비로 인한 고조파가 존재하는 경우 → 제5고조파에 의한 전압 파형 일그러짐 방지\n② 콘덴서 투입 시 큰 돌입전류가 전원계통·부하설비에 악영향을 줄 우려가 있는 경우 → 돌입전류 억제", "h1": "고조파 있을 때 · 돌입전류 클 때", "h2": "[송전용변아인] 고조파 관련 항목을 코로나 → 전력용 콘덴서 → 용접기 → 변압기여자 → 아크로 → 인버터 순서로 한 줄 기차처럼 이어 붙인다.", "freq": "-", "src": "-", "verify": "전기요약집 p.187 · 350제 159번 일치"}, {"id": 267, "chap": "전력용 콘덴서·역률·고조파", "topic": "고조파", "q": "고조파 전류의 발생 원인 3가지를 쓰시오.", "ans": "① 컨버터·인버터·초퍼 등 전력변환장치\n② 변압기·전동기 등의 여자전류(철심 포화)\n③ 전기로·아크로\n(그 외) 송전선로 코로나, 용접기, 전력용 콘덴서", "h1": "송전용변아인 → 코로나 · 전력용 콘덴서 · 용접기 · 변압기여자 · 아크로 · 인버터", "h2": "[보통3기] 고조파에서는 보호계전기 → 통신선 → 3상4선 중성선 → 기기과열 순서로 장면을 이어 간다.", "freq": "★★★ 8회 120제", "src": "[17-2] [14-2] [08-1] [07-3] [07-1] [06-2] [02-3] [01-2]", "verify": "350제 337번 · 120제 일치"}, {"id": 268, "chap": "전력용 콘덴서·역률·고조파", "topic": "고조파", "q": "고조파 전류가 미치는 영향 4가지를 쓰시오.", "ans": "① 3상 4선식 회로의 중성선 과열\n② 전력용 기기(변압기·콘덴서·전동기)의 과열 및 소손\n③ 통신선의 유도장해\n④ 보호계전기의 오동작", "h1": "보통3기 → 보호계전기 · 통신선 · 3상4선 중성선 · 기기과열", "h2": "[필펄델이차] 고조파 대책반이 필터 → 펄스↑ → Δ결선 → 이격 → 차폐 순서로 조치하는 장면을 그린다.", "freq": "★★★ 8회", "src": "[17-2] [14-2] [08-1] [07-3] [07-1] [06-2] [02-3] [01-2]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 269, "chap": "전력용 콘덴서·역률·고조파", "topic": "고조파", "q": "고조파 전류를 방지하기 위한 대책 5가지를 쓰시오.", "ans": "① 고조파 필터(수동·능동)를 사용한다.\n② 전력변환장치의 펄스(Pulse) 수를 크게 한다.\n③ 변압기 Δ결선을 채용한다.\n④ 고조파 발생기기와 충분히 이격한다(접지 분리).\n⑤ 차폐 케이블을 사용한다.\n(그 외) 콘덴서에 직렬 리액터 설치", "h1": "필펄델이차 → 필터 · 펄스↑ · Δ결선 · 이격 · 차폐", "h2": "고조파 계산은 계산식 : THD = √(V3² + V5² + … + Vn²) / V1 × 100 [%] 순서로 쓴다. 입으로는 “THD = 고조파 제곱합 루트 ÷ 기본파”라고 읽는다.", "freq": "★★★ 8회", "src": "[17-2] [14-2] [08-1] [07-3] [07-1] [06-2] [02-3] [01-2]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 270, "chap": "전력용 콘덴서·역률·고조파", "topic": "고조파", "q": "THD(Total Harmonics Distortion)의 정의와 계산식을 쓰시오. (기본파 V1, 고조파 V3·V5·…·Vn)", "ans": "정의 : 기본파 실효값에 대한 전 고조파 실효값의 비 (전고조파 왜형률)\n계산식 : THD = √(V3² + V5² + … + Vn²) / V1 × 100 [%]", "h1": "THD = 고조파 제곱합 루트 ÷ 기본파", "h2": "[직렬리액터] 고조파에서는 진상 콘덴서 → 직렬 → 리액터 순서로 장면을 이어 간다.", "freq": "★ 1회", "src": "[15-2]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 271, "chap": "전력용 콘덴서·역률·고조파", "topic": "고조파", "q": "빈칸을 채우시오.\n회로 전압은 변압기의 자기포화에 의해 변형이 일어나는데 ( ① )를 접속함으로써 변형이 확대되는 경우가 있어, 이 전압 파형 찌그러짐을 개선하기 위해 ( ① )와 ( ② )로 ( ③ )를 설치한다.", "ans": "① 진상 콘덴서\n② 직렬\n③ 리액터", "h1": "콘덴서에 '직렬 리액터'", "h2": "K-Factor는 변압기가 고조파 전류의 발열을 얼마나 견딜 수 있는지를 나타내는 수치다.", "freq": "-", "src": "-", "verify": "전기요약집 p.138 일치"}, {"id": 272, "chap": "전력용 콘덴서·역률·고조파", "topic": "고조파", "q": "비선형 부하에 의해 고조파 영향을 받는 변압기 등이 과열 없이 부하에 전력을 안정적으로 공급할 수 있는 능력을 나타내는 용어는?", "ans": "K-Factor", "h1": "K-Factor = 고조파 견디는 능력", "h2": "[투입] 직렬리액터 대책반이 방전된(무전압) 콘덴서를 전원에 투입하는 순간 콘덴서가 급격히 충전되며 흐르는, 정격전류보다 매우 큰 과도전류 → 대책 : 직렬 리액터 설치 순서로 조치하는 장면을 그린다.", "freq": "-", "src": "-", "verify": "공사요약집 p.239 수록 문항 (공사기사 공통)"}, {"id": 273, "chap": "전력용 콘덴서·역률·고조파", "topic": "직렬리액터", "q": "콘덴서 투입 시 발생하는 돌입전류란 무엇이며 억제 대책은?", "ans": "방전된(무전압) 콘덴서를 전원에 투입하는 순간 콘덴서가 급격히 충전되며 흐르는, 정격전류보다 매우 큰 과도전류\n대책 : 직렬 리액터 설치", "h1": "투입 순간 과도전류 → 직렬 L", "h2": "[응조유신] 무효전력 적용 장면에서는 응답 특성이 빠르다 → 조작에 제한이 없다 → 유지·보수가 간단하다 → 신뢰성이 높다 순서로 장점이 차례로 나타난다.", "freq": "-", "src": "-", "verify": "350제 158번 수록 문항"}, {"id": 274, "chap": "전력용 콘덴서·역률·고조파", "topic": "무효전력", "q": "정지형 무효전력 보상장치(SVC)의 장점을 쓰시오.", "ans": "① 응답 특성이 빠르다.\n② 조작에 제한이 없다.\n③ 유지·보수가 간단하다.\n④ 신뢰성이 높다.", "h1": "응조유신", "h2": "", "freq": "-", "src": "-", "verify": "350제 168번 수록 문항"}, {"id": 275, "chap": "전력퓨즈", "topic": "역할", "q": "전력용 퓨즈의 역할 2가지를 쓰시오.", "ans": "① 부하전류는 안전하게 통전한다.\n② 일정값 이상의 과전류(단락전류)는 차단하여 전로나 기기를 보호한다.", "h1": "통전 + 과차 전기보", "h2": "[PF] 역할을 설치하는 목표는 PF = 단락 전용이다.", "freq": "★★★ 7회", "src": "[18-1] [16-2] [06-3] [06-2] [03-1] [02-2] [02-1]", "verify": "전기요약집 p.191 일치"}, {"id": 276, "chap": "전력퓨즈", "topic": "역할", "q": "전력퓨즈는 과전류 중 주로 어떤 전류의 차단을 목적으로 하는가?", "ans": "단락전류", "h1": "PF = 단락 전용", "h2": "단점: “한 번 끊기면 끝”가 떠오르면 정답 문장을 복원한다 — 동작 후 재투입이 불가능하다.", "freq": "- 120제", "src": "-", "verify": "공사요약집 p.218 일치 · 고압 전력용 퓨즈 = 단락전류 차단 주목적 전기요약집 p.188 · 350제 169번 · 120제 일치"}, {"id": 277, "chap": "전력퓨즈", "topic": "단점", "q": "전력용 퓨즈의 가장 큰 단점은 무엇인가?", "ans": "동작 후 재투입이 불가능하다.", "h1": "한 번 끊기면 끝", "h2": "[차비] 단점 점검 장면에서는 차단과전압 → 비보호영역 → 재투입불가 → 사용중열화 → 과전류용단 순서로 단점이 드러난다.", "freq": "★★★ 7회 120제", "src": "[18-1] [16-2] [06-3] [06-2] [03-1] [02-2] [02-1]", "verify": "120제 일치"}, {"id": 278, "chap": "전력퓨즈", "topic": "단점", "q": "한류형 전력퓨즈(PF)의 단점을 쓰시오.", "ans": "① 동작 후 재투입이 불가능하다.\n② 차단 시 과전압(이상전압)이 발생한다.\n③ 과도전류(과전류)에 용단되기 쉽다.\n④ 비보호 영역이 존재한다.\n(그 외) 사용 중 열화되어 결상되기 쉽다.\n(그 외) 동작시간-전류 특성을 계전기처럼 자유롭게 조정할 수 없다, 고임피던스 접지계통의 지락보호는 불가능하다.", "h1": "차비 재투입 사과 → 차단과전압 · 비보호영역 · 재투입불가 · 사용중열화 · 과전류용단", "h2": "[고릴라에게] 장점 적용 장면에서는 고속 → 릴레이불요 → 소형 → 가격 → 소형대용량 순서로 장점이 차례로 나타난다.", "freq": "★ 2회", "src": "[24-3] [20-1]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 279, "chap": "전력퓨즈", "topic": "장점", "q": "전력퓨즈의 장점을 쓰시오.", "ans": "① 고속도 차단이 가능하다.\n② 릴레이나 변성기가 필요 없다.\n③ 소형·경량이며 가격이 저렴하다.\n④ 소형으로 큰 차단용량을 가진다.", "h1": "고릴라에게 소가소 → 고속 · 릴레이불요 · 소형 · 가격 · 소형대용량", "h2": "[사용결계] 전력퓨즈는 전용품을 사용하고, 결상계전기를 붙이며, 계통 절연강도를 과전압보다 높인다.", "freq": "-", "src": "-", "verify": "전기요약집 p.189 일치"}, {"id": 280, "chap": "전력퓨즈", "topic": "단점 보완", "q": "전력퓨즈의 단점을 보완하기 위한 대책 3가지를 쓰시오.", "ans": "① 사용 목적에 적합한 전용의 전력퓨즈를 사용한다.\n② 결상 계전기를 사용한다.\n③ 계통의 절연강도를 전력퓨즈의 과전압 값보다 높게 한다.", "h1": "사용결계 → 전용퓨즈 · 결상계전기 · 절연강도↑", "h2": "[정차장] 선정 체크리스트를 펼쳐 정격전압 → 정격전류 → 정격차단전류 → 사용장소 순서로 하나씩 짚는다.", "freq": "- 120제", "src": "-", "verify": "전기요약집 p.190 · 120제 일치"}, {"id": 281, "chap": "전력퓨즈", "topic": "선정", "q": "퓨즈 구매 시 기능상 고려해야 할 요소 4가지를 쓰시오.", "ans": "① 정격전압\n② 정격전류\n③ 정격차단전류\n④ 사용장소", "h1": "정차장 (+정격전압)", "h2": "[과부] 선정점검표에서 과부 → 여자 → 보호협조 → 정차장 순서로 확인한다.", "freq": "★★ 3회", "src": "[18-1] [06-2] [02-2]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 282, "chap": "전력퓨즈", "topic": "선정", "q": "전력퓨즈 선정 시 고려해야 할 사항을 쓰시오.", "ans": "① 과부하 전류에 동작하지 말 것\n② 변압기 여자 돌입전류에 동작하지 말 것\n③ 다른 보호기기와 보호협조를 가질 것\n④ 정격전압·정격전류·정격차단전류·사용장소를 고려할 것\n⑤ 기동전류에 동작하지 말 것 / 정격차단용량, 최소차단전류, 전류-시간 특성", "h1": "과부 · 여자 · 보호협조 · 정차장", "h2": "[단시간] 특성에서는 단시간허용 → 전차단 → 용단 순서로 장면을 이어 간다.", "freq": "- 120제", "src": "-", "verify": "전기요약집 p.188 · 120제 일치"}, {"id": 283, "chap": "전력퓨즈", "topic": "특성", "q": "퓨즈의 성능(특성) 3가지를 쓰시오.", "ans": "① 용단 특성\n② 단시간 허용 특성\n③ 전차단 특성", "h1": "단시간 전용 → 단시간허용 · 전차단 · 용단", "h2": "[퓨즈] 개폐장치 비교에서는 퓨즈 : 단락 차단 (회로 분리 가능) → 차단기 : 무부하·부하·과부하·단락 모두 가능 → 개폐기 : 무부하·부하·과부하 (개폐빈도 적음) → 단로기 : 무부하(회로 분리)만 가능 → 전자접촉기 : 무부하·부하·과부하 (개폐빈도 많음) 순서로 장면을 이어 간다.", "freq": "★★ 3회", "src": "[18-1] [16-2] [06-2]", "verify": "전기요약집 p.189 일치"}, {"id": 284, "chap": "전력퓨즈", "topic": "개폐장치 비교", "q": "개폐장치(퓨즈·차단기·개폐기·단로기·전자접촉기)의 동작 가능 범위를 무부하·부하·과부하·단락으로 구분하여 쓰시오.", "ans": "퓨즈 : 단락 차단 (회로 분리 가능)\n차단기 : 무부하·부하·과부하·단락 모두 가능\n개폐기 : 무부하·부하·과부하 (개폐빈도 적음)\n단로기 : 무부하(회로 분리)만 가능\n전자접촉기 : 무부하·부하·과부하 (개폐빈도 많음)", "h1": "퓨즈 = 단락만, 차단기 = 전부, 단로기 = 무부하만", "h2": "정격 숫자는 6.6 → 6.9 → 7.5 → 13.2 → 15 → 22.9 → 23 → 66 → 69 → 154 → 161 순서로 묶고, “6.9/7.5 · 15 · 23 · 69 · 161”라는 리듬으로 외운다.", "freq": "★ 2회", "src": "[06-3] [03-1]", "verify": "HWP 기준 (엑셀·교재 미수록)"}, {"id": 285, "chap": "전력퓨즈", "topic": "정격", "q": "계통전압별 전력퓨즈의 정격 제어 → 보안 → 충전 순서로 하나씩 짚는다.", "freq": "★★ 3회", "src": "[19-2] [11-1] [06-1]", "verify": "공사요약집 p.196 일치 전기요약집 p.173 일치"}, {"id": 296, "chap": "축전지·UPS·예비전원", "topic": "축전지 기본", "q": "축전지 설비의 구성요소 4가지를 쓰시오.", "ans": "① 축전지\n② 충전장치\n③ 보안장치\n④ 제어장치", "h1": "축제보충 → 축전지 · 제어 · 보안 · 충전", "h2": "축전지 기본 계산은 C = (1/L) × K × I [Ah] 순서로 쓴다. 입으로는 “C = KI ÷ L (L = 보수율 0.8)”라고 읽는다.", "freq": "★★ 3회 120제", "src": "[19-2] [11-1] [06-1]", "verify": "공사요약집 p.195 일치 전기요약집 p.173 · 120제 일치"}, {"id": 297, "chap": "축전지·UPS·예비전원", "topic": "축전지 기본", "q": "축전지 용량을 구하는 공식을 쓰고 각 기호의 의미를 설명하시오.", "ans": "C = (1/L) × K × I [Ah]\nC : 축전지 용량[Ah], L : 보수율(경년용량 저하율, 보통 0.8), K : 용량환산 시간계수, I : 방전전류[A]", "h1": "C = KI ÷ L (L = 보수율 0.8)", "h2": "축전지 기본: “보수율 = 늙어서 줄어드는 만큼 보정”가 떠오르면 정답 문장을 복원한다 — 사용 연수 경과나 사용 조건 변동에 의한 축전지 용량 변화를 보상하는 보정값 (경년용량 저하율, 보통 0.8)", "freq": "★★★ 6회", "src": "[18-2] [09-3] [05-3] [04-2] [01-2] [01-1]", "verify": "공사요약집 p.202 일치"}, {"id": 298, "chap": "축전지·UPS·예비전원", "topic": "축전지 기본", "q": "축전지 용량 계산식에서 보수율(L)의 의미를 쓰시오.", "ans": "사용 연수 경과나 사용 조건 변동에 의한 축전지 용량 변화를 보상하는 보정값 (경년용량 저하율, 보통 0.8)", "h1": "보수율 = 늙어서 줄어드는 만큼 보정", "h2": "축전지 기본 숫자는 115 → 5 → 55 → 2.18 순서로 묶고, “(부하 + 강하) ÷ 셀 수”라는 리듬으로 외운다.", "freq": "★ 1회", "src": "[01-2]", "verify": "공사요약집 p.197 일치"}, {"id": 299, "chap": "축전지·UPS·예비전원", "topic": "축전지 기본", "q": "부하의 최저전압이 직류 115[V]이고 축전지와 부하 사이 전압강하가 5[V], 직렬 축전지 수가 55개일 때 축전지 1셀당 최저전압은?", "ans": "산출식 : V = (부하 최저전압 + 전압강하) / 셀 수\n적용 : V = (115 + 5) / 55\n결과 : V ≒ 2.18 [V/cell]", "h1": "(부하 + 강하) ÷ 셀 수", "h2": "[수진] 알칼리 적용 장면에서는 수진 충청도 방언 사용 → 연가 (연축보다 전압↓ · 가격↑) 순서로 장점이 차례로 나타난다.", "freq": "★★ 3회", "src": "[19-2] [11-1] [06-1]", "verify": "엑셀 원문 기준 (교재·HWP 미수록)"}, {"id": 300, "chap": "축전지·UPS·예비전원", "topic": "알칼리", "q": "연축전지와 비교할 때 알칼리 축전지의 장점과 단점을 쓰시오.", "ans": "장점 : ① 수명이 길다 ② 진동·충격에 강하다 ③ 충방전 특성이 양호하다 ④ 방전 시 전압변동이 작다 ⑤ 사용 온도범위가 넓다\n단점 : ① 연축전지보다 공칭전압(셀당 전압)이 낮다 ② 가격이 비싸다", "h1": "수진 충청도 방언 사용 / 연가 (연축보다 전압↓ · 가격↑)", "h2": "고장·관리: “농도 정상 + 액면↓ = 증류수”가 떠오르면 정답 문장을 복원한다 — 증류수를 보충한다.", "freq": "★ 2회 120제", "src": "[17-2] [02-3]", "verify": "전기요약집 p.170 · 120제 일치"}, {"id": 301, "chap": "축전지·UPS·예비전원", "topic": "고장·관리", "q": "연축전지 전해액의 묽은 황산 농도는 표준이나 액면이 저하하여 극판이 노출되어 있다. 어떤 조치를 하여야 하는가?", "ans": "증류수를 보충한다.", "h1": "농도 정상 + 액면↓ = 증류수", "h2": "[충전] 고장·관리점검표에서 환기 → 화기엄금 순서로 확인한다.", "freq": "★★ 3회", "src": "[19-2] [11-1] [06-1]", "verify": "공사요약집 p.197 일치 전기요약집 p.177 일치"}, {"id": 302, "chap": "축전지·UPS·예비전원", "topic": "고장·관리", "q": "연축전지 충전 시 발생하는 가스의 종류와 주의사항을 쓰시오.", "ans": "가스 : 수소 가스\n주의사항 : 환기에 주의하고 화기를 엄금한다.", "h1": "충전 = 수소 → 환기·화기엄금", "h2": "고장·관리: “충전 부족 방치 → 극판 하얗게 = 설페이션”가 떠오르면 정답 문장을 복원한다 — 극판의 황산납이 회백색으로 변하고(백색 반점) 내부저항이 크게 증가하여, 충전 시 전해액 온도 상승이 크고 비중 상승이 낮으며 가스 발생이 심해져 용량이 감퇴하고 수명이 단축되는 현상", "freq": "★★★ 5회", "src": "[24-3] [17-3] [13-2] [06-2] [05-1]", "verify": "공사요약집 p.197 일치"}, {"id": 303, "chap": "축전지·UPS·예비전원", "topic": "고장·관리", "q": "납축전지를 방전 상태로 오래 방치했을 때 생기는 설페이션(Sulfation) 현상을 설명하시오.", "ans": "극판의 황산납이 회백색으로 변하고(백색 반점) 내부저항이 크게 증가하여, 충전 시 전해액 온도 상승이 크고 비중 상승이 낮으며 가스 발생이 심해져 용량이 감퇴하고 수명이 단축되는 현상", "h1": "충전 부족 방치 → 극판 하얗게 = 설페이션", "h2": "[비가] 고장·관리 관련 항목을 비중↓ = 충전부족 / 비중↑ = 물부족 / 변색 → 가스 = 불순물 순서로 한 줄 기차처럼 이어 붙인다.", "freq": "★★★ 5회", "src": "[24-3] [17-3] [13-2] [06-2] [05-1]", "verify": "공사요약집 p.199 일치"}, {"id": 304, "chap": "축전지·UPS·예비전원", "topic": "고장·관리", "q": "연축전지의 고장 현상별 추정 원인을 쓰시오.\n① 전 셀의 전압 불균일이 크고 비중이 낮다.\n② 전 셀의 비중이 높다.\n③ 전해액이 변색되고 충전하지 않아도 다량의 가스가 발생한다.", "ans": "① 충전 부족 상태로 장시간 방치\n② 증류수 부족\n③ 전해액에 불순물 혼입", "h1": "비중↓ = 충전부족 / 비중↑ = 물부족 / 변색·가스 = 불순물", "h2": "고장·관리: “전압계 역전 = 거꾸로 연결”가 떠오르면 정답 문장을 복원한다 — 축전지의 역접속", "freq": "★ 1회", "src": "[05-1]", "verify": "공사요약집 p.197 대조·보완: ③ 불순물 혼입 일치, ①② 는 엑셀·HWP 기준"}, {"id": 305, "chap": "축전지·UPS·예비전원", "topic": "고장·관리", "q": "연축전지 설비 초기에 단전지 전압의 비중이 저하되고 전압계가 역전하였다. 추정 원인은?", "ans": "축전지의 역접속", "h1": "전압계 역전 = 거꾸로 연결", "h2": "축전지를 과충전하거나 극판을 노출시키면 열이 나고, 심해지면 소손으로 이어진다.", "freq": "★ 2회", "src": "[14-1] [01-1]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 306, "chap": "축전지·UPS·예비전원", "topic": "고장·관리", "q": "충전장치 고장, 과충전, 액면 저하로 인한 극판 노출, 교류분 전류 유입 과대 등의 원인으로 발생할 수 있는 현상은?", "ans": "축전지의 현저한 온도 상승 또는 소손", "h1": "과충전·극판노출 → 열·소손", "h2": "고장·관리: “환보외균누화”가 떠오르면 정답 문장을 복원한다 — ① 충분한 환기 ② 보호장구 착용 ③ 외부 손상 여부 점검 ④ 균열 여부 점검 ⑤ 누액 여부 점검 ⑥ 화기 엄금", "freq": "★ 2회", "src": "[14-1] [01-1]", "verify": "전기요약집 p.172 · 350제 311번 일치"}, {"id": 307, "chap": "축전지·UPS·예비전원", "topic": "고장·관리", "q": "축전지실을 점검 또는 보수할 때의 유의점을 쓰시오.", "ans": "① 충분한 환기 ② 보호장구 착용 ③ 외부 손상 여부 점검 ④ 균열 여부 점검 ⑤ 누액 여부 점검 ⑥ 화기 엄금", "h1": "환보외균누화", "h2": "[30] KEC점검표에서 30 → 개폐기 → 과전류 보호장치 순서로 확인한다.", "freq": "-", "src": "-", "verify": "공사요약집 p.195 수록 문항 (공사기사 공통)"}, {"id": 308, "chap": "축전지·UPS·예비전원", "topic": "KEC", "q": "KEC 축전지 시설 기준 빈칸을 채우시오.\n( ① )[V]를 초과하는 축전지는 비접지측 도체에 쉽게 차단할 수 있는 곳에 ( ② )를 시설하고, 옥내전로에 연계되는 축전지는 비접지측 도체에 ( ③ )를 시설하여야 한다.", "ans": "① 30\n② 개폐기\n③ 과전류 보호장치", "h1": "30 V 초과 → 개폐기, 옥내 연계 → 과전류 보호", "h2": "[UPS] UPS을 설치하는 목표는 명칭 : 무정전 전원 공급 장치 (Uninterruptible Power Supply) → 목적 : 상시전원의 정전 또는 이상 상태가 발생하여도 정상적으로 안정된 전력을 부하에 공급하기 위해이다.", "freq": "★ 1회", "src": "[26-1]", "verify": "엑셀 원문 기준 (교재·HWP 미수록)"}, {"id": 309, "chap": "축전지·UPS·예비전원", "topic": "UPS", "q": "UPS의 우리말 명칭과 사용 목적을 쓰시오.", "ans": "명칭 : 무정전 전원 공급 장치 (Uninterruptible Power Supply)\n목적 : 상시전원의 정전 또는 이상 상태가 발생하여도 정상적으로 안정된 전력을 부하에 공급하기 위해", "h1": "UPS = 끊김 없는 전원", "h2": "[컨버터] UPS 체크리스트를 펼쳐 AC → DC : 컨버터 (정류기, 순변환장치) → DC → AC : 인버터 (역변환장치) 순서로 하나씩 짚는다.", "freq": "★★★ 7회", "src": "[18-2] [13-3] [09-3] [06-3] [05-3] [04-2] [01-1]", "verify": "공사요약집 p.200 일치"}, {"id": 310, "chap": "축전지·UPS·예비전원", "topic": "UPS", "q": "UPS에서 AC → DC 변환부와 DC → AC 변환부의 명칭을 쓰시오.", "ans": "AC → DC : 컨버터 (정류기, 순변환장치)\nDC → AC : 인버터 (역변환장치)", "h1": "컨버터 = 교류→직류, 인버터 = 직류→교류", "h2": "[CV] UPS에서는 CVCF : 정전압 정주파수 전원 공급장치 (Constant Voltage Constant Frequency) → VVVF : 가변전압 가변주파수 장치 (Variable Voltage Variable Frequency) 순서로 장면을 이어 간다.", "freq": "★★★ 12회", "src": "[24-3] [18-2] [17-3] [13-3] [13-2] [09-3] [06-3] [06-2] [05-3] [05-1] [04-2] [01-1]", "verify": "공사요약집 p.240 일치 전기요약집 p.174 일치"}, {"id": 311, "chap": "축전지·UPS·예비전원", "topic": "UPS", "q": "CVCF와 VVVF는 무엇을 뜻하는가?", "ans": "CVCF : 정전압 정주파수 전원 공급장치 (Constant Voltage Constant Frequency)\nVVVF : 가변전압 가변주파수 장치 (Variable Voltage Variable Frequency)", "h1": "C = Constant(일정), V = Variable(가변)", "h2": "[평상시] UPS에서는 평상시 교류전원을 컨버터로 직류로 변환하여 축전지를 충전한다 → 이때 상용전원은 AVR과 무접점 절체스위치를 통해 부하에 공급된다 → 정전 시 축전지 직류를 인버터로 안정된 교류로 역변환하여 부하에 공급한다 → 축전지 용량이 부족하면 비상발전기를 운전한다 순서로 장면을 이어 간다.", "freq": "★ 2회", "src": "[13-3] [06-3]", "verify": "공사요약집 p.201 일치 · UPS 기능 = 무정전 + 정전압정주파수"}, {"id": 312, "chap": "축전지·UPS·예비전원", "topic": "UPS", "q": "UPS의 동작 원리를 간단히 설명하시오.", "ans": "① 평상시 교류전원을 컨버터로 직류로 변환하여 축전지를 충전한다.\n② 이때 상용전원은 AVR과 무접점 절체스위치를 통해 부하에 공급된다.\n③ 정전 시 축전지 직류를 인버터로 안정된 교류로 역변환하여 부하에 공급한다.\n④ 축전지 용량이 부족하면 비상발전기를 운전한다.", "h1": "평상시 충전 → 정전 시 인버터 → 부족하면 발전기", "h2": "UPS: “바이패스 = UPS 쉬는 동안 직송”가 떠오르면 정답 문장을 복원한다 — UPS나 축전지의 점검·보수 및 고장 시에도 부하에 연속적으로 전력을 공급하기 위해서 (회로 절연 목적도 있음)", "freq": "★ 2회", "src": "[08-3] [02-2]", "verify": "HWP 기준 (엑셀·교재 미수록)"}, {"id": 313, "chap": "축전지·UPS·예비전원", "topic": "UPS", "q": "UPS 회로에 Bypass 변압기(바이패스 회로)를 설치하는 이유를 쓰시오.", "ans": "UPS나 축전지의 점검·보수 및 고장 시에도 부하에 연속적으로 전력을 공급하기 위해서 (회로 절연 목적도 있음)", "h1": "바이패스 = UPS 쉬는 동안 직송", "h2": "[배속반] UPS 관련 항목을 배선용 차단기(MCCB)에 의한 보호 → 속단 퓨즈에 의한 보호 → 반도체 차단기에 의한 보호 순서로 한 줄 기차처럼 이어 붙인다.", "freq": "★ 1회", "src": "[05-2]", "verify": "공사요약집 p.200 일치"}, {"id": 314, "chap": "축전지·UPS·예비전원", "topic": "UPS", "q": "사용 중인 UPS 2차측에 단락사고 등이 발생했을 때 UPS와 고장회로를 분리하는 방식 3가지를 쓰시오.", "ans": "① 배선용 차단기(MCCB)에 의한 보호\n② 속단 퓨즈에 의한 보호\n③ 반도체 차단기에 의한 보호", "h1": "배속반", "h2": "UPS: “부정순제경온”가 떠오르면 정답 문장을 복원한다 — ① 부하의 크기와 성질 ② 예상 정전시간 ③ 순시 최대 방전전류의 세기 ④ 제어 케이블에 의한 전압강하 ⑤ 경년에 의한 용량 감소 ⑥ 온도 변화에 의한 용량 보정", "freq": "★ 2회", "src": "[24-1] [15-3]", "verify": "전기요약집 p.175 일치"}, {"id": 315, "chap": "축전지·UPS·예비전원", "topic": "UPS", "q": "UPS용 축전지 용량 산정 시 필요조건을 쓰시오.", "ans": "① 부하의 크기와 성질 ② 예상 정전시간 ③ 순시 최대 방전전류의 세기 ④ 제어 케이블에 의한 전압강하 ⑤ 경년에 의한 용량 감소 ⑥ 온도 변화에 의한 용량 보정", "h1": "부정순제경온", "h2": "[병렬] 예비전원점검표에서 인터록 → 전환개폐기 순서로 확인한다.", "freq": "-", "src": "-", "verify": "공사요약집 p.200 수록 문항 (공사기사 공통)"}, {"id": 316, "chap": "축전지·UPS·예비전원", "topic": "예비전원", "q": "상용전원과 예비전원 운전 시 유의사항 빈칸을 채우시오.\n상용전원과 예비전원 사이에는 병렬운전을 하지 않는 것이 원칙이므로 수전용 차단기와 발전용 차단기 사이에는 전기적 또는 기계적 ( ① )을 시설하고 ( ② )를 사용해야 한다.", "ans": "① 인터록\n② 전환개폐기", "h1": "병렬 금지 → 인터록 + 전환개폐기", "h2": "예비전원: “동시투입 방지 = 인터록”가 떠오르면 정답 문장을 복원한다 — 인터록 (Interlock)", "freq": "★★ 3회", "src": "[22-3] [18-2] [12-2]", "verify": "공사요약집 p.194 일치 전기요약집 p.168 · 350제 302번 일치"}, {"id": 317, "chap": "축전지·UPS·예비전원", "topic": "예비전원", "q": "상용전원과 예비전원의 동시 투입을 방지하는 회로(장치)는?", "ans": "인터록 (Interlock)", "h1": "동시투입 방지 = 인터록", "h2": "예비전원 체크리스트를 펼쳐 무 → 0.15 → 0.5 → 5 → 15 → 15↑ 순서로 하나씩 짚는다.", "freq": "★ 1회", "src": "[11-3]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 318, "chap": "축전지·UPS·예비전원", "topic": "예비전원", "q": "비상용 예비전원설비를 상용전원 정전 시 자동 전원공급 절환시간에 따라 분류하시오.", "ans": "① 무순단 : 과도시간 내 전압·주파수 변동 등 정해진 조건에서 연속 공급\n② 순단 : 0.15초 이내\n③ 단시간 차단 : 0.5초 이내\n④ 보통 차단 : 5초 이내\n⑤ 중간 차단 : 15초 이내\n⑥ 장시간 차단 : 15초 이후", "h1": "무 · 0.15 · 0.5 · 5 · 15 · 15↑", "h2": "발전기 출력회로를 따라 개폐기 → 과전류차단기 → 전압계 → 전류계 순으로 만난다. [개과전전]", "freq": "★ 1회", "src": "[25-1]", "verify": "전기요약집 p.240 · 350제 200번 일치"}, {"id": 319, "chap": "축전지·UPS·예비전원", "topic": "발전기", "q": "예비전원으로 시설하는 고압(저압) 발전기에서 부하에 이르는 전로에 발전기 가까운 곳에 반드시 시설해야 할 기기 4가지와 시설기준을 쓰시오.", "ans": "① 개폐기 : 쉽게 개폐할 수 있는 장소의 각 극에 설치\n② 과전류 차단기 : 쉽게 개폐할 수 있는 장소의 각 극에 설치\n③ 전압계 : 각 상의 전압을 읽을 수 있도록 설치\n④ 전류계 : 각 선의 전류를 읽을 수 있도록 설치", "h1": "개과전전 → 개폐기 · 과전류차단기 · 전압계 · 전류계", "h2": "발전기실 천장을 정할 때는 부속설비가 들어갈 높이를 먼저 재고, 설치·유지보수 공간까지 남긴다.", "freq": "★★ 3회", "src": "[06-2] [03-3] [03-2]", "verify": "공사요약집 p.194 일치 전기요약집 p.168 일치"}, {"id": 320, "chap": "축전지·UPS·예비전원", "topic": "발전기", "q": "발전기실 건물의 높이를 결정하는 데 필요한 사항 2가지를 쓰시오.", "ans": "① 발전기 부속설비(소음기, 환기설비 등)의 높이 및 설치 위치\n② 발전기의 설치 및 유지보수가 용이할 것", "h1": "부속설비 높이 · 유지보수", "h2": "[발전기] 발전기점검표에서 발전기 위엔 보 → 급 → 소 높이 2배 (기초 → 보수 → 급배기 → 소음 → 높이) 순서로 확인한다.", "freq": "★★ 3회", "src": "[06-2] [03-3] [03-2]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 321, "chap": "축전지·UPS·예비전원", "topic": "발전기", "q": "발전기실의 위치를 선정할 때 고려해야 할 사항을 쓰시오.", "ans": "① 엔진 기초는 건물 기초와 관계없는 장소로 할 것\n② 보수점검이 용이하도록 면적과 층고를 확보할 것\n③ 급·배기가 잘 되는 장소일 것\n④ 소음·진동이 문제되지 않는 장소일 것\n⑤ 기기의 반출입·운전보수가 편리할 것", "h1": "발전기 위엔 보·급·소 높이 2배 (기초·보수·급배기·소음·높이)", "h2": "[경비신조] 예비전원점검표에서 경제적일 것 → 비상용 부하의 사용 목적에 적합할 것 → 신뢰도가 높을 것 → 조작·취급·운전이 쉬울 것 순서로 확인한다.", "freq": "★ 2회 120제", "src": "[14-2] [08-3]", "verify": "전기요약집 p.169 · 120제 일치"}, {"id": 322, "chap": "축전지·UPS·예비전원", "topic": "예비전원", "q": "예비전원설비가 구비해야 할 조건 4가지를 쓰시오.", "ans": "① 경제적일 것\n② 비상용 부하의 사용 목적에 적합할 것\n③ 신뢰도가 높을 것\n④ 조작·취급·운전이 쉬울 것", "h1": "경비신조", "h2": "", "freq": "-", "src": "-", "verify": "350제 142번 수록 문항 · 공사요약집 p.193 일치"}, {"id": 323, "chap": "전동기·시퀀스", "topic": "단상 유도전동기", "q": "단상 유도전동기에 기동장치가 필요한 이유를 쓰시오.", "ans": "단상 유도전동기는 회전자가 정지해 있을 때 회전자계가 생기지 않아 자기 기동을 하지 못하므로, 보조권선 등의 기동장치로 회전자계를 발생시켜야 한다.", "h1": "단상 = 교번자계뿐 → 스스로 못 돈다", "h2": "[반콘분셰] 단상 유도전동기 체크리스트를 펼쳐 반발 기동형 → 콘덴서 기동형 → 분상 기동형 → 셰이딩 코일형 순서로 하나씩 짚는다.", "freq": "★ 1회", "src": "[16-3]", "verify": "전기요약집 p.95 · 350제 229번 일치"}, {"id": 324, "chap": "전동기·시퀀스", "topic": "단상 유도전동기", "q": "단상 유도전동기의 기동방식 4가지를 쓰시오.", "ans": "① 반발 기동형\n② 콘덴서 기동형\n③ 분상 기동형\n④ 셰이딩 코일형", "h1": "반콘분셰 (기동토크 큰 순)", "h2": "[주보위회] 단상 유도전동기에서는 주권선 → 보조권선 → 위상차 → 회전자계 순서로 장면을 이어 간다.", "freq": "★★ 4회", "src": "[16-3] [11-2] [04-3] [02-3]", "verify": "전기요약집 p.93 · 350제 230번 일치"}, {"id": 325, "chap": "전동기·시퀀스", "topic": "단상 유도전동기", "q": "콘덴서 기동형 단상 유도전동기의 기동 원리를 쓰시오.", "ans": "주권선(운전권선) 전류와 보조권선(기동권선) 전류의 위상차에 의해 발생하는 회전자계로 기동한다.", "h1": "주보위회 → 주권선 · 보조권선 · 위상차 · 회전자계", "h2": "단상 유도전동기: “기접반 → 기동권선 접속 반대”가 떠오르면 정답 문장을 복원한다 — 기동권선(보조권선)의 접속을 반대로 바꾸어 준다.", "freq": "★ 1회", "src": "[16-1]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 326, "chap": "전동기·시퀀스", "topic": "단상 유도전동기", "q": "분상 기동형 단상 유도전동기의 회전 방향을 바꾸려면 어떻게 하는가?", "ans": "기동권선(보조권선)의 접속을 반대로 바꾸어 준다.", "h1": "기접반 → 기동권선 접속 반대", "h2": "[Y90] 단상 유도전동기에서는 Y90 → A105 → E120 → B130 → F155 → H180 순서로 장면을 이어 간다.", "freq": "★★ 3회", "src": "[11-2] [04-3] [02-3]", "verify": "전기요약집 p.93 · 350제 231번 일치"}, {"id": 327, "chap": "전동기·시퀀스", "topic": "단상 유도전동기", "q": "단상 유도전동기의 절연을 E종 절연물로 하였을 때 허용 최고온도는 몇 [℃]인가?", "ans": "120 [℃]", "h1": "Y90 · A105 · E120 · B130 · F155 · H180", "h2": "[3상] 역회전에서는 3상 = 2선 교체 → 반발 = 브러시 → 셰이딩 = 불가 → 직권 = 한쪽만 반대 순서로 장면을 이어 간다.", "freq": "★★ 3회", "src": "[11-2] [04-3] [02-3]", "verify": "전기요약집 p.93 일치"}, {"id": 328, "chap": "전동기·시퀀스", "topic": "역회전", "q": "다음 전동기의 역회전 방법을 쓰시오.\n① 3상 농형 유도전동기 ② 단상 반발 기동형 ③ 단상 셰이딩 코일형 ④ 직류 직권 전동기", "ans": "① 3선 중 임의의 2선을 바꾸어 접속한다.\n② 브러시 위치를 이동한다.\n③ 역회전이 불가능하다.\n④ 계자권선과 전기자권선 중 한 권선의 극성(전류 방향)만 반대로 접속한다.", "h1": "3상 = 2선 교체 · 반발 = 브러시 · 셰이딩 = 불가 · 직권 = 한쪽만 반대", "h2": "[직Y리보] 기동법에서는 직 → Y-Δ → 리 → 보 (+콘도르파) 순서로 장면을 이어 간다.", "freq": "-", "src": "-", "verify": "전기요약집 p.97 일치"}, {"id": 329, "chap": "전동기·시퀀스", "topic": "기동법", "q": "3상 농형 유도전동기의 기동법 4가지를 쓰시오.", "ans": "① 전전압(직입) 기동법\n② Y-Δ 기동법\n③ 리액터 기동법\n④ 기동보상기법\n(그 외) 콘도르파 기동법", "h1": "직 · Y-Δ · 리 · 보 (+콘도르파)", "h2": "[감압] 기동법 체크리스트를 펼쳐 감압 안 하면 전류 → 토크 모두 최대 순서로 하나씩 짚는다.", "freq": "-", "src": "-", "verify": "전기요약집 p.90 일치"}, {"id": 330, "chap": "전동기·시퀀스", "topic": "기동법", "q": "3상 농형 유도전동기 기동법 중 기동전류와 기동토크가 가장 큰 방식은?", "ans": "전전압(직입) 기동", "h1": "감압 안 하면 전류·토크 모두 최대", "h2": "[Y토] 기동법에서는 Y-Δ = 전류 → 토크 모두 1/3 순서로 장면을 이어 간다.", "freq": "-", "src": "-", "verify": "HWP 기준 (엑셀·교재 미수록)"}, {"id": 331, "chap": "전동기·시퀀스", "topic": "기동법", "q": "Y-Δ 기동과 전전압 기동의 기동전류를 비교 설명하시오.", "ans": "Y-Δ 기동 전류는 전전압 기동 전류의 1/3배가 된다. (기동토크도 1/3)", "h1": "Y-Δ = 전류·토크 모두 1/3", "h2": "[Y로] 기동법 관련 항목을 이유 : 기동전류를 억제하기 위해 → 동작 : Y결선으로 기동하여 기동전류를 줄이고, 타이머 설정시간 후 Δ결선으로 바꾸어 운전한다. (Y와 Δ는 동시 투입되지 않도록 인터록) 순서로 한 줄 기차처럼 이어 붙인다.", "freq": "★★ 3회", "src": "[15-2] [06-3] [04-3]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 332, "chap": "전동기·시퀀스", "topic": "기동법", "q": "유도전동기를 Y-Δ로 기동하는 이유와 제어회로 동작(조작 요령)을 쓰시오.", "ans": "이유 : 기동전류를 억제하기 위해\n동작 : Y결선으로 기동하여 기동전류를 줄이고, 타이머 설정시간 후 Δ결선으로 바꾸어 운전한다. (Y와 Δ는 동시 투입되지 않도록 인터록)", "h1": "Y로 출발 → 타이머 → Δ로 달림 (동시투입 금지)", "h2": "기동법: “직렬 L로 전압 깎아 출발”가 떠오르면 정답 문장을 복원한다 — 기동 시 전동기에 직렬로 리액터를 설치하여 전동기에 인가되는 전압을 감압시켜 기동하는 방법", "freq": "★★ 4회", "src": "[15-2] [07-1] [06-3] [04-3]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 333, "chap": "전동기·시퀀스", "topic": "기동법", "q": "3상 농형 유도전동기의 리액터 기동 방식에 대하여 설명하시오.", "ans": "기동 시 전동기에 직렬로 리액터를 설치하여 전동기에 인가되는 전압을 감압시켜 기동하는 방법", "h1": "직렬 L로 전압 깎아 출발", "h2": "기동법: “기동보상기 = 3상 단권변압기”가 떠오르면 정답 문장을 복원한다 — 기동 시 3상 단권변압기를 이용하여 기동전압을 감소시킴으로써 기동전류를 억제하고, 기동 완료 후 기동보상기를 분리하여 전전압으로 운전하는 방식", "freq": "★ 2회", "src": "[22-3] [17-1]", "verify": "전기요약집 p.91 일치"}, {"id": 334, "chap": "전동기·시퀀스", "topic": "기동법", "q": "기동보상기에 의한 유도전동기 기동방법을 쓰시오.", "ans": "기동 시 3상 단권변압기를 이용하여 기동전압을 감소시킴으로써 기동전류를 억제하고, 기동 완료 후 기동보상기를 분리하여 전전압으로 운전하는 방식", "h1": "기동보상기 = 3상 단권변압기", "h2": "[수경] 기동법 체크리스트를 펼쳐 수명 → 경제 = 기동보상기 순서로 하나씩 짚는다.", "freq": "★★ 3회", "src": "[14-3] [14-1] [03-2]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 335, "chap": "전동기·시퀀스", "topic": "기동법", "q": "전동기 기동방식을 기기의 수명과 경제면을 고려한다면 어떤 방식이 적합한가?", "ans": "기동 보상기법", "h1": "수명·경제 = 기동보상기", "h2": "[권선형] 기동법에서는 2차 저항 기동법 (비례추이 이용, 슬립링을 통해 가변저항 접속) → 2차 임피던스 기동법 순서로 장면을 이어 간다.", "freq": "★★ 3회", "src": "[07-3] [02-2] [01-1]", "verify": "전기요약집 p.91 · 350제 227번 일치"}, {"id": 336, "chap": "전동기·시퀀스", "topic": "기동법", "q": "권선형 유도전동기의 기동법 2가지를 쓰시오.", "ans": "① 2차 저항 기동법 (비례추이 이용, 슬립링을 통해 가변저항 접속)\n② 2차 임피던스 기동법", "h1": "권선형 = 2차측에 저항 넣기", "h2": "[전주극] 속도·제동에서는 전원 전압 제어법 → 주파수 변환법 (VVVF) → 극수 변환법 순서로 장면을 이어 간다.", "freq": "-", "src": "-", "verify": "HWP 기준 (엑셀·교재 미수록)"}, {"id": 337, "chap": "전동기·시퀀스", "topic": "속도·제동", "q": "농형 유도전동기의 일반적인 속도제어 방법 3가지를 쓰시오.", "ans": "① 전원 전압 제어법\n② 주파수 변환법 (VVVF)\n③ 극수 변환법", "h1": "전주극", "h2": "속도·제동: “역상 = 2선 바꿔 급브레이크 (플러깅)”가 떠오르면 정답 문장을 복원한다 — 회전 중인 전동기의 1차 권선 3단자 중 임의의 2단자 접속을 바꾸면 역방향 토크가 발생하여 제동하는 방법으로, 전동기를 급속히 정지시킬 때 사용한다.", "freq": "-", "src": "-", "verify": "전기요약집 p.91 일치"}, {"id": 338, "chap": "전동기·시퀀스", "topic": "속도·제동", "q": "3상 농형 유도전동기의 역상제동에 대하여 설명하시오.", "ans": "회전 중인 전동기의 1차 권선 3단자 중 임의의 2단자 접속을 바꾸면 역방향 토크가 발생하여 제동하는 방법으로, 전동기를 급속히 정지시킬 때 사용한다.", "h1": "역상 = 2선 바꿔 급브레이크 (플러깅)", "h2": "[회직스] 속도·제동에서는 회전계법 → 직류 밀리볼트계법 → 스트로보스코프법 순서로 장면을 이어 간다.", "freq": "★ 1회", "src": "[15-1]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 339, "chap": "전동기·시퀀스", "topic": "속도·제동", "q": "3상 유도전동기의 슬립 측정 방법 3가지를 쓰시오.", "ans": "① 회전계법\n② 직류 밀리볼트계법\n③ 스트로보스코프법", "h1": "회직스", "h2": "전동기 설비는 기동장치로 출발하고 차단장치로 끊으며, 제어·보호장치가 운전을 지킨다. [기차제보]", "freq": "-", "src": "-", "verify": "공사요약집 p.254 수록 문항 (공사기사 공통)"}, {"id": 340, "chap": "전동기·시퀀스", "topic": "보호", "q": "MCC(Motor Control Center)의 기기 구성에 대한 대표적인 장치 3가지를 쓰시오.", "ans": "① 기동장치\n② 차단장치\n③ 제어 및 보호장치", "h1": "기차제보", "h2": "[전지현] 보호 대책반이 전동기퓨즈 → 정지형 → 열동 → 유도형 → 전동기보호용 차단기 순서로 조치하는 장면을 그린다.", "freq": "★★ 3회 120제", "src": "[07-3] [02-2] [01-1]", "verify": "전기요약집 p.88 · 120제 일치"}, {"id": 341, "chap": "전동기·시퀀스", "topic": "보호", "q": "전동기 소손 방지를 위한 과부하 보호장치 4가지를 쓰시오.", "ans": "① 전동기 보호용 배선용 차단기\n② 전동기용 퓨즈\n③ 정지형 계전기\n④ 열동 계전기\n(그 외) 유도형 계전기", "h1": "전지현 열정 유전 → 전동기퓨즈 · 정지형 · 열동 · 유도형 · 전동기보호용 차단기", "h2": "[지역구] 보호에서는 지락 → 역상 → 구속 → 단락 → 결상 순서로 장면을 이어 간다.", "freq": "★ 2회 120제", "src": "[10-1] [09-3]", "verify": "공사요약집 p.216 일치 전기요약집 p.88 · 350제 223번 · 120제 일치"}, {"id": 342, "chap": "전동기·시퀀스", "topic": "보호", "q": "3상 교류 전동기의 보호방법 5가지를 쓰시오. (단, 과부하 보호는 제외)", "ans": "① 지락 보호\n② 역상 보호\n③ 회전자 구속 보호\n④ 단락 보호\n⑤ 결상 보호", "h1": "지역구 단결 → 지락 · 역상 · 구속 · 단락 · 결상", "h2": "[전압] 보호에서는 전압 → 결상 순서로 장면을 이어 간다.", "freq": "★ 1회", "src": "[15-3]", "verify": "전기요약집 p.90 일치"}, {"id": 343, "chap": "전동기·시퀀스", "topic": "보호", "q": "고압 전동기용 조작용 배전반에 장치해야 할 계전기 2가지를 쓰시오.", "ans": "① 과부족 전압 계전기\n② 결상 계전기", "h1": "전압 · 결상", "h2": "[과부하] 보호을 설치하는 목표는 명칭 : 전자식 과전류 계전기 (Electronic Over Current Relay) → 목적 : 전동기에 과부하가 걸려 과전류가 흐르면 동작하여 전자접촉기를 소자시켜 전동기를 정지·보호한다이다.", "freq": "★ 1회", "src": "[03-1]", "verify": "엑셀 원문 기준 (교재·HWP 미수록)"}, {"id": 344, "chap": "전동기·시퀀스", "topic": "보호", "q": "EOCR의 명칭과 사용 목적을 쓰시오.", "ans": "명칭 : 전자식 과전류 계전기 (Electronic Over Current Relay)\n목적 : 전동기에 과부하가 걸려 과전류가 흐르면 동작하여 전자접촉기를 소자시켜 전동기를 정지·보호한다.", "h1": "과부하 → 과전류 → 전자접촉기 소자 → 정지", "h2": "[Thr] 보호 체크리스트를 펼쳐 MCCB : 배선용 차단기 → Thr : 열동 계전기 (Thermal Relay) 순서로 하나씩 짚는다.", "freq": "★ 1회", "src": "[15-3]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 345, "chap": "전동기·시퀀스", "topic": "보호", "q": "시퀀스 회로의 MCCB와 Thr의 명칭을 쓰시오.", "ans": "MCCB : 배선용 차단기\nThr : 열동 계전기 (Thermal Relay)", "h1": "Thr = Thermal(열)", "h2": "[불연에편베] 진동·소음 관련 항목을 불평형 → 연결 → 에어갭 → 편심 → 베어링 순서로 한 줄 기차처럼 이어 붙인다.", "freq": "★ 2회", "src": "[15-3] [07-1]", "verify": "엑셀 원문 기준 (교재·HWP 미수록)"}, {"id": 346, "chap": "전동기·시퀀스", "topic": "진동·소음", "q": "전동기의 진동이 발생하는 원인 5가지를 쓰시오.", "ans": "① 회전자의 정적·동적 불평형\n② 부하 기계와의 연결 불량(설치 불량)\n③ 에어 갭의 회전 시 변동\n④ 회전자의 편심\n⑤ 베어링의 불량", "h1": "불연에편베 → 불평형 · 연결 · 에어갭 · 편심 · 베어링", "h2": "[기전통] 진동·소음에서는 기계적 소음 : 진동, 브러시 진동, 베어링 등 → 전자적 소음 : 철심이 주기적 자력·전자력으로 진동하여 발생 → 통풍 소음 : 팬 등 통풍 작용으로 발생 순서로 장면을 이어 간다.", "freq": "★ 1회 120제", "src": "[17-1]", "verify": "120제 일치"}, {"id": 347, "chap": "전동기·시퀀스", "topic": "진동·소음", "q": "전동기 소음을 크게 3가지로 분류하시오.", "ans": "① 기계적 소음 : 진동, 브러시 진동, 베어링 등\n② 전자적 소음 : 철심이 주기적 자력·전자력으로 진동하여 발생\n③ 통풍 소음 : 팬 등 통풍 작용으로 발생", "h1": "기전통", "h2": "전동기를 고를 때는 형식 → 기동방법 → 부하특성 → 정격 순서로 확인한다. [전기부정]", "freq": "-", "src": "-", "verify": "HWP 기준 (엑셀·교재 미수록)"}, {"id": 348, "chap": "전동기·시퀀스", "topic": "선정·절약", "q": "동력부하용 전동기를 합리적으로 선정하기 위하여 고려할 사항 4가지를 쓰시오.", "ans": "① 전동기의 형식\n② 기동방식\n③ 부하의 조건\n④ 정격출력\n(350제) 보호방식이 사용장소에 적절할 것, 부하 토크특성에 적합할 것, 운전형식에 맞는 냉각방식, 용도에 맞는 기계적 형식", "h1": "전기부정 → 전동기형식 · 기동 · 부하 · 정격", "h2": "[부부고전] 선정·절약 체크리스트를 펼쳐 부하역률 → 부하 적정용량 → 고효율 → 전동기제어(VVVF) + 공조 → 엘리베이터 순서로 하나씩 짚는다.", "freq": "-", "src": "-", "verify": "HWP 기준 (엑셀·교재 미수록)"}, {"id": 349, "chap": "전동기·시퀀스", "topic": "선정·절약", "q": "에너지 절약을 위한 동력설비의 대응방안 5가지를 쓰시오.", "ans": "① 전동기 제어 시스템(VVVF) 적용\n② 에너지 절약형 공조 시스템 채택\n③ 엘리베이터의 효율적 관리\n④ 고효율 전동기 채용\n⑤ 부하 역률 개선\n(그 외) 부하에 맞는 적정 용량 전동기 선정", "h1": "부부고전 → 부하역률 · 부하 적정용량 · 고효율 · 전동기제어(VVVF) + 공조·엘리베이터", "h2": "[케차] 수중펌프 체크리스트를 펼쳐 케이블 : CCV (0.6/1[kV] 제어용 가교 폴리에틸렌 절연 비닐시스 케이블) → 차단기 : 누전 차단기 순서로 하나씩 짚는다.", "freq": "★ 2회 120제", "src": "[17-1] [10-2]", "verify": "전기요약집 p.94 · 120제 일치"}, {"id": 350, "chap": "전동기·시퀀스", "topic": "수중펌프", "q": "수중펌프용 전동기에서 현장조작반~MCC 간 케이블 종류와, 적합한 차단기 종류를 쓰시오.", "ans": "케이블 : CCV (0.6/1[kV] 제어용 가교 폴리에틸렌 절연 비닐시스 케이블)\n차단기 : 누전 차단기", "h1": "물 속 = 누전차단기, 제어선 = CCV", "h2": "시퀀스: “서로 b접점으로 잠그기”가 떠오르면 정답 문장을 복원한다 — 인터록 (Interlock) 회로", "freq": "★ 2회", "src": "[05-3] [03-3]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 351, "chap": "전동기·시퀀스", "topic": "시퀀스", "q": "유도전동기 정·역 운전 시 정회전·역회전 전자접촉기가 동시에 동작하지 못하도록 보조회로에서 전기적으로 구성하는 것은?", "ans": "인터록 (Interlock) 회로", "h1": "서로 b접점으로 잠그기", "h2": "시퀀스: “켤 땐 늦게, 끌 땐 바로”가 떠오르면 정답 문장을 복원한다 — 타이머가 여자되면 설정시간 후에 a접점이 폐로되고, 타이머가 소자되면 즉시(순시) 복귀한다.", "freq": "★ 1회", "src": "[07-1]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 352, "chap": "전동기·시퀀스", "topic": "시퀀스", "q": "한시동작 순시복귀 a접점의 동작 상황을 설명하시오.", "ans": "타이머가 여자되면 설정시간 후에 a접점이 폐로되고, 타이머가 소자되면 즉시(순시) 복귀한다.", "h1": "켤 땐 늦게, 끌 땐 바로", "h2": "시퀀스 계산은 출력식 : X = A·B̄ + Ā·B = A ⊕ B 순서로 쓴다. 입으로는 “다르면 1 = XOR”라고 읽는다.", "freq": "★★ 3회", "src": "[11-1] [10-1] [07-2]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 353, "chap": "전동기·시퀀스", "topic": "시퀀스", "q": "입력 A, B가 서로 다를 때만 출력이 1이 되는 논리회로의 명칭과 출력식을 쓰시오.", "ans": "명칭 : 배타적 논리합 회로 (Exclusive-OR, EX-OR)\n출력식 : X = A·B̄ + Ā·B = A ⊕ B", "h1": "다르면 1 = XOR", "h2": "시퀀스 계산은 출력식 : X = A·B + Ā·B̄ = A ⊙ B 순서로 쓴다. 입으로는 “같으면 1 = XNOR”라고 읽는다.", "freq": "★★★ 6회", "src": "[24-1] [20-3] [15-1] [07-2] [04-3] [02-3]", "verify": "엑셀 원문 기준 (교재·HWP 미수록)"}, {"id": 354, "chap": "전동기·시퀀스", "topic": "시퀀스", "q": "입력 A, B가 같을 때만 출력이 1이 되는 논리회로의 명칭과 출력식을 쓰시오.", "ans": "명칭 : 배타적 부정 논리합 회로 (Exclusive-NOR, XNOR)\n출력식 : X = A·B + Ā·B̄ = A ⊙ B", "h1": "같으면 1 = XNOR", "h2": "[온전한] 릴레이 적용 장면에서는 온도 → 전기적분리 → 과부하내량 → 부하전력 → 가격 순서로 장점이 차례로 나타난다.", "freq": "★ 1회", "src": "[22-1]", "verify": "엑셀 원문 기준 (교재·HWP 미수록)"}, {"id": 355, "chap": "전동기·시퀀스", "topic": "릴레이", "q": "무접점 릴레이와 비교할 때 전자 릴레이의 장점 5가지를 쓰시오.", "ans": "① 온도 특성이 좋다.\n② 전기적 잡음 없이 입·출력을 분리할 수 있다.\n③ 과부하 내량이 크다.\n④ 부하가 큰 전력을 인출할 수 있다.\n⑤ 가격이 싸다.", "h1": "온전한 과부가 → 온도 · 전기적분리 · 과부하내량 · 부하전력 · 가격", "h2": "[소소응가충] 릴레이 점검 장면에서는 소비전력 → 소형화 → 응답 → 가동부수명 → 충격 순서로 단점이 드러난다.", "freq": "★ 1회", "src": "[02-2]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 356, "chap": "전동기·시퀀스", "topic": "릴레이", "q": "무접점 릴레이와 비교할 때 전자 릴레이의 단점 5가지를 쓰시오.", "ans": "① 소비전력이 크다.\n② 소형화에 한계가 있다.\n③ 응답속도가 느리다.\n④ 가동 접촉부 수명이 짧다.\n⑤ 충격·진동에 약하다.", "h1": "소소응가충 → 소비전력 · 소형화 · 응답 · 가동부수명 · 충격", "h2": "PID에서 P는 빠르지만 오프셋이 남고, I가 오프셋을 없애며, D가 변화에 빨리 반응하게 한다.", "freq": "★ 1회", "src": "[02-2]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 357, "chap": "전동기·시퀀스", "topic": "제어", "q": "제어 동작 중 잔류편차(off-set)가 생기는 동작과, 오프셋이 없고 응답이 빠른 가장 우수한 동작을 쓰시오.", "ans": "잔류편차 발생 : 비례(P) 제어\n오프셋 없고 응답 빠름 : 비례·적분·미분(PID) 제어\n(적분(I) : 잔류편차 제거 / 미분(D) : 오차 변화 속도에 비례, 오차 확대 사전 방지)", "h1": "P = 오프셋 O · I = 오프셋 제거 · D = 속응성 · PID = 최고", "h2": "보호 숫자는 16 → 20 → 0.2 순서로 묶고, “상구단자0.2 → 상시감시 · 구조상 우려없음 · 단상 16(20) A · 자체 보호장치 · 0.2 kW”라는 리듬으로 외운다.", "freq": "-", "src": "-", "verify": "HWP 기준 (엑셀·교재 미수록)"}, {"id": 358, "chap": "전동기·시퀀스", "topic": "보호", "q": "저압 전동기에 과부하 보호장치를 시설하지 않아도 되는 경우를 쓰시오.", "ans": "① 전동기 운전 중 상시 취급자가 감시할 수 있는 위치에 시설하는 경우\n② 전동기의 구조나 부하의 성질로 보아 전동기를 손상할 과전류가 생길 우려가 없는 경우\n③ 단상 전동기로서 전원측 과전류차단기 정격전류가 16[A](배선용 차단기는 20[A]) 이하인 경우\n④ 전동기 자체에 유효한 과부하 소손 방지장치가 있는 경우\n⑤ 전동기 출력이 0.2[kW] 이하인 경우", "h1": "상구단자0.2 → 상시감시 · 구조상 우려없음 · 단상 16(20) A · 자체 보호장치 · 0.2 kW", "h2": "[연속] 정격점검표에서 연속 → 단시간 → 반복 순서로 확인한다.", "freq": "★ 1회", "src": "[10-2]", "verify": "전기요약집 p.89 일치 / 350제 224번은 '출력 4[kW] 이하로 상시 감시'·'취급자 상주' 추가 수록"}, {"id": 359, "chap": "전동기·시퀀스", "topic": "정격", "q": "다음 설명에 해당하는 전동기 정격을 쓰시오.\n① 지정 조건에서 연속 사용 시 온도상승 등 제한을 넘지 않는 정격 ② 지정된 단시간 사용 조건 ③ 지정 조건에서 반복 사용", "ans": "① 연속 정격\n② 단시간 정격\n③ 반복 정격", "h1": "연속 · 단시간 · 반복", "h2": "[반반콘분셰] 기동토크 경주에서 반발기동 → 반발유도 → 콘덴서 → 분상 → 셰이딩코일 순으로 작아진다.", "freq": "-", "src": "-", "verify": "전기요약집 p.101 수록 문항"}, {"id": 360, "chap": "전동기·시퀀스", "topic": "단상 유도전동기", "q": "단상 유도전동기의 기동방식을 기동토크가 큰 순서로 쓰시오.", "ans": "반발 기동형 > 반발 유도형 > 콘덴서 기동형 > 분상 기동형 > 셰이딩 코일형", "h1": "반반콘분셰 (반발이 최고, 셰이딩이 최저)", "h2": "[단전기결공고회] 기동법 관련 항목을 단선 → 전압강하 → 기동기 → 결선 → 공극 → 고정자 → 회전자 순서로 한 줄 기차처럼 이어 붙인다.", "freq": "-", "src": "-", "verify": "350제 230번 수록 문항"}, {"id": 361, "chap": "전동기·시퀀스", "topic": "기동법", "q": "농형 3상 유도전동기가 전혀 기동되지 않을 때의 원인을 쓰시오.", "ans": "① 3선 중 1선이 단선된 경우\n② 큰 전압강하로 인한 기동토크 부족\n③ 기동기의 고장\n④ 결선의 오접속\n⑤ 공극의 불균등\n⑥ 고정자 권선 내부 오접속, 코일 단선·소손\n⑦ 회전자 도체의 접속 불량", "h1": "단전기결공고회 → 단선 · 전압강하 · 기동기 · 결선 · 공극 · 고정자 · 회전자", "h2": "", "freq": "-", "src": "-", "verify": "전기요약집 p.92 수록 문항 · 350제 233번 일치"}, {"id": 362, "chap": "송배전·전선로", "topic": "코로나", "q": "코로나 현상이란 무엇인지 쓰시오.", "ans": "전선로나 애자 부근에 임계전압 이상의 전압이 가해지면 전선 주위의 공기 절연이 부분적으로 파괴되어 빛과 소리를 내며 방전하는 현상", "h1": "공기 절연 부분 파괴 = 코로나", "h2": "코로나: “δ(델타) = 상대공기밀도 (기압↑ 온도↓ 일수록 큼)”가 떠오르면 정답 문장을 복원한다 — 상대 공기 밀도", "freq": "-", "src": "-", "verify": "공사요약집 p.257 일치"}, {"id": 363, "chap": "송배전·전선로", "topic": "코로나", "q": "코로나 임계전압 Peek식 E0 = 24.3·m0·m1·δ·d·log10(D/r) [kV]에서 δ는 무엇을 의미하는가?", "ans": "상대 공기 밀도", "h1": "δ(델타) = 상대공기밀도 (기압↑ 온도↓ 일수록 큼)", "h2": "코로나: “m0 = 표면, m1 = 날씨”가 떠오르면 정답 문장을 복원한다 — 전선 표면의 상태 계수", "freq": "★★ 4회", "src": "[25-3] [18-3] [09-3] [08-3]", "verify": "공사요약집 p.258 일치 350제 334번 일치"}, {"id": 364, "chap": "송배전·전선로", "topic": "코로나", "q": "코로나 임계전압 식에서 m1이 날씨에 의한 계수라면 m0는 무엇에 의한 계수인가?", "ans": "전선 표면의 상태 계수", "h1": "m0 = 표면, m1 = 날씨", "h2": "[코코통전] 코로나 체크리스트를 펼쳐 코로나손실 → 코로나잡음 → 통신선유도 → 전선부식 순서로 하나씩 짚는다.", "freq": "★★ 4회", "src": "[25-3] [18-3] [09-3] [08-3]", "verify": "350제 334번 일치"}, {"id": 365, "chap": "송배전·전선로", "topic": "코로나", "q": "코로나에 의한 장해(영향)의 종류를 쓰시오.", "ans": "① 코로나 손실 (송전효율 저하)\n② 코로나 잡음 (전파장해)\n③ 통신선 유도장해\n④ 전선 부식\n(그 외) 소호리액터의 소호능력 저하", "h1": "코코통전 → 코로나손실 · 코로나잡음 · 통신선유도 · 전선부식", "h2": "[굵복금] 코로나 대책반이 굵은 전선 → 복도체 → 금구 개량 (임계전압↑) 순서로 조치하는 장면을 그린다.", "freq": "★★ 4회", "src": "[25-3] [18-3] [09-3] [08-3]", "verify": "공사요약집 p.257 일치 350제 201번 일치"}, {"id": 366, "chap": "송배전·전선로", "topic": "코로나", "q": "코로나 발생을 방지하기 위한 대책을 쓰시오.", "ans": "① 굵은 전선 사용 (ACSR, 중공연선)\n② 복도체(다도체) 사용\n③ 가선 금구 개량", "h1": "굵복금 → 굵은 전선 · 복도체 · 금구 개량 (임계전압↑)", "h2": "[굵거더] 코로나에서는 굵기 → 거리는 ↑, 높은 산 → 더운 날은 ↓ (상공밀) 순서로 장면을 이어 간다.", "freq": "★★ 4회", "src": "[25-3] [18-3] [09-3] [08-3]", "verify": "공사요약집 p.256 일치"}, {"id": 367, "chap": "송배전·전선로", "topic": "코로나", "q": "3상 선로에서 전선의 굵기·선간거리·표고·기온이 코로나 임계전압에 미치는 영향을 쓰시오.", "ans": "전선의 굵기↑ → 임계전압 높아짐\n선간거리↑ → 임계전압 높아짐\n표고↑ → 기압 낮아져 임계전압 낮아짐\n기온↑ → 상대공기밀도 낮아져 임계전압 낮아짐", "h1": "굵기·거리는 ↑, 높은 산·더운 날은 ↓ (상공밀)", "h2": "[송코안] 복도체 적용 장면에서는 선로의 인덕턴스 감소 및 정전용량 증가 → 코로나 임계전압 상승 → 코로나 손실 감소 → 송전용량 증대 → 안정도 증대 순서로 장점이 차례로 나타난다.", "freq": "-", "src": "-", "verify": "전기요약집 p.103 일치"}, {"id": 368, "chap": "송배전·전선로", "topic": "복도체", "q": "복도체(다도체) 방식의 장점 4가지를 쓰시오.", "ans": "① 선로의 인덕턴스 감소 및 정전용량 증가\n② 코로나 임계전압 상승 → 코로나 손실 감소\n③ 송전용량 증대\n④ 안정도 증대", "h1": "송코안 + 인덕턴스↓", "h2": "[건꼬페] 복도체 점검 장면에서는 건설비 → 꼬임/흡인 → 페란티 순서로 단점이 드러난다.", "freq": "★ 2회 120제", "src": "[14-1] [03-2]", "verify": "공사요약집 p.255 일치 120제 일치"}, {"id": 369, "chap": "송배전·전선로", "topic": "복도체", "q": "복도체 방식의 단점 3가지를 쓰시오.", "ans": "① 단락 시 대전류가 흐르면 소도체 사이에 흡인력이 발생한다.\n② 꼬임 현상 및 소도체 간 충돌 현상이 발생한다(스페이서 필요).\n③ 정전용량 증가로 페란티 효과에 의해 수전단 전압이 상승한다.\n(그 외) 건설비 증가", "h1": "건꼬페 → 건설비 · 꼬임/흡인 · 페란티", "h2": "복도체 숫자는 20 → 30 순서로 묶고, “L 20~30%↓ · C 20~30%↑”라는 리듬으로 외운다.", "freq": "★ 2회", "src": "[14-1] [03-2]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 370, "chap": "송배전·전선로", "topic": "복도체", "q": "복도체 방식은 단도체 방식에 비해 인덕턴스와 정전용량이 몇 [%] 증가 또는 감소하는가?", "ans": "인덕턴스 : 20~30[%] 감소\n정전용량 : 20~30[%] 증가", "h1": "L 20~30%↓ · C 20~30%↑", "h2": "[통신선] 연가 적용 장면에서는 통신선 → 선로정수 → 소호리액터 공진 → 각 상 전압 순서로 장점이 차례로 나타난다.", "freq": "-", "src": "-", "verify": "공사요약집 p.255 수록 문항 (공사기사 공통)"}, {"id": 371, "chap": "송배전·전선로", "topic": "연가", "q": "송전선로 연가의 효과를 쓰시오.", "ans": "① 통신선에 대한 유도장해 경감\n② 선로정수 평형\n③ 소호리액터 접지 시 직렬공진에 의한 이상전압 상승 방지\n④ 각 상의 전압강하 동일화", "h1": "통신선 소각 → 통신선 · 선로정수 · 소호리액터 공진 · 각 상 전압", "h2": "[종굵배] 선로정수에서는 전선의 종류 → 전선의 굵기 → 전선의 배치 → (송전전압·전류·역률에는 영향을 받지 않는다) 순서로 장면을 이어 간다.", "freq": "- 120제", "src": "-", "verify": "전기요약집 p.102 · 120제 일치"}, {"id": 372, "chap": "송배전·전선로", "topic": "선로정수", "q": "송배전선로의 선로정수(R·L·C·G)는 무엇에 따라 정해지는가?", "ans": "① 전선의 종류\n② 전선의 굵기\n③ 전선의 배치\n(송전전압·전류·역률에는 영향을 받지 않는다)", "h1": "종굵배", "h2": "승압 숫자는 75 → 4 순서로 묶고, “전전공 (2배 승압 → 손실 1/4, 공급 4배) / 변절애절”라는 리듬으로 외운다.", "freq": "-", "src": "-", "verify": "공사요약집 p.259 수록 문항 (공사기사 공통)"}, {"id": 373, "chap": "송배전·전선로", "topic": "승압", "q": "배전전압을 3[kV]에서 6[kV]로 승압할 때의 장점과 단점을 쓰시오.", "ans": "장점 : ① 전력손실 75[%] 경감 ② 전압강하율·전압변동률 75[%] 경감 ③ 공급전력 4배 증대\n단점 : ① 변압기·차단기 등 절연레벨이 높아져 기기가 비싸진다 ② 애자·전선로 절연레벨이 높아져 건설비가 증가한다", "h1": "전전공 (2배 승압 → 손실 1/4, 공급 4배) / 변절애절", "h2": "배전전압을 조정할 때 자동 전압조정기 → 고정 승압기 → 병렬 콘덴서 → 직렬 콘덴서를 차례로 떠올린다.", "freq": "-", "src": "-", "verify": "HWP 기준 (엑셀·교재 미수록)"}, {"id": 374, "chap": "송배전·전선로", "topic": "전압조정", "q": "배전선의 전압을 조정하는 방법을 쓰시오.", "ans": "① 자동 전압 조정기 (SVR, IR)\n② 고정 승압기\n③ 병렬 콘덴서\n④ 직렬 콘덴서\n(그 외) 주상변압기 탭 조정", "h1": "병직고자", "h2": "[직렬] 전압조정을 설치하는 목표는 직렬 C = 선로 L 상쇄이다.", "freq": "★ 2회 120제", "src": "[17-2] [05-1]", "verify": "공사요약집 p.262 일치 전기요약집 p.105 · 350제 208번 · 120제 일치"}, {"id": 375, "chap": "송배전·전선로", "topic": "전압조정", "q": "직렬 콘덴서를 사용하는 목적을 쓰시오.", "ans": "선로의 유도성 리액턴스를 보상함으로써 선로의 전압강하를 감소시키고 계통의 안정도를 증대시킨다.", "h1": "직렬 C = 선로 L 상쇄", "h2": "[전공단] 플리커 관련 항목을 전용계통 → 공급전압↑ → 단락용량 큰 계통 순서로 한 줄 기차처럼 이어 붙인다.", "freq": "- 120제", "src": "-", "verify": "전기요약집 p.106 · 350제 211번 · 120제 일치"}, {"id": 376, "chap": "송배전·전선로", "topic": "플리커", "q": "플리커 현상 경감을 위한 전원측 대책 3가지를 쓰시오.", "ans": "① 단락용량이 큰 계통에서 공급한다.\n② 전용 계통으로 공급한다.\n③ 공급 전압을 승압한다.", "h1": "전공단 → 전용계통 · 공급전압↑ · 단락용량 큰 계통", "h2": "플리커를 줄이려면 부스터, 직렬 콘덴서, 직렬 리액터로 전압변동을 눌러 준다. [부직직]", "freq": "★★ 3회 120제", "src": "[14-2] [11-2] [04-1]", "verif  통신유도 → 차단기 동작↑ → 과도안정도↓ 순서로 단점이 드러난다.", "freq": "★ 2회", "src": "[24-2] [18-2]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 383, "chap": "송배전·전선로", "topic": "중성점 접지", "q": "중성점 직접 접지 방식의 단점 3가지를 쓰시오.", "ans": "① 지락 시 통신선에 유도장해를 크게 미친다.\n② 지락전류가 커서 차단기 동작이 많다.\n③ 과도 안정도가 나빠진다.\n(그 외) 기기에 대한 충격이 크다.", "h1": "통차과 → 통신유도 · 차단기 동작↑ · 과도안정도↓", "h2": "[유효접지] 중성점 접지 체크리스트를 펼쳐 정의 : 1선 지락 시 건전상 전압 상승이 상규 대지전압의 1.3배를 넘지 않도록 접지 임피던스를 조절하여 접지하는 것 → 대표 방식 : 직접 접지 방식 순서로 하나씩 짚는다.", "freq": "★ 2회", "src": "[24-2] [18-2]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 384, "chap": "송배전·전선로", "topic": "중성점 접지", "q": "유효접지의 정의와 대표 접지방식을 쓰시오.", "ans": "정의 : 1선 지락 시 건전상 전압 상승이 상규 대지전압의 1.3배를 넘지 않도록 접지 임피던스를 조절하여 접지하는 것\n대표 방식 : 직접 접지 방식", "h1": "공사요약집 p.40 대조·보완: PDF는 '선간전압의 75~80% 이하'로 표현(= 상전압의 약 1.3배)", "h2": "중성점 접지: “간헐아크 = 비접지”가 떠오르면 정답 문장을 복원한다 — 비접지 방식", "freq": "-", "src": "-", "verify": "공사요약집 p.40 대조·보완: PDF는 '선간전압의 75~80% 이하'로 표현(= 상전압의 약 1.3배)"}, {"id": 385, "chap": "송배전·전선로", "topic": "중성점 접지", "q": "1선 지락 시 충전전류로 간헐 아크 지락을 일으켜 이상전압이 발생하므로 고전압 송전선로에 쓰지 않는 접지방식은?", "ans": "비접지 방식", "h1": "간헐아크 = 비접지", "h2": "[대변피보] 배전방식 적용 장면에서는 대지전압 → 변압기단절연 → 피뢰기 → 보호계전 순서로 장점이 차례로 나타난다.", "freq": "-", "src": "-", "verify": "공사요약집 p.40 수록 문항 (공사기사 공통)"}, {"id": 386, "chap": "송배전·전선로", "topic": "배전방식", "q": "비접지 3상 3선식과 비교한 3상 4선식 다중접지 배전방식의 장점 4가지를 쓰시오.", "ans": "① 건전상의 대지전압 상승이 적다.\n② 변압기 단절연이 가능하다.\n③ 보호계전기의 동작이 확실하다.\n④ 개폐서지 값을 저감시킬 수 있다(피뢰기 책무 경감).", "h1": "대변피보 → 대지전압 · 변압기단절연 · 피뢰기 · 보호계전", "h2": "[기차통과] 배전방식 점검 장면에서는 기기충격 → 차단기 → 통신선 → 과도안정도 순서로 단점이 드러난다.", "freq": "★ 1회", "src": "[09-3]", "verify": "전기요약집 p.113 일치"}, {"id": 387, "chap": "송배전·전선로", "topic": "배전방식", "q": "3상 4선식 다중접지 배전방식의 단점 4가지를 쓰시오.", "ans": "① 지락 시 통신선 유도장해가 크다.\n② 차단기가 동작할 일이 많다.\n③ 지락전류가 커서 기기에 대한 충격이 크다.\n④ 과도 안정도가 나빠진다.", "h1": "기차통과 → 기기충격 · 차단기 · 통신선 · 과도안정도", "h2": "배전방식 숫자는 22.9 → 3 → 4 순서로 묶고, “22.9 kV-Y 다중접지”라는 리듬으로 외운다.", "freq": "★ 1회", "src": "[09-3]", "verify": "전기요약집 p.113 일치"}, {"id": 388, "chap": "송배전·전선로", "topic": "배전방식", "q": "우리나라 배전선로의 주된 배전전압과 배전방식을 쓰시오.", "ans": "배전전압 : 22.9 [kV]\n배전방식 : 3상 4선식(Y) 중성점 다중접지 방식", "h1": "22.9 kV-Y 다중접지", "h2": "스폿네트워크: “2회선 이상 + 자동수전 = 무정전”가 떠오르면 정답 문장을 복원한다 — 배전용 변전소로부터 2회선 이상의 배전선으로 수전하는 방식으로, 1회선에 사고가 발생해도 다른 건전 회선으로 자동 수전할 수 있는 신뢰도가 매우 높은 무정전 공급방식", "freq": "-", "src": "-", "verify": "공사요약집 p.263 수록 문항 (공사기사 공통)"}, {"id": 389, "chap": "송배전·전선로", "topic": "스폿네트워크", "q": "스폿 네트워크(Spot Network) 수전방식이란?", "ans": "배전용 변전소로부터 2회선 이상의 배전선으로 수전하는 방식으로, 1회선에 사고가 발생해도 다른 건전 회선으로 자동 수전할 수 있는 신뢰도가 매우 높은 무정전 공급방식", "h1": "2회선 이상 + 자동수전 = 무정전", "h2": "[무신적변] 스폿네트워크 체크리스트를 펼쳐 무정전 전원공급이 가능하다 → 공급 신뢰도가 높다 → 부하 증가에 대한 적응성이 좋다 → 전압변동률이 적다 순서로 하나씩 짚는다.", "freq": "★★ 4회 120제", "src": "[24-3] [19-1] [15-1] [09-2]", "verify": "공사요약집 p.272 일치 전기요약집 p.119 · 120제 일치"}, {"id": 390, "chap": "송배전·전선로", "topic": "스폿네트워크", "q": "스폿 네트워크 방식의 특징 4가지를 쓰시오.", "ans": "① 무정전 전원공급이 가능하다.\n② 공급 신뢰도가 높다.\n③ 부하 증가에 대한 적응성이 좋다.\n④ 전압변동률이 적다.\n(그 외) 전력손실 감소, 기기 이용률 향상, 2차 변전소 수 감소", "h1": "무신적변", "h2": "뱅킹 방식을 검토할 때 변압기 용량, 전압·손실, 부하변동 대응, 고장보호 순으로 본다.", "freq": "★★ 4회", "src": "[24-3] [19-1] [15-1] [09-2]", "verify": "공사요약집 p.243 일치"}, {"id": 391, "chap": "송배전·전선로", "topic": "뱅킹", "q": "저압 뱅킹 배전방식의 특징 4가지를 쓰시오.", "ans": "① 변압기 공급전력을 서로 융통하여 변압기 용량을 저감할 수 있다.\n② 전압변동 및 전력손실이 경감된다.\n③ 부하 증가에 대한 탄력성이 향상된다.\n④ 고장보호 방식이 적당하면 공급 신뢰도가 향상된다.", "h1": "변압기전부고장 → 변압기용량 · 전압/손실 · 부하탄력 · 고장보호", "h2": "뱅킹: “도미노처럼 연쇄 차단”가 떠오르면 정답 문장을 복원한다 — 변압기 또는 선로 사고의 파급으로 뱅킹 내 건전한 변압기의 일부 또는 전부가 연쇄적으로 차단되는 현상", "freq": "- 120제", "src": "-", "verify": "전기요약집 p.118 · 120제 일치"}, {"id": 392, "chap": "송배전·전선로", "topic": "뱅킹", "q": "저압 뱅킹 배전방식에서 캐스케이딩(Cascading) 현상이란?", "ans": "변압기 또는 선로 사고의 파급으로 뱅킹 내 건전한 변압기의 일부 또는 전부가 연쇄적으로 차단되는 현상", "h1": "도미노처럼 연쇄 차단", "h2": "[내전부전] 모선에서는 내부Z 0 → 전압 불변 → 관성 매우 큼 → 용량 무한 순서로 장면을 이어 간다.", "freq": "-", "src": "-", "verify": "공사요약집 p.265 수록 문항 (공사기사 공통)"}, {"id": 393, "chap": "송배전·전선로", "topic": "모선", "q": "무한대 모선(Infinite Bus)이란?", "ans": "내부 임피던스가 0이고 전압의 크기와 위상이 부하 증감에 관계없이 변하지 않으며, 극히 큰 관성정수를 가진 용량 무한대의 전원", "h1": "내전부전 매용 → 내부Z 0 · 전압 불변 · 관성 매우 큼 · 용량 무한", "h2": "[변조] 변전소 체크리스트를 펼쳐 변조 → 집배 → 유무제어 → 송변보호 순서로 하나씩 짚는다.", "freq": "★ 1회", "src": "[09-3]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 394, "chap": "송배전·전선로", "topic": "변전소", "q": "변전소의 주요 기능 4가지를 쓰시오.", "ans": "① 전압의 변성과 조정\n② 전력의 집중과 배분\n③ 유효전력 및 무효전력 제어\n④ 송배전선로 및 변전소의 보호\n(교재에 따라 ③을 '전력 조류의 제어'로 표기)", "h1": "변조 · 집배 · 유무제어 · 송변보호", "h2": "[쾌도기보] 지중전선로 적용 장면에서는 쾌적미관 → 동일루트 다회선 → 기상영향X → 보안 순서로 장점이 차례로 나타난다.", "freq": "- 120제", "src": "-", "verify": "120제 일치"}, {"id": 395, "chap": "송배전·전선로", "topic": "지중전선로", "q": "지중전선로의 장점 4가지를 쓰시오. (가공전선로와 비교)", "ans": "① 다수 회선을 같은 루트에 시설할 수 있다.\n② 지하 시설로 설비 보안 유지가 용이하다.\n③ 기상 조건에 영향을 받지 않는다.\n④ 유도장해가 적고 도시 미관이 좋다.", "h1": "쾌도기보 → 쾌적미관 · 동일루트 다회선 · 기상영향X · 보안", "h2": "[고공송신] 지중전선로 점검 장면에서는 고장점 → 공사비 → 송전용량 → 신규대응 순서로 단점이 드러난다.", "freq": "★★ 4회", "src": "[25-3] [19-2] [18-3] [15-1]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 396, "chap": "송배전·전선로", "topic": "지중전선로", "q": "지중전선로의 단점 4가지를 쓰시오. (가공전선로와 비교)", "ans": "① 고장점 발견이 어려워 복구가 어렵다.\n② 부하 증설(신규수요 대응)이 어렵다.\n③ 송전용량이 적다.\n④ 건설비가 비싸고 공사기간이 길다.", "h1": "고공송신 → 고장점 · 공사비 · 송전용량 · 신규대응", "h2": "[도수뇌보] 지중전선로 관련 항목을 도시 미관을 중요시하는 경우 → 수용밀도가 현저하게 높은 지역에 공급하는 경우 → 뇌·풍수해 등에 대해 높은 신뢰도가 요구되는 경우 → 보안상 제한으로 가공전선로를 건설할 수 없는 경우 순서로 한 줄 기차처럼 이어 붙인다.", "freq": "★★ 4회", "src": "[25-3] [19-2] [18-3] [15-1]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 397, "chap": "송배전·전선로", "topic": "지중전선로", "q": "송전선로로서 지중전선로를 채택하는 이유를 쓰시오.", "ans": "① 도시 미관을 중요시하는 경우\n② 수용밀도가 현저하게 높은 지역에 공급하는 경우\n③ 뇌·풍수해 등에 대해 높은 신뢰도가 요구되는 경우\n④ 보안상 제한으로 가공전선로를 건설할 수 없는 경우", "h1": "도수뇌보", "h2": "[직관암] 지중전선로에서는 직접 매설식 → 관로식 → 암거식 순서로 장면을 이어 간다.", "freq": "- 120제", "src": "-", "verify": "전기요약집 p.114 · 350제 322번 · 120제 일치"}, {"id": 398, "chap": "송배전·전선로", "topic": "지중전선로", "q": "지중전선로의 케이블 시설방법 3가지를 쓰시오.", "ans": "① 직접 매설식\n② 관로식\n③ 암거식", "h1": "직관암", "h2": "[알파가] 지중전선로 체크리스트를 펼쳐 알루미늄피 → 파이프형 → 가교PE 순서로 하나씩 짚는다.", "freq": "★★★ 7회", "src": "[24-3] [23-1] [17-1] [13-3] [05-3] [04-2] [03-1]", "verify": "공사요약집 p.261 일치 전기요약집 p.114 · 350제 326번 일치"}, {"id": 399, "chap": "송배전·전선로", "topic": "지중전선로", "q": "특고압용 지중전선로에 사용하는 케이블 종류를 쓰시오.", "ans": "① 가교 폴리에틸렌 절연 비닐시스 케이블 (CV)\n② 알루미늄피 케이블\n③ 파이프형 압력 케이블", "h1": "알파가 → 알루미늄피 · 파이프형 · 가교PE", "h2": "지중선은 관로식도 직접매설식도 같은 자를 쓴다. 중량물이 있으면 1.0 m, 없으면 0.6 m다.", "freq": "★★★ 5회", "src": "[23-1] [13-3] [05-3] [04-2] [03-1]", "verify": "전기요약집 p.114 · 350제 327번 일치"}, {"id": 400, "chap": "송배전·전선로", "topic": "지중전선로", "q": "KEC에 따른 지중전선로 매설깊이를 쓰시오. (관로식 / 직접 매설식)", "ans": "관로식 : 1.0[m] 이상 (중량물 압력을 받을 우려가 없는 곳은 0.6[m] 이상)\n직접 매설식 : 차량 등 중량물 압력을 받을 우려가 있는 곳 1.0[m] 이상, 기타 장소 0.6[m] 이상", "h1": "1.0 / 0.6 (관로·직매 동일)", "h2": "[직매] 지중전선로 적용 장면에서는 직매 = 열발산↑ 증설↓ → 관로 = 증설↑ 공기↑ → 암거 = 다회선 화재확산 순서로 장점이 차례로 나타난다.", "freq": "★ 2회", "src": "[24-3] [17-1]", "verify": "공사요약집 p.280 일치"}, {"id": 401, "chap": "송배전·전선로", "topic": "지중전선로", "q": "지중전선로 시공방법(직접 매설식·관로식·암거식)의 장점과 단점을 1가지씩 쓰시오.", "ans": "직접 매설식 : 장점 열발산이 좋아 허용전류가 크다 / 단점 케이블 재시공·증설이 곤란하다\n관로식 : 장점 케이블 재시공·증설이 용이하다 / 단점 공사기간이 길다\n암거식 : 장점 많은 가닥수 시공이 편리하다 / 단점 케이블 화재 시 피해가 확산된다", "h1": "직매 = 열발산↑ 증설↓ · 관로 = 증설↑ 공기↑ · 암거 = 다회선 화재확산", "h2": "[저저] 지중전선로에서는 저-고 0.15 → 저고-특고 0.3 순서로 장면을 이어 간다.", "freq": "-", "src": "-", "verify": "공사요약집 p.286 수록 문항 (공사기사 공통)"}, {"id": 402, "chap": "송배전·전선로", "topic": "지중전선로", "q": "지중전선 상호 간 접근·교차 시 지중함 이외 곳의 이격거리를 쓰시오.", "ans": "저압 지중전선 ↔ 고압 지중전선 : 0.15[m] 이상\n저압·고압 지중전선 ↔ 특고압 지중전선 : 0.3[m] 이상", "h1": "저-고 0.15 · 저고-특고 0.3", "h2": "[난연] 지중전선로 대책반이 난연 테이프 → 난연 도료 순서로 조치하는 장면을 그린다.", "freq": "-", "src": "-", "verify": "공사요약집 p.282 수록 문항 (공사기사 공통)"}, {"id": 403, "chap": "송배전·전선로", "topic": "지중전선로", "q": "지중전선 화재 확대 방지를 위해 일반 케이블에 적용하는 방재용 자재 2가지를 쓰시오.", "ans": "① 난연 테이프\n② 난연 도료", "h1": "난연 테이프 · 난연 도료", "h2": "[고나방절] 케이블 열화 관련 항목을 고나방절 → 수전화 순서로 한 줄 기차처럼 이어 붙인다.", "freq": "★ 1회", "src": "[12-2]", "verify": "전기요약집 p.74 · 350제 256번 일치"}, {"id": 404, "chap": "송배전·전선로", "topic": "케이블 열화", "q": "케이블 트리 현상에 대하여 설명하고 종류 3가지를 쓰시오.", "ans": "설명 : 고체 절연체 속에서 나뭇가지 모양의 방전 흔적을 남기는 절연 열화 현상\n종류 : ① 수 트리 ② 전기적 트리 ③ 화학적 트리", "h1": "고나방절 / 수전화", "h2": "[전열화기생] 케이블 열화 체크리스트를 펼쳐 전열화기생 → 부전물 순서로 하나씩 짚는다.", "freq": "★ 1회 120제", "src": "[10-3]", "verify": "350제 244번 · 120제 일치"}, {"id": 405, "chap": "송배전·전선로", "topic": "케이블 열화", "q": "CN-CV 케이블을 열화시키는 외적 요인 5가지와, 그중 전기적 열화의 종류 3가지를 쓰시오.", "ans": "열화 요인 : 전기적, 열적, 화학적, 기계적, 생물적 요인\n전기적 열화 : 부분 방전, 전기 트리, 물 트리(수트리)", "h1": "전열화기생 / 부전물", "h2": "고장점 탐색은 머레이가 지락·단락, 정전용량법이 단선, 펄스법이 모든 고장을 맡는다. [머정펄]", "freq": "-", "src": "-", "verify": "공사요약집 p.228 수록 문항 (공사기사 공통)"}, {"id": 406, "chap": "송배전·전선로", "topic": "고장점", "q": "지중 배전선로 전력케이블의 고장점 측정 방법 3가지와 각각의 적용 사고를 쓰시오.", "ans": "① 머레이 루프법 : 1선 지락, 선간 단락 (브리지 원리)\n② 펄스 레이더법 : 3상 단락, 지락, 단선\n③ 정전 용량법 : 단선 사고", "h1": "머정펄 → 머레이(지락·단락) · 정전용량(단선) · 펄스(전부)", "h2": "[메탄부] 고장점에서는 메거법(절연저항 측정) → 유전정접법(tanδ법) → 부분방전 측정법 순서로 장면을 이어 간다.", "freq": "★ 2회", "src": "[21-1] [08-3]", "verify": "공사요약집 p.235 일치 · 브리지 원리 1선지락 검출 = 머레이 루프법"}, {"id": 407, "chap": "송배전·전선로", "topic": "고장점", "q": "지중케이블의 절연열화(절연감시) 측정법 3가지를 쓰시오.", "ans": "① 메거법(절연저항 측정)\n② 유전정접법(tanδ법)\n③ 부분방전 측정법", "h1": "메탄부", "h2": "유도장해의 근본 대책은 원인이 되는 전자유도 전압 자체를 낮추는 것이다.", "freq": "★ 1회", "src": "[21-1]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 408, "chap": "송배전·전선로", "topic": "유도장해", "q": "중성점 직접접지 계통에 인접한 통신선의 전자유도장해 경감 대책 중 근본적인 대책은?", "ans": "전자유도 전압의 억제", "h1": "근본 = 유도전압 억제", "h2": "[송중기] 유도장해 대책반이 송전선 이격 → 중성점접지(기유도) → 고속도계전 → 차폐선 → 지중화 순서로 조치하는 장면을 그린다.", "freq": "★ 2회", "src": "[17-3] [12-2]", "verify": "전기요약집 p.116 일치"}, {"id": 409, "chap": "송배전·전선로", "topic": "유도장해", "q": "전자유도장해 경감을 위한 전력선측 대책 5가지를 쓰시오.", "ans": "① 송전선로를 통신선로로부터 멀리 떨어져 건설한다.\n② 접지저항을 적당히 선정하여 기유도 전류의 분포를 조절한다.\n③ 고속도 지락보호 계전방식을 채용한다.\n④ 차폐선을 설치한다.\n⑤ 지중전선로 방식을 채용한다.", "h1": "송중기 고자지 → 송전선 이격 · 중성점접지(기유도) · 고속도계전 · 차폐선 · 지중화", "h2": "[절연통배전] 유도장해 대책반이 절연변압기 → 연피 → 통신피뢰기 → 배류코일 → 수직교차 순서로 조치하는 장면을 그린다.", "freq": "★ 2회", "src": "[17-3] [12-2]", "verify": "전기요약집 p.116 일치"}, {"id": 410, "chap": "송배전·전선로", "topic": "유도장해", "q": "전자유도장해 경감을 위한 통신선측 대책 5가지를 쓰시오.", "ans": "① 절연변압기를 설치하여 구간을 분리한다.\n② 연피 케이블을 사용한다.\n③ 통신선에 우수한 피뢰기를 사용한다.\n④ 배류 코일을 설치한다.\n⑤ 전력선과 교차 시 수직 교차한다.", "h1": "절연통배전 → 절연변압기 · 연피 · 통신피뢰기 · 배류코일 · 수직교차", "h2": "[삼점오] 유도장해에서는 삼점오 kV/m → 팔삼점삼 μT 순서로 장면을 이어 간다.", "freq": "★ 2회", "src": "[17-3] [12-2]", "verify": "전기요약집 p.116 일치"}, {"id": 411, "chap": "송배전·전선로", "topic": "유도장해", "q": "교류 특고압 가공전선로에서 발생하는 극저주파 전자계의 제한값(지표상 1[m])을 쓰시오.", "ans": "전계 : 3.5 [kV/m] 이하\n자계 : 83.3 [μT] 이하", "h1": "삼점오 kV/m · 팔삼점삼 μT", "h2": "[좌지통] 이도에서는 좌우진동 → 지지물높이 → 통신선횡단 → 장력↑단선 순서로 장면을 이어 간다.", "freq": "-", "src": "-", "verify": "공사요약집 p.284 수록 문항 (공사기사 공통)"}, {"id": 412, "chap": "송배전·전선로", "topic": "이도", "q": "가공전선로의 이도가 너무 크거나 너무 작을 때 전선로에 미치는 영향을 쓰시오.", "ans": "① 이도가 너무 크면 좌우 진동으로 다른 상 전선이나 수목과 접촉할 우려가 있다.\n② 이도가 너무 크면 도로·철도·통신선 횡단 장소에서 접촉 위험이 있다.\n③ 이도가 너무 작으면 전선 장력이 증가하여 단선될 우려가 있다.\n④ 이도의 대소는 지지물의 높이를 좌우한다.", "h1": "좌지통 장력 → 좌우진동 · 지지물높이 · 통신선횡단 · 장력↑단선", "h2": "애자·금구: “댐퍼 = 진동 흡수”가 떠오르면 정답 문장을 복원한다 — 전선의 진동 방지", "freq": "★ 1회", "src": "[11-3]", "verify": "전기요약집 p.117 일치"}, {"id": 413, "chap": "송배전·전선로", "topic": "애자·금구", "q": "ACSR 전선에 댐퍼(Damper)를 설치하는 이유는?", "ans": "전선의 진동 방지", "h1": "댐퍼 = 진동 흡수", "h2": "[섬전효] 애자·금구을 설치하는 목표는 섬락보호 → 전압분포 → 효율이다.", "freq": "★ 1회", "src": "[20-1]", "verify": "공사요약집 p.275 일치 전기요약집 p.112 일치"}, {"id": 414, "chap": "송배전·전선로", "topic": "애자·금구", "q": "철탑에 소호각(Arcing horn)·소호환(Arcing ring)을 설치하는 목적을 쓰시오.", "ans": "① 이상전압에 의한 섬락으로부터 애자련 보호 (섬락 시 애자 열적 파괴 방지)\n② 애자련의 전압분포 개선\n③ 애자련의 효율 향상", "h1": "섬전효 → 섬락보호 · 전압분포 · 효율", "h2": "[안절비단코] 송전방식 적용 장면에서는 안정도 → 절연 → 비동기연계 → 단락전류↓ → 코로나↓ 순서로 장점이 차례로 나타난다.", "freq": "-", "src": "-", "verify": "공사요약집 p.275 수록 문항 (공사기사 공통)"}, {"id": 415, "chap": "송배전·전선로", "topic": "송전방식", "q": "교류 송전방식과 비교한 직류 송전방식의 장점을 쓰시오.", "ans": "① 선로의 리액턴스가 없어 안정도가 높다.\n② 유전체손·충전용량이 없고 절연계급을 낮출 수 있다.\n③ 비동기 연계가 가능하다.\n④ 단락전류가 적다.\n⑤ 코로나손 및 전력손실이 적다(역률 1).", "h1": "안절비단코 → 안정도 · 절연 · 비동기연계 · 단락전류↓ · 코로나↓", "h2": "가공전선: “도기내비가가”가 떠오르면 정답 문장을 복원한다 — ① 도전율이 높을 것 ② 기계적 강도가 클 것 ③ 내구성이 있을 것 ④ 비중이 작을 것 ⑤ 가선작업이 용이할 것 ⑥ 가격이 저렴할 것", "freq": "-", "src": "-", "verify": "공사요약집 p.260 수록 문항 (공사기사 공통)"}, {"id": 416, "chap": "송배전·전선로", "topic": "가공전선", "q": "가공전선의 구비조건을 쓰시오.", "ans": "① 도전율이 높을 것 ② 기계적 강도가 클 것 ③ 내구성이 있을 것 ④ 비중이 작을 것 ⑤ 가선작업이 용이할 것 ⑥ 가격이 저렴할 것", "h1": "도기내비가가", "h2": "[특공경선신] 수전방식 체크리스트를 펼쳐 특고압 소용량에 주로 적합하다 → 공사가 용이하다 → 가장 간단하며 경제적이다 → 선로 및 수전용 차단기 사고에 대비책이 없다 → 신뢰도가 가장 낮다 순서로 하나씩 짚는다.", "freq": "-", "src": "-", "verify": "공사요약집 p.266 수록 문항 (공사기사 공통)"}, {"id": 417, "chap": "송배전·전선로", "topic": "수전방식", "q": "수전방식 중 1회선 수전방식의 특징을 쓰시오.", "ans": "① 특고압 소용량에 주로 적합하다.\n② 공사가 용이하다.\n③ 가장 간단하며 경제적이다.\n④ 선로 및 수전용 차단기 사고에 대비책이 없다.\n⑤ 신뢰도가 가장 낮다.", "h1": "특공경선신", "h2": "[전정고] 유도장해 관련 항목을 전자유도장해 : 전력선과 통신선 간 상호 인덕턴스에 의해 발생 → 정전유도장해 : 전력선과 통신선 간 상호 정전용량에 의해 발생 → 고조파 유도장해 : 상용주파수보다 높은 고조파 유도에 의한 잡음 장해 순서로 한 줄 기차처럼 이어 붙인다.", "freq": "-", "src": "-", "verify": "전기요약집 p.118 일치"}, {"id": 418, "chap": "송배전·전선로", "topic": "유도장해", "q": "유도장해의 종류 3가지를 발생 원인과 함께 쓰시오.", "ans": "① 전자유도장해 : 전력선과 통신선 간 상호 인덕턴스에 의해 발생\n② 정전유도장해 : 전력선과 통신선 간 상호 정전용량에 의해 발생\n③ 고조파 유도장해 : 상용주파수보다 높은 고조파 유도에 의한 잡음 장해", "h1": "M(인덕턴스) = 전자 / C(정전용량) = 정전 / 고조파 = 잡음", "h2": "[공칭] 전압에서는 공칭전압 : 전선로를 대표하는 선간전압으로 그 계통의 송전전압 → 계통최고전압 : 전선로에 통상 발생하는 최고 선간전압으로 염해 대책, 1선 지락 시 내부이상전압, 코로나, 전자유도전압의 표준이 되는 전압 순서로 장면을 이어 간다.", "freq": "-", "src": "-", "verify": "전기요약집 p.121 수록 문항"}, {"id": 419, "chap": "송배전·전선로", "topic": "전압", "q": "공칭전압과 계통최고전압을 설명하시오.", "ans": "공칭전압 : 전선로를 대표하는 선간전압으로 그 계통의 송전전압\n계통최고전압 : 전선로에 통상 발생하는 최고 선간전압으로 염해 대책, 1선 지락 시 내부이상전압, 코로나, 전자유도전압의 표준이 되는 전압", "h1": "공칭 = 대표 / 최고 = 통상 최고", "h2": "[기절누가내] 애자점검표에서 절연내력이 클 것 → 충분한 기계적 강도를 가질 것 → 누설전류가 적을 것 → 내구력이 클 것 → 가격이 저렴할 것 순서로 확인한다.", "freq": "-", "src": "-", "verify": "전기요약집 p.122 수록 문항"}, {"id": 420, "chap": "송배전·전선로", "topic": "애자", "q": "전선로에서 애자가 갖추어야 할 구비조건을 쓰시오.", "ans": "① 절연내력이 클 것\n② 충분한 기계적 강도를 가질 것\n③ 누설전류가 적을
