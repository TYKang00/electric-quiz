 피뢰 뇌서지 순서로 단점이 드러난다.", "freq": "★ 1회", "src": "[08-3]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 432, "chap": "접지·감전", "topic": "공용접지", "q": "공통(공용) 접지의 단점 3가지를 쓰시오.", "ans": "① 계통의 이상전압 발생 시 유기전압 상승\n② 다른 기기 계통으로부터 사고 파급\n③ 피뢰침과 공용 시 뇌서지의 영향을 받는다.", "h1": "다른계피 → 다른계통 파급 · 계통 이상전압 · 피뢰 뇌서지", "h2": "[발접] 공용접지에서는 접지전류 → 전위상승 → 대지저항률 순서로 장면을 이어 간다.", "freq": "★ 1회", "src": "[08-3]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 433, "chap": "접지·감전", "topic": "공용접지", "q": "허용 가능한 단독접지의 이격거리를 결정하는 요인 3가지를 쓰시오.", "ans": "① 발생하는 접지전류의 최댓값\n② 전위상승의 허용값\n③ 그 지점의 대지 저항률", "h1": "발접 전혀 그대 → 접지전류 · 전위상승 · 대지저항률", "h2": "[도전] 접지저항 체크리스트를 펼쳐 도체 → 전극 → 토양 → 대지-표면 접촉 순서로 하나씩 짚는다.", "freq": "-", "src": "-", "verify": "전기요약집 p.126 일치"}, {"id": 434, "chap": "접지·감전", "topic": "접지저항", "q": "접지저항의 결정요인인 접지저항 요소 3가지를 쓰시오.", "ans": "① 접지도체와 접지전극 자체의 전기저항\n② 접지전극 주위 토양의 전기저항\n③ 접지전극 표면과 대지 사이의 접촉저항", "h1": "도전 토 대표 → 도체·전극 · 토양 · 대지-표면 접촉", "h2": "접지저항을 낮추려면 더 깊게 묻고, 접지극을 길게 하고, 여러 개를 병렬로 연결하며, 필요하면 심타·저감제를 쓴다.", "freq": "★ 1회", "src": "[21-1]", "verify": "전기요약집 p.145 · 350제 341번 일치"}, {"id": 435, "chap": "접지·감전", "topic": "접지저항", "q": "접지저항 저감법 중 물리적 방법 4가지를 쓰시오.", "ans": "① 접지봉의 매설 깊이를 깊게 한다.\n② 접지극의 길이를 길게 한다.\n③ 접지극을 병렬 접속한다.\n④ 심타공법으로 시공한다.\n(화학적 방법 : 접지저항 저감제 사용)", "h1": "저매 병길이 심심타", "h2": "[대지] 접지저항점검표에서 지속 → 안전(공해X) → 전극부식X → 작업성 순서로 확인한다.", "freq": "★ 2회", "src": "[13-3] [08-1]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 436, "chap": "접지·감전", "topic": "접지저항", "q": "접지저항 저감재(저감제)의 구비조건 4가지를 쓰시오.", "ans": "① 전극을 부식시키지 않을 것\n② 작업성이 좋을 것\n③ 지속성이 있을 것\n④ 공해가 없을(안전할) 것\n(그 외) 전기적으로 양도체일 것", "h1": "대지 안전 작전 → 지속 · 안전(공해X) · 전극부식X · 작업성", "h2": "[어스테스터] 접지저항 측정 체크리스트를 펼쳐 어스테스터 → 콜라우시 3극법 순서로 하나씩 짚는다.", "freq": "★ 2회 120제", "src": "[13-3] [08-1]", "verify": "전기요약집 p.127 · 120제 일치"}, {"id": 437, "chap": "접지·감전", "topic": "접지저항 측정", "q": "접지저항을 측정하기 위한 측정 기기와 측정 방법의 명칭을 쓰시오.", "ans": "기기 : 어스 테스터 (접지저항 측정기)\n방법 : 콜라우시 브리지에 의한 3극 접지저항 측정법", "h1": "어스테스터 · 콜라우시 3극법", "h2": "접지저항 측정: “61.8% 법칙 (황금비)”가 떠오르면 정답 문장을 복원한다 — 61.8 [%]", "freq": "★ 2회", "src": "[19-1] [05-2]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 438, "chap": "접지·감전", "topic": "접지저항 측정", "q": "본 접지 E에 보조접지 P·C를 설치하여 측정한 저항이 E-P 86[Ω], E-C 92[Ω], P-C 160[Ω]일 때 본 접지 E의 접지저항을 구하시오.", "ans": "산출식 : Re = (R_EP + R_EC − R_PC) / 2\n적용 : Re = (86 + 92 − 160) / 2\n결과 : Re = 9 [Ω]", "h1": "자기 둘 더하고 남의 것 빼고 ÷2", "h2": "접지저항 측정선은 P 10 m, C 20 m로 벌리고 75 cm 이상 묻는다. P는 반거리, C는 끝거리다.", "freq": "★ 2회", "src": "[19-1] [05-2]", "verify": "엑셀 원문 기준 (교재·HWP 미수록)"}, {"id": 439, "chap": "접지·감전", "topic": "접지저항 측정", "q": "반구 모양 접지전극의 접지저항을 측정할 때 전위전극(P)을 E-C 간 거리의 몇 [%] 지점에 설치해야 정확한 값을 얻는가?", "ans": "61.8 [%]", "h1": "61.8% 법칙 (황금비)", "h2": "대지저항률 계산은 공식 : ρ = 2π·a·R [Ω·m] (ρ : 대지저항률, a : 전극 간격[m], R : 측정 저항[Ω]) 순서로 쓴다. 입으로는 “워너 = 2πaR”라고 읽는다.", "freq": "★ 2회", "src": "[17-2] [14-1]", "verify": "엑셀 원문 기준 (교재·HWP 미수록)"}, {"id": 440, "chap": "접지·감전", "topic": "접지저항 측정", "q": "전자식 접지저항계로 접지저항을 측정할 때 보조 접지극을 설치하는 이유와, 보조극 설치 간격 및 접지극 매설 깊이를 쓰시오.", "ans": "보조 접지극 설치 이유 : 전압과 전류를 공급하여 접지저항을 측정하기 위해\n설치 간격 : 본 접지극에서 전위보조극(P) 10[m], 전류보조극(C) 20[m]\n접지극 매설 깊이 : 0.75[m] 이상", "h1": "전전공 접측 / P 10 m · C 20 m / 75 cm", "h2": "대지저항률 측정은 바깥 C전극으로 전류를 흘리고, 안쪽 P전극에서 전압을 잰다.", "freq": "★ 2회", "src": "[11-2] [06-3]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 441, "chap": "접지·감전", "topic": "대지저항률", "q": "4개의 측정 탐침을 지표면에 일직선상 등거리로 박고 저주파 전류를 흘려 대지저항률을 측정하는 방법의 명칭과 공식을 쓰시오.", "ans": "명칭 : 워너(Wenner)의 4전극법\n공식 : ρ = 2π·a·R [Ω·m] (ρ : 대지저항률, a : 전극 간격[m], R : 측정 저항[Ω])", "h1": "워너 = 2πaR", "h2": "등전위본딩: “등전위 = 도전부끼리 연결”가 떠오르면 정답 문장을 복원한다 — 등전위를 형성하기 위해 도전부 상호 간을 전기적으로 연결하는 것", "freq": "★ 2회", "src": "[13-3] [08-2]", "verify": "공사요약집 p.55 일치"}, {"id": 442, "chap": "접지·감전", "topic": "대지저항률", "q": "워너(Wenner) 4전극법의 원리를 설명하시오.", "ans": "4개의 전극을 일직선상 일정 간격(a)으로 매설하고, 바깥쪽 C1·C2 전극으로 저주파 전류를 흘린 후 안쪽 P1·P2 전극 사이의 전압을 측정하여 대지저항률을 구하는 방법", "h1": "바깥 C로 전류, 안쪽 P로 전압", "h2": "등전위본딩 숫자는 1 → 2 → 6 → 16 → 50 → 25 순서로 묶고, “구리 6 · 알루미늄 16 · 강철 50 · 최대 25”라는 리듬으로 외운다.", "freq": "★ 1회", "src": "[13-3]", "verify": "공사요약집 p.55 일치"}, {"id": 443, "chap": "접지·감전", "topic": "등전위본딩", "q": "KEC에서 규정하는 등전위 본딩의 용어 정의를 쓰시오.", "ans": "등전위를 형성하기 위해 도전부 상호 간을 전기적으로 연결하는 것", "h1": "등전위 = 도전부끼리 연결", "h2": "등전위본딩 숫자는 2.5 → 16 → 4 순서로 묶고, “보호O 2.5 · 보호X 4 (알루미늄 16)”라는 리듬으로 외운다.", "freq": "★ 1회", "src": "[18-3]", "verify": "전기요약집 p.213 일치"}, {"id": 444, "chap": "접지·감전", "topic": "등전위본딩", "q": "주 접지단자에 접속하는 보호 등전위본딩 도체의 단면적 기준을 쓰시오.", "ans": "설비 내 가장 큰 보호접지도체 단면적의 1/2 이상이고 다음 이상일 것 : 구리 6[㎟], 알루미늄 16[㎟], 강철 50[㎟]\n단, 구리 25[㎟] 또는 다른 재질의 동등 단면적을 초과할 필요는 없다.", "h1": "구리 6 · 알루미늄 16 · 강철 50 · 최대 25", "h2": "[16까지] 보호도체 작업자가 선도체 S ≤ 16[㎟] : S → 16 < S ≤ 35[㎟] : 16[㎟] → S > 35[㎟] : S/2 순서대로 작업하는 장면을 그린다.", "freq": "★ 2회", "src": "[21-2] [21-1]", "verify": "공사요약집 p.46 일치 전기요약집 p.230 일치"}, {"id": 445, "chap": "접지·감전", "topic": "등전위본딩", "q": "보조 보호등전위본딩 도체(케이블 일부가 아닌 경우)의 최소 단면적을 쓰시오.", "ans": "기계적 보호가 된 것 : 구리 2.5[㎟], 알루미늄 16[㎟]\n기계적 보호가 없는 것 : 구리 4[㎟], 알루미늄 16[㎟]", "h1": "보호O 2.5 · 보호X 4 (알루미늄 16)", "h2": "[다심] 보호도체 체크리스트를 펼쳐 다심 → 같은 트렁킹 → 고정 도체 순서로 하나씩 짚는다.", "freq": "-", "src": "-", "verify": "공사요약집 p.55 수록 문항 (공사기사 공통)"}, {"id": 446, "chap": "접지·감전", "topic": "보호도체", "q": "보호도체(PE)의 최소 단면적 기준을 쓰시오. (선도체와 같은 재질, 구리)", "ans": "선도체 S ≤ 16[㎟] : S\n16 < S ≤ 35[㎟] : 16[㎟]\nS > 35[㎟] : S/2", "h1": "16까지 같게, 35까지 16, 넘으면 절반", "h2": "접지도체 숫자는 6 → 50 → 16 순서로 묶고, “평소 구리 6, 피뢰 붙으면 16 (철은 둘 다 50)”라는 리듬으로 외운다.", "freq": "★ 1회", "src": "[17-1]", "verify": "공사요약집 p.52 일치"}, {"id": 447, "chap": "접지·감전", "topic": "보호도체", "q": "보호도체의 종류 2가지를 쓰시오.", "ans": "① 다심 케이블의 도체\n② 충전도체와 같은 트렁킹에 수납된 절연도체 또는 나도체\n(그 외) 고정된 절연도체 또는 나도체, 금속 케이블 외장·차폐·동심도체", "h1": "다심 · 같은 트렁킹 · 고정 도체", "h2": "접지도체 숫자는 6 → 0.75 → 75 순서로 묶고, “6 ㎟ · 75 cm”라는 리듬으로 외운다.", "freq": "★ 1회", "src": "[17-1]", "verify": "전기요약집 p.141 일치"}, {"id": 448, "chap": "접지·감전", "topic": "접지도체", "q": "KEC에 따른 접지도체의 최소 단면적을 쓰시오. (큰 고장전류가 흐르지 않는 경우 / 피뢰시스템 접속 시)", "ans": "큰 고장전류가 흐르지 않는 경우 : 구리 6[㎟] 이상, 철제 50[㎟] 이상\n피뢰시스템이 접속되는 경우 : 구리 16[㎟] 또는 철 50[㎟] 이상", "h1": "평소 구리 6, 피뢰 붙으면 16 (철은 둘 다 50)", "h2": "[PPP] PEN·PEL·PEM에서는 PEN : 교류회로에서 중성선 겸용 보호도체 → PEL : 직류회로에서 선도체 겸용 보호도체 → PEM : 직류회로에서 중간도체 겸용 보호도체 순서로 장면을 이어 간다.", "freq": "-", "src": "-", "verify": "공사요약집 p.51 수록 문항 (공사기사 공통)"}, {"id": 449, "chap": "접지·감전", "topic": "접지도체", "q": "변압기 2차측 접지도체는 단면적 몇 [㎟] 이상의 연동선을 사용하는가? 또 접지극의 매설 깊이는?", "ans": "접지도체 : 6[㎟] 이상 연동선\n접지극 매설 깊이 : 지하 0.75[m] (75[cm]) 이상", "h1": "6 ㎟ · 75 cm", "h2": "[PEN] PEN·PEL·PEM 체크리스트를 펼쳐 PEN = 구리 10 → 알루미늄 16 순서로 하나씩 짚는다.", "freq": "★★ 3회", "src": "[12-1] [11-2] [06-3]", "verify": "공사요약집 p.44 일치 전기요약집 p.148 일치"}, {"id": 450, "chap": "접지·감전", "topic": "PEN·PEL·PEM", "q": "KEC에서 규정하는 PEN · PEL · PEM 도체의 정의를 쓰시오.", "ans": "PEN : 교류회로에서 중성선 겸용 보호도체\nPEL : 직류회로에서 선도체 겸용 보호도체\nPEM : 직류회로에서 중간도체 겸용 보호도체", "h1": "N = 중성선(교류), L = 선도체(직류), M = 중간선(직류)", "h2": "[흐름] 감전 보호 관련 항목을 흐름 방지 → 크기 제한 → 시간 제한 순서로 한 줄 기차처럼 이어 붙인다.", "freq": "★ 2회", "src": "[24-2] [22-2]", "verify": "공사요약집 p.51 일치 전기요약집 p.231 일치"}, {"id": 451, "chap": "접지·감전", "topic": "PEN·PEL·PEM", "q": "주택 등 저압수용장소에서 TN-C-S 방식으로 접지 시 PEN 도체의 최소 단면적은?", "ans": "구리 10[㎟] 이상, 알루미늄 16[㎟] 이상", "h1": "PEN = 구리 10 · 알루미늄 16", "h2": "[전급비비전] 감전 보호에서는 전원의 자동차단에 의한 보호 → Ⅱ급 기기 사용 또는 동등 이상 절연에 의한 보호 → 비도전성 장소에 의한 보호 → 비접지 국부 등전위본딩에 의한 보호 → 전기적 분리에 의한 보호 순서로 장면을 이어 간다.", "freq": "-", "src": "-", "verify": "공사요약집 p.38 수록 문항 (공사기사 공통)"}, {"id": 452, "chap": "접지·감전", "topic": "감전 보호", "q": "감전보호 중 고장보호(간접접촉 방지)의 기준 2가지를 쓰시오.", "ans": "① 인축의 몸을 통해 고장전류가 흐르는 것을 방지\n② 인축의 몸에 흐르는 고장전류를 위험하지 않은 값 이하로 제한\n③ 인축의 몸에 흐르는 고장전류의 지속시간을 위험하지 않은 시간까지로 제한", "h1": "대조·보완: 전기요약집 p.241은 ①② / 엑셀은 ②③ → 3가지 모두 수록", "h2": "감전 보호: “접촉전압 50 V”가 떠오르면 정답 문장을 복원한다 — 교류 50 [V]", "freq": "★ 1회", "src": "[25-2]", "verify": "대조·보완: 전기요약집 p.241은 ①② / 엑셀은 ②③ → 3가지 모두 수록"}, {"id": 453, "chap": "접지·감전", "topic": "감전 보호", "q": "간접접촉 예방을 위한 보호방법 5가지를 쓰시오.", "ans": "① 전원의 자동차단에 의한 보호\n② Ⅱ급 기기 사용 또는 동등 이상 절연에 의한 보호\n③ 비도전성 장소에 의한 보호\n④ 비접지 국부 등전위본딩에 의한 보호\n⑤ 전기적 분리에 의한 보호", "h1": "자Ⅱ비비분", "h2": "[경크시전] 감전에서는 경로 → 크기 → 시간 → 전원종류 순서로 장면을 이어 간다.", "freq": "-", "src": "-", "verify": "공사요약집 p.207 수록 문항 (공사기사 공통)"}, {"id": 454, "chap": "접지·감전", "topic": "감전 보호", "q": "전원 자동차단에 의한 보호에서 몇 [V](실효값)를 초과하는 접촉전압이 발생하면 전원을 자동 차단해야 하는가?", "ans": "교류 50 [V]", "h1": "접촉전압 50 V", "h2": "감전 숫자는 1 → 5 → 20 순서로 묶고, “감지 수mA · 경련 5~20mA · 심실세동 수십mA”라는 리듬으로 외운다.", "freq": "-", "src": "-", "verify": "공사요약집 p.209 수록 문항 (공사기사 공통)"}, {"id": 455, "chap": "접지·감전", "topic": "감전", "q": "감전 피해의 위험도를 결정하는 요인 4가지를 쓰시오.", "ans": "① 통전 전류의 크기\n② 통전 시간\n③ 통전 경로\n④ 전원의 종류 (교류·직류)", "h1": "경크시전 → 경로 · 크기 · 시간 · 전원종류", "h2": "[고기접중] 감전 대책반이 고감도 누전차단기 설치 → 기계기구의 외함 접지 → 접지 시설을 완벽하게 한다 → 2중 절연 구조의 전기기기 선정 순서로 조치하는 장면을 그린다.", "freq": "★ 1회 120제", "src": "[09-2]", "verify": "전기요약집 p.135 · 120제 일치"}, {"id": 456, "chap": "접지·감전", "topic": "감전", "q": "인체 감전 정도에 따른 전류 3종류(감지·경련·심실세동)를 설명하시오.", "ans": "감지전류 : 수 [mA]를 넘으면 자극으로 느낌 (사람에 따라 1[mA] 이하에서도 느낌)\n경련전류 : 5~20[mA] 범위에서 근육 수축·경련으로 도체에서 손을 뗄 수 없는 상태\n심실세동전류 : 수십 [mA]에서 심장 근육 경련 → 혈액 공급 정지, 사망 우려 (단시간 내 통전 정지 시 면할 수 있음)", "h1": "감지 수mA · 경련 5~20mA · 심실세동 수십mA", "h2": "[인감보] 누전차단기 체크리스트를 펼쳐 인감보 15 mA → 0.03초 순서로 하나씩 짚는다.", "freq": "★ 1회", "src": "[09-3]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 457, "chap": "접지·감전", "topic": "감전", "q": "저압 기계기구의 절연불량으로 인한 감전사고를 방지하기 위한 기술적 대책 4가지를 쓰시오.", "ans": "① 고감도 누전차단기 설치\n② 기계기구의 외함 접지\n③ 접지 시설을 완벽하게 한다.\n④ 2중 절연 구조의 전기기기 선정", "h1": "고기접이", "h2": "누전차단기 감도전류는 10 → 15 → 30 mA를 작은 값부터 계단처럼 올려 기억한다.", "freq": "- 120제", "src": "-", "verify": "120제 일치"}, {"id": 458, "chap": "접지·감전", "topic": "누전차단기", "q": "욕실 등 인체가 물에 젖어있는 상태에서 물을 사용하는 장소에 콘센트를 시설할 때 설치해야 하는 저압 차단기의 정확한 명칭과 정격감도전류·동작시간을 쓰시오.", "ans": "명칭 : 인체감전보호용 누전차단기\n정격감도전류 : 15[mA] 이하\n동작시간 : 0.03[초] 이하 (전류동작형)", "h1": "인감보 15 mA · 0.03초", "h2": "[NGR] 중성점 접지저항기 체크리스트를 펼쳐 NGR = 지락전류↓ → 건전상 전위↓ 순서로 하나씩 짚는다.", "freq": "★ 2회", "src": "[24-1] [16-3]", "verify": "전기요약집 p.83 일치"}, {"id": 459, "chap": "접지·감전", "topic": "누전차단기", "q": "주택용 누전차단기의 정격감도전류 3가지를 쓰시오.", "ans": "10[mA], 15[mA], 30[mA]", "h1": "10 · 15 · 30 mA", "h2": "[땅양] 접지 용구 작업자가 땅 먼저, 선로 나중 → 양쪽 다 순서대로 작업하는 장면을 그린다.", "freq": "-", "src": "-", "verify": "공사요약집 p.251 수록 문항 (공사기사 공통) 전기요약집 p.82 일치"}, {"id": 460, "chap": "접지·감전", "topic": "중성점 접지저항기", "q": "중성점 접지 저항기(NGR)의 기능을 쓰시오.", "ans": "지락 사고 시 지락전류를 억제하고 건전상의 대지전위 상승을 억제한다.", "h1": "NGR = 지락전류↓ · 건전상 전위↓", "h2": "[차단] 정전작업 작업자가 1단계 : 작업 전 전원 차단 → 2단계 : 전원 투입 방지 (시건장치, 통전금지 표지) → 3단계 : 작업장소의 무전압 확인 (잔류전하 방전, 검전기 사용) → 4단계 : 단락 접지 (단락접지기구 사용) → 5단계 : 작업장소의 보호 순서대로 작업하는 장면을 그린다.", "freq": "★ 2회", "src": "[15-2] [01-1]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 461, "chap": "접지·감전", "topic": "접지 용구", "q": "접지용구를 사용하여 접지할 때의 접지 순서와 접지 개소를 쓰시오.", "ans": "접지 순서 : 대지에 먼저 연결한 후 선로에 연결한다. (해체는 역순)\n접지 개소 : 작업 구간의 전원측(선로측)과 부하측 양측에 접지한다.", "h1": "땅 먼저, 선로 나중 / 양쪽 다", "h2": "[누전] 전기화재 관련 항목을 누전 불과 낙지 (누전 → 불꽃 → 과전류 → 낙뢰 → 지락) + 단락 3종 순서로 한 줄 기차처럼 이어 붙인다.", "freq": "★ 2회", "src": "[10-1] [02-1]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 462, "chap": "접지·감전", "topic": "정전작업", "q": "정전작업 개시 시 실시하는 정전 5단계 순서를 쓰시오.", "ans": "1단계 : 작업 전 전원 차단\n2단계 : 전원 투입 방지 (시건장치, 통전금지 표지)\n3단계 : 작업장소의 무전압 확인 (잔류전하 방전, 검전기 사용)\n4단계 : 단락 접지 (단락접지기구 사용)\n5단계 : 작업장소의 보호", "h1": "차단 → 잠금 → 검전 → 단락접지 → 보호", "h2": "외함 접지는 세 장면에서 생략한다. 직류 300 V·교류 150 V 이하를 건조한 곳에 둘 때, 절연대를 둘 때, 300 V·3 kVA 이하 절연변압기로 비접지 공급할 때다.", "freq": "-", "src": "-", "verify": "공사요약집 p.208 수록 문항 (공사기사 공통)"}, {"id": 463, "chap": "접지·감전", "topic": "전기화재", "q": "전기화재의 발생 원인 5가지를 쓰시오.", "ans": "① 접촉 불량에 의한 단락\n② 절연 열화에 의한 단락\n③ 압착 손상에 의한 단락\n④ 과부하·과전류\n⑤ 누전·지락", "h1": "누전 불과 낙지 (누전 · 불꽃 · 과전류 · 낙뢰 · 지락) + 단락 3종", "h2": "KEC 접지점검표에서 0.75 · 1 · 2 → 고압 6 · 중성점 16(6) 순서로 확인한다.", "freq": "★ 1회", "src": "[10-3]", "verify": "전기요약집 p.136 일치"}, {"id": 464, "chap": "접지·감전", "topic": "외함 접지", "q": "KEC에 따라 기계기구의 철대 및 외함 접지를 생략할 수 있는 경우를 쓰시오.", "ans": "① 사용전압이 직류 300[V] 또는 교류 대지전압 150[V] 이하인 기계기구를 건조한 곳에 시설하는 경우\n② 철대 또는 외함 주위에 적당한 절연대를 설치한 경우\n③ 전원측에 절연변압기(2차 전압 300[V] 이하, 정격용량 3[kVA] 이하)를 시설하고 부하측 전로를 접지하지 않는 경우", "h1": "직300·교150 건조 · 절연대 · 절연변압기(300 V, 3 kVA)", "h2": "[경로] KEC 접지 관련 항목을 접지도체 → 보호접지 → 접지시스템 순서로 한 줄 기차처럼 이어 붙인다.", "freq": "-", "src": "-", "verify": "공사요약집 p.56 수록 문항 (공사기사 공통)"}, {"id": 465, "chap": "접지·감전", "topic": "KEC 접지", "q": "KEC 접지공사 기준 빈칸을 채우시오.\n접지극 매설깊이 지하 ( ① )[m] 이상 / 철주 따라 시설 시 금속체로부터 ( ② )[m] 이상 이격 / 접지도체는 지하 0.75[m]~지표상 ( ③ )[m]까지 합성수지관으로 보호 / 특고압·고압용 접지도체 ( ④ )[㎟] 이상 / 중성점 접지용 ( ⑤ )[㎟] 이상(예외 ( ⑥ )[㎟])", "ans": "① 0.75\n② 1\n③ 2\n④ 6\n⑤ 16\n⑥ 6", "h1": "0.75 · 1 · 2 / 고압 6 · 중성점 16(6)", "h2": "[전기] 감전에서는 전기 재해 : 감전, 아크 복사열에 의한 화상, 전기화재, 전기설비 손괴·기능 정지 → 정전기 재해 : 감전(전격), 설비 기능 저하, 정전기 화재 → 낙뢰 재해 : 감전, 낙뢰 화재, 물체(설비) 손괴 순서로 장면을 이어 간다.", "freq": "-", "src": "-", "verify": "전기요약집 p.148 수록 문항"}, {"id": 466, "chap": "접지·감전", "topic": "KEC 접지", "q": "다음 KEC 용어를 쓰시오.\n① 계통·설비·기기의 한 점과 접지극 사이의 도전성 경로 ② 고장 시 감전 보호를 목적으로 기기의 한 점 이상을 접지 ③ 기기·계통을 접지하기 위한 접속 및 장치로 구성된 설비", "ans": "① 접지도체\n② 보호접지\n③ 접지시스템", "h1": "경로 = 도체, 감전보호 = 보호접지, 설비 = 시스템", "h2": "[접마박] 감전 체크리스트를 펼쳐 접마박 → 접지 · 습도 순서로 하나씩 짚는다.", "freq": "-", "src": "-", "verify": "전기요약집 p.146 수록 문항"}, {"id": 467, "chap": "접지·감전", "topic": "감전", "q": "전기재해를 3가지로 분류하여 설명하시오.", "ans": "전기 재해 : 감전, 아크 복사열에 의한 화상, 전기화재, 전기설비 손괴·기능 정지\n정전기 재해 : 감전(전격), 설비 기능 저하, 정전기 화재\n낙뢰 재해 : 감전, 낙뢰 화재, 물체(설비) 손괴", "h1": "전기 = 감아전전 / 정전기 = 감설정 / 낙뢰 = 감낙물", "h2": "접지 이격: “피뢰침 접지와 2 m”가 떠오르면 정답 문장을 복원한다 — 2 [m] 이상", "freq": "-", "src": "-", "verify": "전기요약집 p.133 수록 문항 · 350제 94번 일치"}, {"id": 468, "chap": "접지·감전", "topic": "감전", "q": "정전기 대전의 종류 3가지와 정전기 발생 억제 방법 2가지를 쓰시오.", "ans": "대전 : ① 접촉 대전 ② 마찰 대전 ③ 박리 대전\n억제 : ① 대전 물체의 전기적 접지 ② 주변 습도 상승", "h1": "접마박 / 접지 · 습도", "h2": "접지 이격: “사람 손 닿는 2 m까지 보호”가 떠오르면 정답 문장을 복원한다 — 접지선에 사람이 접촉할 우려가 있으므로 감전사고를 미연에 방지하기 위해", "freq": "-", "src": "-", "verify": "전기요약집 p.229 수록 문항"}, {"id": 469, "chap": "접지·감전", "topic": "접지 이격", "q": "전등전력용·소세력회로용 접지극(접지선)은 피뢰침용 접지극(접지선)에서 몇 [m] 이상 이격하는가?", "ans": "2 [m] 이상", "h1": "피뢰침 접지와 2 m", "h2": "[접지식] 접지 목적에서는 접지식 : 전선과 대지 사이의 전압 → 비접지식 : 전선과 그 전로 중 임의의 다른 전선 사이의 전압 순서로 장면을 이어 간다.", "freq": "-", "src": "-", "verify": "전기요약집 p.80 수록 문항 · 350제 262번 일치"}, {"id": 470, "chap": "접지·감전", "topic": "접지 이격", "q": "철주에 절연전선으로 접지공사를 할 때 지표상 2[m]까지 합성수지관 등으로 덮어야 하는 이유는?", "ans": "접지선에 사람이 접촉할 우려가 있으므로 감전사고를 미연에 방지하기 위해", "h1": "사람 손 닿는 2 m까지 보호", "h2": "", "freq": "-", "src": "-", "verify": "전기요약집 p.80 수록 문항 · 350제 264번 일치"}, {"id": 471, "chap": "접지·감전", "topic": "접지 목적", "q": "대지전압을 접지식 전로와 비접지식 전로로 구분하여 쓰시오.", "ans": "접지식 : 전선과 대지 사이의 전압\n비접지식 : 전선과 그 전로 중 임의의 다른 전선 사이의 전압", "h1": "접지식 = 대지와, 비접지 = 다른 선과", "h2": "[FIEBR] 조명 용어에서는 F lm → I cd → E lx → B nt → R rlx 순서로 장면을 이어 간다.", "freq": "-", "src": "-", "verify": "전기요약집 p.124 수록 문항"}, {"id": 472, "chap": "조명", "topic": "조명 용어", "q": "조명 용어 광속·광도·조도·휘도·광속발산도의 기호[단위]와 의미를 쓰시오.", "ans": "광속 F[lm] : 방사속 중 빛으로 느끼는 부분\n광도 I[cd] : 어떤 방향의 단위 입체각당 발산 광속\n조도 E[lx] : 단위 면적당 입사 광속\n휘도 B[nt, sb] : 임의 방향에서 본 단위 투영면적당 광도\n광속발산도 R[rlx] : 광원(물체)의 단위 면적당 발산 광속", "h1": "F lm · I cd · E lx · B nt · R rlx", "h2": "조명 용어: “색이 제대로 연출 = 연색성”가 떠오르면 정답 문장을 복원한다 — 연색성", "freq": "-", "src": "-", "verify": "HWP 기준 (엑셀·교재 미수록)"}, {"id": 473, "chap": "조명", "topic": "조명 용어", "q": "어느 광원의 광색이 어느 온도의 흑체 광색과 같을 때, 그 흑체의 온도를 이 광원의 무엇이라 하는가?", "ans": "색온도 [K]", "h1": "흑체 온도 = 색온도", "h2": "조명 용어: “면적당 '나가는' 광속 = 광속발산도”가 떠오르면 정답 문장을 복원한다 — 광속 발산도 [rlx]", "freq": "★ 2회 120제", "src": "[21-1] [15-1]", "verify": "전기요약집 p.153 · 350제 126번 · 120제 일치"}, {"id": 474, "chap": "조명", "topic": "조명 용어", "q": "빛의 분광 특성이 색의 보임에 미치는 효과로, 같은 색이라도 조명하는 빛에 따라 다르게 보이는 특성은?", "ans": "연색성", "h1": "색이 제대로 연출 = 연색성", "h2": "전등효율은 소비전력 대비 광속, 발광효율은 방사속 대비 광속이다. 둘 다 결과는 lm/W다.", "freq": "★ 2회 120제", "src": "[21-1] [15-1]", "verify": "전기요약집 p.153 · 350제 126번 · 120제 일치"}, {"id": 475, "chap": "조명", "topic": "조명 용어", "q": "보이는 물체에서 눈의 방향으로 방사되는 단위 면적당 광속을 무엇이라 하는가?", "ans": "광속 발산도 [rlx]", "h1": "면적당 '나가는' 광속 = 광속발산도", "h2": "조명 설계: “광노오효 광속감소 → 소요광속 여유”가 떠오르면 정답 문장을 복원한다 — 조명설비는 시간 경과에 따라 광원의 노화·오손·효율 저하 등으로 광속이 감소하므로, 조명설계 시 이러한 광속 감소를 미리 예상하여 소요 광속에 여유를 두는 정도", "freq": "-", "src": "-", "verify": "공사요약집 p.188 수록 문항 (공사기사 공통)"}, {"id": 476, "chap": "조명", "topic": "조명 효율", "q": "조명의 전등효율과 발광효율에 대하여 설명하시오.", "ans": "전등효율 : 소비전력 P에 대한 전발산 광속 F의 비율 [lm/W]\n발광효율 : 방사속 Φ에 대한 광속 F의 비율 [lm/W]", "h1": "전등 = 전력 기준, 발광 = 방사속 기준", "h2": "[램오오] 조명 설계 관련 항목을 램프의 광속 및 효율 저하 → 오염에 의한 벽·천장 반사율 감소 → 오염에 의한 등기구 이용 광속 감소 순서로 한 줄 기차처럼 이어 붙인다.", "freq": "★ 1회 120제", "src": "[17-1]", "verify": "350제 106번 · 120제 일치"}, {"id": 477, "chap": "조명", "topic": "조명 설계", "q": "조명 용어 중 감광보상률이란 무엇을 의미하는가?", "ans": "조명설비는 시간 경과에 따라 광원의 노화·오손·효율 저하 등으로 광속이 감소하므로, 조명설계 시 이러한 광속 감소를 미리 예상하여 소요 광속에 여유를 두는 정도", "h1": "광노오효 광속감소 → 소요광속 여유", "h2": "[온전전] 조명 설계에서는 온도 방사 (열방사) → 전기 루미네선스 → 전계 루미네선스 순서로 장면을 이어 간다.", "freq": "★ 1회", "src": "[15-2]", "verify": "공사요약집 p.173 일치"}, {"id": 478, "chap": "조명", "topic": "조명 설계", "q": "건물 내 조명설비의 조도가 시설 당시보다 점차 떨어지는 주요 이유 3가지를 쓰시오.", "ans": "① 램프의 광속 및 효율 저하\n② 오염에 의한 벽·천장 반사율 감소\n③ 오염에 의한 등기구 이용 광속 감소", "h1": "램 오벽 오등", "h2": "구형 글로브의 광속발산도는 투과한 빛 τI를, 반사로 남는 몫 (1−ρ)와 면적의 r²로 나눈다.", "freq": "-", "src": "-", "verify": "전기요약집 p.156 일치"}, {"id": 479, "chap": "조명", "topic": "조명 설계", "q": "광원이 발광하는 원리 3가지를 쓰시오.", "ans": "① 온도 방사 (열방사)\n② 전기 루미네선스\n③ 전계 루미네선스", "h1": "온전전", "h2": "[조재] 절약 체크리스트를 펼쳐 조광 → 재실 → 유지 → 격등 → 고효율 → 고역률 → 고조도 → 창측 순서로 하나씩 짚는다.", "freq": "★ 1회", "src": "[20-4]", "verify": "전기요약집 p.166 일치"}, {"id": 480, "chap": "조명", "topic": "조명 설계", "q": "반사율 ρ, 투과율 τ, 반지름 r인 완전 확산성 구형 글로브 중심에 광도 I인 점광원을 켰을 때 광속발산도 R[rlx]의 계산식을 쓰시오.", "ans": "R = τ·I / ((1 − ρ)·r²)  [rlx]\n(글로브 효율 η = τ/(1−ρ), 광속 F = 4πI, 면적 S = 4πr² → R = ηF/S)", "h1": "τI ÷ (1−ρ)r²", "h2": "[노조노조광도] 도로조명점검표에서 노면휘도↑ → 조명눈부심 → 노면균일 → 조화 → 광색 → 도로보도 순서로 확인한다.", "freq": "★ 1회", "src": "[19-3]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 481, "chap": "조명", "topic": "절약", "q": "조명설비의 전력을 절약하는 효율적인 방법 8가지를 쓰시오.", "ans": "① 고효율 등기구 채용\n② 고역률 등기구 채용\n③ 고조도·저휘도 반사갓 채용\n④ 슬림라인 형광등 및 안정기 내장형 램프 채택\n⑤ 전반조명과 국부조명의 적절한 병용 (TAL)\n⑥ 재실감지기 및 카드키 채용\n⑦ 창측 조명기구 개별 점등\n⑧ 적절한 조광제어 실시\n(그 외) 등기구 격등제어, 적절한 유지보수", "h1": "조재 유격 고고고창 → 조광 · 재실 · 유지 · 격등 · 고효율 · 고역률 · 고조도 · 창측", "h2": "[고휘순] 눈부심 관련 항목을 고휘도 → 순응결핍 → 눈 입사광속 → 휘도대비(물체) → 광원 주시 순서로 한 줄 기차처럼 이어 붙인다.", "freq": "★ 2회", "src": "[10-3] [08-1]", "verify": "공사요약집 p.174 일치"}, {"id": 482, "chap": "조명", "topic": "도로조명", "q": "도로조명 설계에 있어서 고려해야 할 사항 5가지를 쓰시오.", "ans": "① 노면의 휘도가 충분히 높을 것\n② 노면의 휘도가 충분히 균일할 것\n③ 조명기구의 눈부심이 적을 것\n④ 조명의 광색·연색성이 적절할 것\n⑤ 도로 양측 보도가 충분히 밝을 것(연직면 조도)\n(그 외) 주변 경관을 해치지 않을 것", "h1": "노조노조광도 → 노면휘도↑ · 조명눈부심 · 노면균일 · 조화 · 광색 · 도로보도", "h2": "[보루배글간건] 눈부심 대책반이 보호각이 충분한 반사갓·프리즘 부착 → 아크릴 루버 또는 젖빛 유리구 사용 → 수평 방향 광도가 낮은 배광기구 사용 → 글레어존(시선 상하 30°)을 피한다 → 간접·반간접 조명방식 채택 → 건축화 조명방식 채택 순서로 조치하는 장면을 그린다.", "freq": "★★ 3회", "src": "[09-3] [05-1] [03-3]", "verify": "전기요약집 p.155 일치"}, {"id": 483, "chap": "조명", "topic": "눈부심", "q": "조명설계 시 눈부심을 일으키는 원인 5가지를 쓰시오.", "ans": "① 광원의 휘도가 높을 때 (고휘도 광원·반사면·투과면)\n② 순응이 잘 안 될 때\n③ 눈에 입사하는 광속이 너무 많을 때\n④ 광원과 배경 사이의 휘도 대비가 클 때\n⑤ 광원을 오래 바라볼 때", "h1": "고휘순 눈물 광원 → 고휘도 · 순응결핍 · 눈 입사광속 · 휘도대비(물체) · 광원 주시", "h2": "[연기가점역] 광원 적용 장면에서는 연색 → 기동 → 가격 → 점등 → 역률 순서로 장점이 차례로 나타난다.", "freq": "★ 1회", "src": "[11-3]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 484, "chap": "조명", "topic": "눈부심", "q": "건축물 조명설계 시 눈부심 방지 방법을 쓰시오.", "ans": "① 보호각이 충분한 반사갓·프리즘 부착\n② 아크릴 루버 또는 젖빛 유리구 사용\n③ 수평 방향 광도가 낮은 배광기구 사용\n④ 글레어존(시선 상하 30°)을 피한다.\n⑤ 간접·반간접 조명방식 채택\n⑥ 건축화 조명방식 채택", "h1": "보루배글간건", "h2": "[수열] 광원 적용 장면에서는 수열 필효 눈 → 역률 점등 값 온 깜빡 순서로 장점이 차례로 나타난다.", "freq": "-", "src": "-", "verify": "공사요약집 p.187 일치"}, {"id": 485, "chap": "조명", "topic": "광원", "q": "백열전구의 장점을 쓰시오.", "ans": "① 연색성이 우수하다.\n② 기동시간이 짧다.\n③ 가격이 저렴하다.\n④ 점등 방식이 간단하다.\n⑤ 역률이 좋다.", "h1": "연기가 점 역하다 → 연색 · 기동 · 가격 · 점등 · 역률", "h2": "[필순관전점] 광원 적용 장면에서는 필라멘트예열X → 순시기동 → 관길어효율 → 전압변동 → 점등불량X 순서로 장점이 차례로 나타난다.", "freq": "- 120제", "src": "-", "verify": "전기요약집 p.157 · 350제 108번 · 120제 일치"}, {"id": 486, "chap": "조명", "topic": "광원", "q": "형광등을 백열전구와 비교할 때의 장점과 단점을 쓰시오.", "ans": "장점 : ① 수명이 길다 ② 열방사가 적다 ③ 필요한 광색을 쉽게 얻는다 ④ 효율이 좋다 ⑤ 눈부심이 적다\n단점 : ① 역률이 나쁘다 ② 점등에 시간이 걸린다 ③ 값이 비싸다 ④ 온도 영향을 받는다 ⑤ 깜박거림이 생기기 쉽다", "h1": "수열 필효 눈 / 역률 점등 값 온 깜빡", "h2": "[비음위] 광원 점검 장면에서는 비싸다 → 음극손상 → 위험 순서로 단점이 드러난다.", "freq": "- 120제", "src": "-", "verify": "120제 일치"}, {"id": 487, "chap": "조명", "topic": "광원", "q": "슬림라인 형광등의 장점 5가지를 쓰시오.", "ans": "① 필라멘트를 예열할 필요가 없어 기동장치(점등관)가 불필요하다.\n② 순시 기동으로 점등에 시간이 걸리지 않는다.\n③ 관이 길어 양광주가 길고 효율이 좋다.\n④ 전압 변동에 의한 수명 단축이 없다.\n⑤ 점등 불량으로 인한 고장이 없다.", "h1": "필순관전점 → 필라멘트예열X · 순시기동 · 관길어효율 · 전압변동 · 점등불량X", "h2": "[전효성] 광원 체크리스트를 펼쳐 전용안정기 → 효율 → 성능(35℃) → 일정출력 → 등슬림 순서로 하나씩 짚는다.", "freq": "★ 1회 120제", "src": "[04-1]", "verify": "전기요약집 p.159 · 120제 일치"}, {"id": 488, "chap": "조명", "topic": "광원", "q": "슬림라인 형광등의 단점 3가지를 쓰시오.", "ans": "① 점등장치가 비싸다.\n② 전압이 높아 기동 시 음극이 손상되기 쉽다.\n③ 전압이 높아 위험하다.", "h1": "비음위 → 비싸다 · 음극손상 · 위험", "h2": "[전수발] 광원에서는 전력소모가 적다 → 수명이 길다 → 발열이 매우 적다 → 내구성이 높아 외부 충격에 강하다 → 친환경적이다 순서로 장면을 이어 간다.", "freq": "★ 1회", "src": "[04-1]", "verify": "전기요약집 p.159 일치 / 350제 114번은 '수명이 짧다·전력손실이 크다' 수록"}, {"id": 489, "chap": "조명", "topic": "광원", "q": "T-5 램프의 특징 5가지를 쓰시오.", "ans": "① 전용 전자식 안정기와 조합하여 동작한다.\n② 발광 효율이 높다.\n③ 램프 표면온도 35[℃]일 때 성능이 가장 좋다.\n④ 일정한 광출력을 낸다.\n⑤ 슬림하여 디자인적으로 유리하며 평균 수명이 길다.", "h1": "전효성 일등 → 전용안정기 · 효율 · 성능(35℃) · 일정출력 · 등슬림", "h2": "광원: “PN 접합 재결합”가 떠오르면 정답 문장을 복원한다 — 반도체 PN 접합 구조에서 소수캐리어(전자와 정공)를 주입하여 이들의 재결합에 의해 발광하는 원리 (전계 루미네선스)", "freq": "★ 1회", "src": "[14-2]", "verify": "350제 119번 일치"}, {"id": 490, "chap": "조명", "topic": "광원", "q": "기존 광원과 비교한 LED 램프의 특성 5가지를 쓰시오.", "ans": "① 전력소모가 적다.\n② 수명이 길다.\n③ 발열이 매우 적다.\n④ 내구성이 높아 외부 충격에 강하다.\n⑤ 친환경적이다.", "h1": "전수발 내외랑 친하다", "h2": "[HID] 광원 체크리스트를 펼쳐 HID = 수 → 나 → 메 순서로 하나씩 짚는다.", "freq": "- 120제", "src": "-", "verify": "전기요약집 p.160 · 120제 일치"}, {"id": 491, "chap": "조명", "topic": "광원", "q": "발광다이오드(LED)의 발광 원리를 쓰시오.", "ans": "반도체 PN 접합 구조에서 소수캐리어(전자와 정공)를 주입하여 이들의 재결합에 의해 발광하는 원리 (전계 루미네선스)", "h1": "PN 접합 재결합", "h2": "연색성이 좋은 HID 광원을 물으면 금속을 넣은 메탈 할라이드 램프를 고른다.", "freq": "-", "src": "-", "verify": "공사요약집 p.186 수록 문항 (공사기사 공통)"}, {"id": 492, "chap": "조명", "topic": "광원", "q": "HID의 우리말 명칭과 종류 3가지를 쓰시오.", "ans": "명칭 : 고휘도 방전램프 (High Intensity Discharge Lamp)\n종류 : ① 고압 수은등 ② 고압 나트륨등 ③ 메탈 할라이드등", "h1": "HID = 수·나·메", "h2": "광원 숫자는 250 → 75 → 2,500 → 1 → 3 순서로 묶고, “건조 · 250 W · 75% · 2500 K · 1~3 μm”라는 리듬으로 외운다.", "freq": "★★ 3회", "src": "[24-2] [06-1] [03-3]", "verify": "공사요약집 p.181 일치"}, {"id": 493, "chap": "조명", "topic": "광원", "q": "연색성이 우수하고 주광색 빛을 내며, 수은등·백열등보다 전력소모가 적고 수명이 길며 시동에 5~8분이 걸리는 램프는?", "ans": "메탈 할라이드 램프", "h1": "연색성 좋은 HID = 메탈 할라이드", "h2": "[흑수점] 광원 적용 장면에서는 흑수점 → 옥투고 순서로 장점이 차례로 나타난다.", "freq": "-", "src": "-", "verify": "공사요약집 p.182 수록 문항 (공사기사 공통)"}, {"id": 494, "chap": "조명", "topic": "광원", "q": "적외선 전구의 용도·주로 쓰는 용량·효율·필라멘트 온도·파장을 쓰시오.", "ans": "용도 : 적외선에 의한 가열 및 건조 (표면가열)\n용량 : 250 [W]\n효율 : 75 [%]\n필라멘트 온도 : 2,500 [K]\n파장 : 1~3 [μm]", "h1": "건조 · 250 W · 75% · 2500 K · 1~3 μm", "h2": "[순속글] 광원 체크리스트를 펼쳐 순시 기동 회로 → 속시 기동 회로 → 글로우 스타터 회로 순서로 하나씩 짚는다.", "freq": "★ 1회", "src": "[07-3]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 495, "chap": "조명", "topic": "광원", "q": "할로겐 램프의 장점과 용도를 쓰시오.", "ans": "장점 : ① 흑화가 거의 발생하지 않는다 ② 백열전구보다 수명이 길다 ③ 별도의 점등장치가 필요하지 않다\n용도 : ① 옥외용 투광조명 ② 고천장 조명", "h1": "흑수점 / 옥투고", "h2": "조명 방식 숫자는 90 → 100 → 60 → 40 → 10 → 0 순서로 묶고, “하향광속 90 · 60 · 40 · 10 · 0 (직 · 반직 · 전반 · 반간 · 간)”라는 리듬으로 외운다.", "freq": "- 120제", "src": "-", "verify": "전기요약집 p.162 · 120제 일치"}, {"id": 496, "chap": "조명", "topic": "광원", "q": "형광 방전램프 점등회로의 종류 3가지를 쓰시오.", "ans": "① 순시 기동 회로\n② 속시 기동 회로\n③ 글로우 스타터 회로", "h1": "순속글", "h2": "[전반] 조명 방식 체크리스트를 펼쳐 전반 → 국부 → 국부적전반 (+TAL) 순서로 하나씩 짚는다.", "freq": "-", "src": "-", "verify": "전기요약집 p.165 일치"}, {"id": 497, "chap": "조명", "topic": "조명 방식", "q": "조명기구의 배광에 의한 조명방식 5가지를 쓰시오.", "ans": "① 직접 조명 (하향광속 90~100[%])\n② 반직접 조명 (60~90[%])\n③ 전반 확산 조명 (상·하 각 40~60[%])\n④ 반간접 조명 (하향 10~40[%])\n⑤ 간접 조명 (하향 0~10[%])", "h1": "하향광속 90 · 60 · 40 · 10 · 0 (직 · 반직 · 전반 · 반간 · 간)", "h2": "[매형] 건축화 조명 체크리스트를 펼쳐 매입 형광등 방식 → 라인 라이트 방식 → 다운 라이트 방식 → 핀 홀 라이트 방식 → 코퍼 라이트 방식 순서로 하나씩 짚는다.", "freq": "★ 1회", "src": "[18-2]", "verify": "공사요약집 p.192 일치"}, {"id": 498, "chap": "조명", "topic": "조명 방식", "q": "조명기구 배치에 따른 조명방식을 쓰시오.", "ans": "① 전반 조명 방식 : 일정한 높이·간격으로 배치하여 방 전체 조도를 균일하게\n② 국부 조명 방식 : 필요한 곳에 필요한 방향으로 충분한 조도\n③ 국부적 전반 조명 방식\n(그 외) TAL(Task & Ambient Lighting) 조명", "h1": "전반 · 국부 · 국부적전반 (+TAL)", "h2": "[천장] 건축화 조명 체크리스트를 펼쳐 천장면 : ① 매입 형광등 ② 라인 라이트 ③ 다운 라이트 (+광천장, 루버, 코퍼) → 벽면 : ① 코너 조명 ② 코니스 조명 ③ 밸런스 조명 순서로 하나씩 짚는다.", "freq": "-", "src": "-", "verify": "공사요약집 p.174 일치"}, {"id": 499, "chap": "조명", "topic": "건축화 조명", "q": "매입 방법에 따른 건축화 조명 방식의 종류를 쓰시오.", "ans": "① 매입 형광등 방식\n② 라인 라이트 방식\n③ 다운 라이트 방식\n④ 핀 홀 라이트 방식\n⑤ 코퍼 라이트 방식", "h1": "매형 라이타 핀 코", "h2": "건축화 조명: “벽 위 모서리 숨김 → 아래 벽 = 코니스”가 떠오르면 정답 문장을 복원한다 — 코니스 조명", "freq": "-", "src": "-", "verify": "공사요약집 p.176 일치"}, {"id": 500, "chap": "조명", "topic": "건축화 조명", "q": "건축화 조명에서 천장면을 이용하는 방식 3가지와 벽면을 이용하는 방식 3가지를 쓰시오.", "ans": "천장면 : ① 매입 형광등 ② 라인 라이트 ③ 다운 라이트 (+광천장, 루버, 코퍼)\n벽면 : ① 코너 조명 ② 코니스 조명 ③ 밸런스 조명", "h1": "천장 = 매형 라이타 / 벽면 = 코코밸", "h2": "[구멍] 건축화 조명에서는 구멍 = 다운 → 판 = 광천장 → 분위기 벽 = 밸런스 → 구석 = 코너 순서로 장면을 이어 간다.", "freq": "-", "src": "-", "verify": "전기요약집 p.167 일치"}, {"id": 501, "chap": "조명", "topic": "건축화 조명", "q": "형광등 기구를 벽면 상방 모서리(천장과 벽 경계의 둘레턱)에 숨겨 설치하여, 기구의 빛이 직접 아래 벽면을 조명하는 건축화 조명은?", "ans": "코니스 조명", "h1": "벽 위 모서리 숨김 → 아래 벽 = 코니스", "h2": "[주파수] 주파수에서는 광속 : 증가한다. (f↓ → XL↓ → 전류↑) → 점등시간 : 늦어진다 순서로 장면을 이어 간다.", "freq": "★ 1회 120제", "src": "[20-1]", "verify": "공사요약집 p.191 일치 전기요약집 p.165 · 350제 125번 · 120제 일치"}, {"id": 502, "chap": "조명", "topic": "건축화 조명", "q": "건축화 조명 중 다음을 쓰시오.\n① 천장에 작은 구멍을 많이 뚫어 기구를 매입 ② 천장에 확산투과재(아크릴판)를 붙이고 내부에 광원 배치 ③ 벽면을 밝은 광원으로 조명하는 분위기 조명 ④ 천장과 벽면 경계 구석에 등기구를 설치", "ans": "① 다운 라이트 조명\n② 광천장 조명\n③ 밸런스 조명\n④ 코너 조명", "h1": "구멍 = 다운 · 판 = 광천장 · 분위기 벽 = 밸런스 · 구석 = 코너", "h2": "등간격: “S ≤ 1.5H”가 떠오르면 정답 문장을 복원한다 — 1.5 [배] 이하", "freq": "-", "src": "-", "verify": "공사요약집 p.175 일치"}, {"id": 503, "chap": "조명", "topic": "주파수", "q": "60[Hz]용 형광 방전등을 50[Hz]에서 사용하면 광속과 점등시간은 어떻게 되는가?", "ans": "광속 : 증가한다. (f↓ → XL↓ → 전류↑)\n점등시간 : 늦어진다.", "h1": "주파수 내리면 밝아지고 늦게 켜짐", "h2": "[직류] 깜박임 관련 항목을 직류 → 120° 3군 → 콘덴서+코일 순서로 한 줄 기차처럼 이어 붙인다.", "freq": "★ 2회", "src": "[13-2] [05-3]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 504, "chap": "조명", "topic": "등간격", "q": "양호한 전반조명이라면 등 간격은 등 높이의 몇 배 이하로 해야 하는가?", "ans": "1.5 [배] 이하", "h1": "S ≤ 1.5H", "h2": "[조광필] 깜박임 관련 항목을 조광 상태에서 필라멘트 온도가 저하하는 경우 → 인가되는 전압·전류 파형이 사인파가 아닌 경우 순서로 한 줄 기차처럼 이어 붙인다.", "freq": "★ 2회", "src": "[13-2] [05-3]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 505, "chap": "조명", "topic": "깜박임", "q": "조명설비의 깜박임(플리커) 현상을 줄이는 조치를 쓰시오.\n① 백열전등 ② 3상 전원 ③ 전구가 2개인 방전등 기구", "ans": "① 직류를 사용하여 점등한다.\n② 전체 램프를 1/3씩 3군으로 나누어 각 군의 위상이 120°가 되도록 접속하고 빛을 혼합한다.\n③ 2등용으로 하나는 콘덴서, 다른 하나는 코일을 설치하여 위상차를 두고 점등한다(리드-래그).", "h1": "직류 · 120° 3군 · 콘덴서+코일", "h2": "[법수수] 조명 용어에서는 법 → 수평 → 수직 순서로 장면을 이어 간다.", "freq": "★ 1회", "src": "[05-3]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 506, "chap": "조명", "topic": "깜박임", "q": "백열전구의 플리커 현상이 생기는 경우 2가지를 쓰시오.", "ans": "① 조광 상태에서 필라멘트 온도가 저하하는 경우\n② 인가되는 전압·전류 파형이 사인파가 아닌 경우", "h1": "조광필 인파사", "h2": "[중편대지] 도로조명에서는 중앙 배열 → 편측 배열 → 대칭 배열 → 지그재그 배열 순서로 장면을 이어 간다.", "freq": "- 120제", "src": "-", "verify": "전기요약집 p.157 · 350제 109번 · 120제 일치"}, {"id": 507, "chap": "조명", "topic": "조명 용어", "q": "광선과 피조면의 위치에 따른 조도의 분류 3가지를 쓰시오. (Lambert 코사인 법칙)", "ans": "① 법선 조도\n② 수평면 조도\n③ 수직면 조도", "h1": "법 · 수평 · 수직", "h2": "", "freq": "-", "src": "-", "verify": "전기요약집 p.164 수록 문항"}, {"id": 508, "chap": "조명", "topic": "도로조명", "q": "조명기구를 직선도로에 배치하는 방법 4가지를 쓰시오.", "ans": "① 중앙 배열\n② 편측 배열\n③ 대칭 배열\n④ 지그재그 배열", "h1": "중편대지", "h2": "금속관 부품: “박스 조이는 너트 = 로크너트 (부싱 1개당 2개)”가 떠오르면 정답 문장을 복원한다 — 로크 너트", "freq": "-", "src": "-", "verify": "350제 122번 수록 문항 · 공사요약집 p.183 일치"}, {"id": 509, "chap": "배선·재료·방폭", "topic": "금속관 부품", "q": "관과 박스를 접속할 때 파이프 나사를 죄어 고정시키며, 6각형과 기어형이 있는 금속관 부품은?", "ans": "로크 너트", "h1": "박스 조이는 너트 = 로크너트 (부싱 1개당 2개)", "h2": "[일양] 금속관 부품에서는 일반 접속 : 커플링 → 양측을 돌릴 수 없을 때 : 유니온 커플링 순서로 장면을 이어 간다.", "freq": "★ 2회", "src": "[20-2] [12-3]", "verify": "전기요약집 p.85 · 350제 285번 일치"}, {"id": 510, "chap": "배선·재료·방폭", "topic": "금속관 부품", "q": "전선관 끝에 끼워 전선을 넣거나 뺄 때 전선 피복을 보호하며, 금속제와 합성수지제 2종류가 있는 부품은?", "ans": "부싱", "h1": "관 끝 피복 보호 = 부싱", "h2": "금속관 부품: “벽에 붙이는 말안장 = 새들 (간격 2 m 이하)”가 떠오르면 정답 문장을 복원한다 — 새들 (합성수지관·가요전선관·케이블 공사에도 사용)", "freq": "★ 2회", "src": "[20-2] [12-3]", "verify": "공사요약집 p.67 일치 전기요약집 p.85 일치"}, {"id": 511, "chap": "배선·재료·방폭", "topic": "금속관 부품", "q": "금속관 상호 접속 또는 관과 노멀밴드 접속에 사용하는 부품과, 관의 양측을 돌려서 접속할 수 없을 때 사용하는 부품을 쓰시오.", "ans": "일반 접속 : 커플링\n양측을 돌릴 수 없을 때 : 유니온 커플링", "h1": "못 돌리면 유니온", "h2": "금속관 부품: “매입 직각 = 노멀밴드 / 노출 직각 = 유니버셜 엘보”가 떠오르면 정답 문장을 복원한다 — 노멀 밴드", "freq": "★ 2회", "src": "[20-2] [12-3]", "verify": "공사요약집 p.67 일치"}, {"id": 512, "chap": "배선·재료·방폭", "topic": "금속관 부품", "q": "노출 배관에서 금속관을 조영재에 고정시키는 데 사용하는 부품은?", "ans": "새들 (합성수지관·가요전선관·케이블 공사에도 사용)", "h1": "벽에 붙이는 말안장 = 새들 (간격 2 m 이하)", "h2": "금속관 부품: “노출 직각 = 유니버셜 엘보”가 떠오르면 정답 문장을 복원한다 — 유니버셜 엘보", "freq": "★ 2회", "src": "[20-2] [12-3]", "verify": "전기요약집 p.85 · 350제 285번 일치"}, {"id": 513, "chap": "배선·재료·방폭", "topic": "금속관 부품", "q": "배관의 직각 굴곡에 사용하며 양단에 나사가 있어 관과의 접속에 커플링을 사용하는 부품은?", "ans": "노멀 밴드", "h1": "매입 직각 = 노멀밴드 / 노출 직각 = 유니버셜 엘보", "h2": "금속관 부품: “구멍이 크면 링으로 줄인다”가 떠오르면 정답 문장을 복원한다 — 링 리듀서", "freq": "★ 2회", "src": "[20-2] [12-3]", "verify": "공사요약집 p.67 일치 전기요약집 p.85 일치"}, {"id": 514, "chap": "배선·재료·방폭", "topic": "금속관 부품", "q": "노출배관 공사에서 관을 직각으로 굽히는 곳에 사용하며, T형·크로스형이 있는 부품은?", "ans": "유니버셜 엘보", "h1": "노출 직각 = 유니버셜 엘보", "h2": "[스콘] 금속관 부품에서는 스위치 → 콘센트 = 스위치박스 순서로 장면을 이어 간다.", "freq": "-", "src": "-", "verify": "공사요약집 p.103 일치"}, {"id": 515, "chap": "배선·재료·방폭", "topic": "금속관 부품", "q": "금속관을 아웃렛 박스의 노크아웃에 취부할 때 노크아웃 구멍이 관보다 클 때 사용하는 부품은?", "ans": "링 리듀서", "h1": "구멍이 크면 링으로 줄인다", "h2": "[각각] 금속관 부품에서는 4각 → 8각 = 아웃렛박스 순서로 장면을 이어 간다.", "freq": "★ 2회", "src": "[20-2] [12-3]", "verify": "공사요약집 p.67 일치 전기요약집 p.85 · 350제 285번 일치"}, {"id": 516, "chap": "배선·재료·방폭", "topic": "금속관 부품", "q": "매입형 스위치나 콘센트를 고정하는 데 사용하며 1개용·2개용·3개용 등이 있는 박스는?", "ans": "스위치 박스", "h1": "스위치·콘센트 = 스위치박스", "h2": "[빗물] 금속관 부품 체크리스트를 펼쳐 빗물 = 엔트런스 → 무게 = 픽스쳐스터드 → 전동기 = 터미널캡 순서로 하나씩 짚는다.", "freq": "★ 2회", "src": "[20-2] [12-3]", "verify": "전기요약집 p.85 · 350제 285번 일치"}, {"id": 517, "chap": "배선·재료·방폭", "topic": "금속관 부품", "q": "전선관 공사에서 전등기구·점멸기·콘센트의 고정 접속함으로 사용하며 4각 및 8각이 있는 박스는?", "ans": "아웃렛 박스", "h1": "4각·8각 = 아웃렛박스", "h2": "[정크션] 박스에서는 정크션 박스 : 전선 상호 간 접속 시 접속 부분이 외부로 노출되지 않도록 하기 위해 사용 → 풀 박스 : 전선의 통과(입선)를 쉽게 하기 위하여 배관 도중에 설치 (굴곡이 많거나 관 길이 25[m] 초과 시) 순서로 장면을 이어 간다.", "freq": "★ 2회", "src": "[20-2] [12-3]", "verify": "전기요약집 p.85 · 350제 285번 일치"}, {"id": 518, "chap": "배선·재료·방폭", "topic": "금속관 부품", "q": "다음 금속관 부속품의 명칭을 쓰시오.\n① 인입구·인출구 관단에 접속하여 옥외 빗물을 막는 것\n② 아웃렛 박스에 조명기구를 부착할 때 중량 장력을 보강하는 것\n③ 금속관에서 전선을 뽑아 전동기 단자에 접속할 때 사용하는 것", "ans": "① 엔트런스 캡\n② 픽스쳐 스터드와 히키\n③ 터미널 캡 (서비스 캡)", "h1": "빗물 = 엔트런스 · 무게 = 픽스쳐스터드 · 전동기 = 터미널캡", "h2": "한 회로의 모든 전선을 한 금속관에 함께 넣으면 자계가 서로 상쇄되어 와전류·발열이 줄어든다.", "freq": "-", "src": "-", "verify": "공사요약집 p.67 수록 문항 (공사기사 공통)"}, {"id": 519, "chap": "배선·재료·방폭", "topic": "박스", "q": "정크션 박스(Joint Box)와 풀 박스(Pull Box)의 용도를 쓰시오.", "ans": "정크션 박스 : 전선 상호 간 접속 시 접속 부분이 외부로 노출되지 않도록 하기 위해 사용\n풀 박스 : 전선의 통과(입선)를 쉽게 하기 위하여 배관 도중에 설치 (굴곡이 많거나 관 길이 25[m] 초과 시)", "h1": "정크션 = 접속, 풀 = 당기기(25 m)", "h2": "[6배] 금속관 공사점검표에서 6배 → 25 m → 2 m 순서로 확인한다.", "freq": "★ 1회", "src": "[12-1]", "verify": "공사요약집 p.71 일치 전기요약집 p.74 일치"}, {"id": 520, "chap": "배선·재료·방폭", "topic": "금속관 공사", "q": "금속관 배선의 교류회로에서 1회로의 전선 전부를 동일 관 내에 넣는 이유는?", "ans": "전자적 불평형을 방지하기 위하여 (관 내 와전류·발열 방지)", "h1": "한 회로는 한 관에 = 전자적 평형", "h2": "전선 약호는 C=가교 폴리에틸렌, V=비닐, D=인입, O=옥외, W=내후로 풀어 읽는다.", "freq": "-", "src": "-", "verify": "공사요약집 p.66 일치 전기요약집 p.82 일치"}, {"id": 521, "chap": "배선·재료·방폭", "topic": "금속관 공사", "q": "금속관 공사 기준 빈칸을 채우시오.\n구부림 안측 반지름은 관 안지름의 ( ① )배 이상 / 굴곡이 많거나 관 길이 ( ② )[m] 초과 시 풀박스 설치 / 새들·행거 지지 간격 ( ③ )[m] 이하", "ans": "① 6\n② 25\n③ 2", "h1": "6배 · 25 m · 2 m", "h2": "[NRCEV] 전선 약호 체크리스트를 펼쳐 N 네온 → R 고무 → C 클로로프렌 → E 폴리에틸렌 → V 비닐 순서로 하나씩 짚는다.", "freq": "-", "src": "-", "verify": "공사요약집 p.68 수록 문항 (공사기사 공통)"}, {"id": 522, "chap": "배선·재료·방폭", "topic": "전선 약호", "q": "다음 전선의 약호 명칭을 쓰시오. CV1, VV, DV, OW, CCV", "ans": "CV1 : 0.6/1[kV] 가교 폴리에틸렌 절연 비닐시스 케이블\nVV : 0.6/1[kV] 비닐절연 비닐시스 케이블\nDV : 인입용 비닐절연전선\nOW : 옥외용 비닐절연전선\nCCV : 0.6/1[kV] 제어용 가교 폴리에틸렌 절연 비닐시스 케이블", "h1": "C = 가교PE, V = 비닐, D = Drop(인입), O = Outdoor, W = Weatherproof", "h2": "전선 약호 숫자는 0.6 → 1 → 450 → 750 → 70 → 300 → 500 순서로 묶고, “CN = 동심중성선 · W = 수밀 · FR = 난연 · HF = Halogen Free”라는 리듬으로 외운다.", "freq": "★ 1회", "src": "[13-2]", "verify": "공사요약집 p.101 대조·보완: OW 명칭 일치"}, {"id": 523, "chap": "배선·재료·방폭", "topic": "전선 약호", "q": "네온전선 약호 N-V, N-RV, N-RC, N-EV의 명칭을 쓰시오.", "ans": "N-V : 비닐절연 네온전선\nN-RV : 고무절연 비닐시스 네온전선\nN-RC : 고무절연 클로로프렌시스 네온전선\nN-EV : 폴리에틸렌절연 비닐시스 네온전선", "h1": "N 네온 · R 고무 · C 클로로프렌 · E 폴리에틸렌 · V 비닐", "h2": "[허전기] 전선 선정 체크리스트를 펼쳐 허전기 (+경제 → 손실) 순서로 하나씩 짚는다.", "freq": "-", "src": "-", "verify": "공사요약집 p.4 일치 전기요약집 p.67 · 350제 241번 일치"}, {"id": 524, "chap": "배선·재료·방폭", "topic": "전선 약호", "q": "다음 전선 약호의 명칭을 쓰시오. ACSR, CNCV-W, FR CNCO-W, VCT, HFIO, NRI(70)", "ans": "ACSR : 강심 알루미늄 연선\nCNCV-W : 동심중성선 수밀형 전력케이블\nFR CNCO-W : 동심중성선 수밀형 저독성 난연 전력케이블\nVCT : 0.6/1[kV] 비닐절연 비닐 캡타이어 케이블\nHFIO : 450/750[V] 저독성 난연 폴리올레핀 절연전선\nNRI(70) : 300/500[V] 기기배선용 단심 비닐절연전선(70[℃])", "h1": "CN = 동심중성선 · W = 수밀 · FR = 난연 · HF = Halogen Free", "h2": "[2종] 배선 방법점검표에서 비닐피복 2종 금속제 가요전선관 공사 → 케이블 공사 → 케이블 트레이 공사 → 금속관 공사 순서로 확인한다.", "freq": "-", "src": "-", "verify": "전기요약집 p.84 일치"}, {"id": 525, "chap": "배선·재료·방폭", "topic": "전선 선정", "q": "전선의 굵기를 선정하는 요소 3가지를 쓰시오.", "ans": "① 허용전류\n② 전압강하\n③ 기계적 강도\n(그 외) 경제성, 전력손실", "h1": "허전기 (+경제·손실)", "h2": "옥내배선 공사는 합성수지관 → 금속관 → 금속제 가요전선관 → 케이블 순으로 묶는다. [합금금케]", "freq": "-", "src": "-", "verify": "HWP 기준 (엑셀·교재 미수록)"}, {"id": 526, "chap": "배선·재료·방폭", "topic": "배선 방법", "q": "사용전압 400[V] 이하 옥내에서 시설장소 조건(건조·습기·노출·은폐·점검불가)에 관계없이 한 가지 배선방법으로 할 때 적용 가능한 배선방법 4가지를 쓰시오.", "ans": "① 비닐피복 2종 금속제 가요전선관 공사\n② 케이블 공사\n③ 케이블 트레이 공사\n④ 금속관 공사", "h1": "2종 케케금", "h2": "배선 방법 숫자는 30 → 25 → 0.6 → 45 순서로 묶고, “심야 전부 + 일반×중첩률”라는 리듬으로 외운다.", "freq": "★ 1회", "src": "[08-3]", "verify": "공사요약집 p.83 대조·보완: PDF는 '400V 초과·습기·점검불가 은폐장소' 조건으로 같은 4가지 수록 전기요약집 p.73 일치"}, {"id": 527, "chap": "배선·재료·방폭", "topic": "배선 방법", "q": "심야전력기기를 종량제로 하는 경우 인입구 장치에서 심야전력기기까지의 배선 공사 방법 4가지를 쓰시오.", "ans": "① 합성수지관 공사\n② 금속관 공사\n③ 금속제 가요전선관 공사\n④ 케이블 공사", "h1": "합금금케", "h2": "[합합플] 배선 방법 체크리스트를 펼쳐 합금가 → 합금금 → 플셀금 순서로 하나씩 짚는다.", "freq": "★ 2회", "src": "[06-1] [01-3]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 528, "chap": "배선·재료·방폭", "topic": "배선 방법", "q": "심야전력 부하전류 30[A], 일반부하 전류 25[A], 중첩률 0.6일 때 부하 공용부분 전선의 허용전류는?", "ans": "산출식 : 허용전류 = 심야 부하전류 + (일반 부하전류 × 중첩률)\n적용 : 30 + (25 × 0.6)\n결과 : 45 [A]", "h1": "심야 전부 + 일반×중첩률", "h2": "[피플] 덕트 체크리스트를 펼쳐 피더 버스덕트 (도중에 부하 접속 없음) → 플러그인 버스덕트 (꽂음 플러그로 부하 접속) → 익스팬션 버스덕트 (열 신축 흡수) → 탭붙이 버스덕트 → 트랜스포지션 버스덕트 순서로 하나씩 짚는다.", "freq": "★ 2회", "src": "[06-1] [01-3]", "verify": "엑셀 원문 기준 (교재·HWP 미수록)"}, {"id": 529, "chap": "배선·재료·방폭", "topic": "배선 방법", "q": "KEC 배선설비 공사방법 분류에서 전선관 시스템·케이블 트렁킹 시스템·케이블 덕팅 시스템에 해당하는 공사를 쓰시오.", "ans": "전선관 시스템 : 합성수지관, 금속관, 가요전선관 공사\n케이블 트렁킹 시스템 : 합성수지몰드, 금속몰드, 금속트렁킹 공사\n케이블 덕팅 시스템 : 플로어덕트, 셀룰러덕트, 금속덕트 공사", "h1": "합금가 / 합금금 / 플셀금", "h2": "덕트: “금속덕트 20%”가 떠오르면 정답 문장을 복원한다 — 20 [%] 이하 (전광사인·출퇴표시등 제어회로 배선만 넣는 경우 50[%])", "freq": "-", "src": "-", "verify": "공사요약집 p.115 대조·보완: 케이블 덕팅 시스템 3종 일치 전기요약집 p.86 일치"}, {"id": 530, "chap": "배선·재료·방폭", "topic": "덕트", "q": "버스덕트의 종류를 쓰시오.", "ans": "① 피더 버스덕트 (도중에 부하 접속 없음)\n② 플러그인 버스덕트 (꽂음 플러그로 부하 접속)\n③ 익스팬션 버스덕트 (열 신축 흡수)\n④ 탭붙이 버스덕트\n⑤ 트랜스포지션 버스덕트\n(그 외) 트롤리 버스덕트", "h1": "피플 탭 트익", "h2": "[바닥] 덕트에서는 설명 : 통신선·전력선을 바닥에 배선하기 위해 바닥에 매입하는 강판제 덕트로, 600[㎜] 간격마다 인출구를 갖는다 → 용도 : 중·대규모 사무실, 백화점, 실험실 등의 통신선·전력선 배선 (옥내 건조한 콘크리트 바닥 매입 시에 한함) 순서로 장면을 이어 간다.", "freq": "-", "src": "-", "verify": "공사요약집 p.72 일치"}, {"id": 531, "chap": "배선·재료·방폭", "topic": "덕트", "q": "금속덕트에 넣는 저압 전선의 단면적(피복 포함) 총합은 덕트 내부 단면적의 몇 [%] 이하로 하는가?", "ans": "20 [%] 이하 (전광사인·출퇴표시등 제어회로 배선만 넣는 경우 50[%])", "h1": "금속덕트 20%", "h2": "수구·부하 숫자는 150 → 300 순서로 묶고, “콘센트·소형 150, 대형 300”라는 리듬으로 외운다.", "freq": "-", "src": "-", "verify": "공사요약집 p.74 대조·보완: PDF O/X 문항 '80% 이하'는 틀린 보기로 수록"}, {"id": 532, "chap": "배선·재료·방폭", "topic": "덕트", "q": "플로어덕트의 설명과 용도를 쓰시오.", "ans": "설명 : 통신선·전력선을 바닥에 배선하기 위해 바닥에 매입하는 강판제 덕트로, 600[㎜] 간격마다 인출구를 갖는다.\n용도 : 중·대규모 사무실, 백화점, 실험실 등의 통신선·전력선 배선 (옥내 건조한 콘크리트 바닥 매입 시에 한함)", "h1": "바닥 매입 덕트 = 플로어덕트", "h2": "[15] 점멸기에서는 15 A부터 표기 → WP → EX 순서로 장면을 이어 간다.", "freq": "-", "src": "-", "verify": "공사요약집 p.82 수록 문항 (공사기사 공통)"}, {"id": 533, "chap": "배선·재료·방폭", "topic": "수구·부하", "q": "수구 종류에 따른 예상 부하를 쓰시오.", "ans": "콘센트 : 150[VA/개]\n소형 전등수구 : 150[VA/개]\n대형 전등수구 : 300[VA/개]", "h1": "콘센트·소형 150, 대형 300", "h2": "방폭: “전기가 불씨 되지 않게”가 떠오르면 정답 문장을 복원한다 — 위험한 가스·증기·분진 등이 존재하여 폭발이 발생할 우려가 있는 곳에서, 전기설비가 점화원이 되어 폭발사고가 발생하는 것을 방지하도록 시설하는 전기설비", "freq": "-", "src": "-", "verify": "전기요약집 p.69 일치"}, {"id": 534, "chap": "배선·재료·방폭", "topic": "점멸기", "q": "점멸기 그림기호에서 용량이 몇 [A] 이상일 때 전류값을 표기하는가? 또 방수형·방폭형 표기 문자는?", "ans": "전류 표기 : 15 [A] 이상\n방수형 : WP / 방폭형 : EX", "h1": "15 A부터 표기 · WP · EX", "h2": "[지폭사특] 방폭에서는 지정 폭발성가스 → 사용 적합 → 특별 고려 순서로 장면을 이어 간다.", "freq": "★ 2회", "src": "[11-1] [03-2]", "verify": "전기요약집 p.76 일치"}, {"id": 535, "chap": "배선·재료·방폭", "topic": "방폭", "q": "전기 방폭설비의 의미를 설명하시오.", "ans": "위험한 가스·증기·분진 등이 존재하여 폭발이 발생할 우려가 있는 곳에서, 전기설비가 점화원이 되어 폭발사고가 발생하는 것을 방지하도록 시설하는 전기설비", "h1": "전기가 불씨 되지 않게", "h2": "[유압안내본] 방폭 체크리스트를 펼쳐 유압안내본(특) → 기호 d·o·p·e·i·s 순서로 하나씩 짚는다.", "freq": "★ 1회", "src": "[15-3]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 536, "chap": "배선·재료·방폭", "topic": "방폭", "q": "방폭형 전동기란 무엇인지 설명하시오.", "ans": "지정된 폭발성 가스 중에서 사용하기에 적합하도록 구조 기타에 관하여 특별히 고려된 전동기", "h1": "지폭사특 → 지정 폭발성가스 · 사용 적합 · 특별 고려", "h2": "[유압안본] 방폭에서는 유 = 기름 속 → 압 = 보호가스 → 안전증 = 안전도↑ → 본질 = 점화시험 확인 순서로 장면을 이어 간다.", "freq": "★★★ 6회", "src": "[24-3] [22-3] [20-4] [14-2] [14-1] [07-2]", "verify": "전기요약집 p.99 일치"}, {"id": 537, "chap": "배선·재료·방폭", "topic": "방폭", "q": "전기설비의 방폭구조 종류를 쓰시오.", "ans": "① 내압 방폭구조 (d)\n② 유입 방폭구조 (o)\n③ 압력 방폭구조 (p)\n④ 안전증 방폭구조 (e)\n⑤ 본질안전 방폭구조 (i)\n⑥ 특수 방폭구조 (s)", "h1": "유압안내본(특) / 기호 d·o·p·e·i·s", "h2": "[폭연성] 방폭 체크리스트를 펼쳐 폭연성 = 금속관 → 케이블, 5턱 순서로 하나씩 짚는다.", "freq": "★★★ 6회", "src": "[24-3] [22-3] [20-4] [14-2] [14-1] [07-2]", "verify": "공사요약집 p.238 일치"}, {"id": 538, "chap": "배선·재료·방폭", "topic": "방폭", "q": "다음 방폭구조를 설명하시오. ① 유입 ② 압력 ③ 안전증 ④ 본질안전", "ans": "① 유입 : 불꽃·아크·고온 발생부를 기름 속에 넣어 유면 위 폭발성 가스에 인화되지 않도록 한 구조\n② 압력 : 용기 내부에 보호가스를 봉입·압력 유지하여 폭발성 가스가 유입되지 않도록 한 구조\n③ 안전증 : 정상 운전 중 불꽃·아크·고온 발생을 방지하도록 기계적·전기적·온도상승에 대해 안전도를 증가시킨 구조\n④ 본질안전 : 정상·사고 시 발생하는 불꽃·아크·고온에 의해 폭발성 가스가 점화되지 않음이 시험으로 확인된 구조", "h1": "유 = 기름 속 · 압 = 보호가스 · 안전증 = 안전도↑ · 본질 = 점화시험 확인", "h2": "배선 방법: “케이블 = 전천후”가 떠오르면 정답 문장을 복원한다 — 모든 장소에 시설 가능 (케이블공사는 저압에서 장소 제한이 가장 적다)", "freq": "-", "src": "-", "verify": "공사요약집 p.237 일치"}, {"id": 539, "chap": "배선·재료·방폭", "topic": "방폭", "q": "폭연성 분진 또는 화약류 분말이 있는 곳의 저압 옥내 전기설비는 어떤 공사로 하며, 금속관은 몇 턱 이상 나사 조임으로 접속하는가?", "ans": "공사 : 금속관 공사 또는 케이블 공사\n금속관 : 박강 전선관 이상, 관 상호 및 관과 박스는 5턱(5산) 이상 죔나사 접속", "h1": "폭연성 = 금속관·케이블, 5턱", "h2": "[합금] 관등회로에서는 합금 → 25 ㎜ 순서로 장면을 이어 간다.", "freq": "-", "src": "-", "verify": "공사요약집 p.64 수록 문항 (공사기사 공통)"}, {"id": 540, "chap": "배선·재료·방폭", "topic": "배선 방법", "q": "저압 옥내배선을 케이블공사로 시설할 때 시설 가능한 장소를 쓰시오. (옥내 건조·습기, 옥측 우선내·우선외, 옥외, 물기 있는 장소)", "ans": "모든 장소에 시설 가능 (케이블공사는 저압에서 장소 제한이 가장 적다)", "h1": "케이블 = 전천후", "h2": "관등회로 숫자는 6,000 → 20 → 9,000 → 30 → 40 순서로 묶고, “20 · 30 · 40 ㎜”라는 리듬으로 외운다.", "freq": "-", "src": "-", "verify": "350제 289번 수록 문항"}, {"id": 541, "chap": "배선·재료·방폭", "topic": "관등회로", "q": "관등회로 사용전압 400[V] 초과 1[kV] 이하일 때 공사방법과, 애자공사 시 전선과 조영재 사이 이격거리를 쓰시오. (전개된 건조한 장소)", "ans": "공사방법 : 합성수지관공사, 금속관공사 (그 외 가요전선관·케이블·합성수지몰드·금속몰드공사)\n애자공사 이격거리 : 25[㎜]", "h1": "합금 · 25 ㎜", "h2": "[강도] 전선점검표에서 강도 → 나전선X → 접촉전선X 순서로 확인한다.", "freq": "-", "src": "-", "verify": "전기요약집 p.243 수록 문항"}, {"id": 542, "chap": "배선·재료·방폭", "topic": "관등회로", "q": "관등회로에서 전선과 조영재 사이의 이격거리(전개된 곳)를 사용전압별로 쓰시오.", "ans": "6,000[V] 이하 : 20[㎜]\n6,000[V] 초과 9,000[V] 이하 : 30[㎜]\n9,000[V] 초과 : 40[㎜]", "h1": "20 · 30 · 40 ㎜", "h2": "", "freq": "-", "src": "-", "verify": "전기요약집 p.227 수록 문항"}, {"id": 543, "chap": "배선·재료·방폭", "topic": "전선", "q": "전기설비기술기준의 배선 전선 조항 빈칸을 채우시오.\n배선 전선은 사용상 ( ① ) 및 절연성능을 가질 것 / 배선에는 ( ② )을 사용하지 말 것 / 특고압 배선에는 ( ③ )을 사용하지 말 것", "ans": "① 충분한 강도\n② 나전선\n③ 접촉전선", "h1": "강도 · 나전선X · 접촉전선X", "h2": "중성선은 전원의 중성점에 붙은 선이고, 분기회로는 간선에서 갈라져 분기차단기를 지나 부하까지 가는 배선이다.", "freq": "-", "src": "-", "verify": "전기요약집 p.242 수록 문항"}, {"id": 544, "chap": "KEC·설비기준·용어", "topic": "용어", "q": "KEC에서 규정하는 중성선과 분기회로의 용어 정의를 쓰시오.", "ans": "중성선 : 다선식 전로에서 전원의 중성극(중성점)에 접속된 전선\n분기회로 : 간선에서 분기하여 분기 과전류차단기를 거쳐서 부하에 이르는 사이의 배선", "h1": "중성선 = 다선식 중성극 / 분기 = 간선→분기차단기→부하", "h2": "[수구] 용어에서는 수구 = 소리콘 (소켓 → 리셉터클 → 콘센트) 순서로 장면을 이어 간다.", "freq": "★ 1회", "src": "[18-3]", "verify": "공사요약집 p.215 일치 · 과전류·중성선 정의 350제 280번 일치"}, {"id": 545, "chap": "KEC·설비기준·용어", "topic": "용어", "q": "간선, 단락전류, 사용전압의 용어 정의를 쓰시오.", "ans": "간선 : 인입구에서 분기 과전류차단기에 이르는 배선으로 분기회로 분기점에서 전원측 부분\n단락전류 : 정상 운전 상태에서 전위차가 있는 충전 도체 사이의 임피던스가 0인 고장에 기인한 전류\n사용전압 : 보통의 사용 상태에서 그 회로에 가하여지는 선간전압", "h1": "간선 = 인입구~분기차단기", "h2": "[변성] 용어에서는 변성 → 개폐 → 지시 순서로 장면을 이어 간다.", "freq": "-", "src": "-", "verify": "전기요약집 p.71 일치"}, {"id": 546, "chap": "KEC·설비기준·용어", "topic": "용어", "q": "뱅크, 수구, 한류 퓨즈, 접촉전압의 용어를 간단히 설명하시오.", "ans": "뱅크 : 전로에 접속된 변압기 또는 콘덴서의 결선상 단위\n수구 : 소켓·리셉터클·콘센트 등의 총칭\n한류 퓨즈 : 단락전류를 신속히 차단하며 흐르는 단락전류 값을 제한하는 성질을 가진 퓨즈\n접촉전압 : 지락이 발생된 기기 외함 등에 사람·가축이 닿을 때 생체에 가해지는 전압", "h1": "수구 = 소리콘 (소켓·리셉터클·콘센트)", "h2": "[과전류] 용어 체크리스트를 펼쳐 과부하전류 : 기기 정격전류·전선 허용전류를 초과하여 손상 방지를 위해 자동 차단이 필요한 전류 (전기적 고장 없이 회로에 발생한 과전류) → 단락전류 : 전로의 선간이 임피던스가 적은 상태로 접촉되었을 때 그 부분을 통해 흐르는 큰 전류 순서로 하나씩 짚는다.", "freq": "★ 1회", "src": "[01-2]", "verify": "공사요약집 p.222 일치 · 뱅크 정의 전기요약집 p.70 일치"}, {"id": 547, "chap": "KEC·설비기준·용어", "topic": "용어", "q": "변전소, 개폐소, 급전소의 용어 정의를 쓰시오.", "ans": "변전소 : 구외로부터 전송받은 전기를 변압기 등 기계기구로 변성하여 다시 구외로 전송하는 곳\n개폐소 : 개폐기 및 기타 장치로 전로를 개폐하는 곳으로 발전소·변전소·수용장소 이외의 곳\n급전소 : 전력계통의 운용에 관한 지시 및 급전조작을 하는 곳", "h1": "변성 · 개폐 · 지시", "h2": "용어: “45° 안쪽 = 비 안 맞는 우선내”가 떠오르면 정답 문장을 복원한다 — 우선내 (雨線內)", "freq": "-", "src": "-", "verify": "전기요약집 p.213 일치"}, {"id": 548, "chap": "KEC·설비기준·용어", "topic": "용어", "q": "과전류의 종류 2가지와 각각의 용어 정의를 쓰시오.", "ans": "① 과부하전류 : 기기 정격전류·전선 허용전류를 초과하여 손상 방지를 위해 자동 차단이 필요한 전류 (전기적 고장 없이 회로에 발생한 과전류)\n② 단락전류 : 전로의 선간이 임피던스가 적은 상태로 접촉되었을 때 그 부분을 통해 흐르는 큰 전류", "h1": "과전류 = 과부하 + 단락", "h2": "[특비접] 용어에서는 특별저압 (ELV) → 비접지회로 : SELV → 접지회로 : PELV 순서로 장면을 이어 간다.", "freq": "★ 2회", "src": "[11-2] [08-3]", "verify": "공사요약집 p.215 일치"}, {"id": 549, "chap": "KEC·설비기준·용어", "topic": "용어", "q": "옥측 처마에서 연직선에 대해 45° 각도로 그은 선 안쪽의 옥측 부분으로, 통상 강우 시 비를 맞지 않는 부분의 용어는?", "ans": "우선내 (雨線內)", "h1": "45° 안쪽 = 비 안 맞는 우선내", "h2": "전압강하는 저압수전이면 조명 3%·기타 5%, 고압수전이면 조명 6%·기타 8%로 외운다.", "freq": "-", "src": "-", "verify": "전기요약집 p.71 · 350제 250번 일치"}, {"id": 550, "chap": "KEC·설비기준·용어", "topic": "용어", "q": "KEC에서 인체에 위험을 초래하지 않을 정도의 저압을 무엇이라 하며, 비접지회로와 접지회로에 해당하는 것을 각각 쓰시오.", "ans": "특별저압 (ELV)\n비접지회로 : SELV\n접지회로 : PELV", "h1": "S = Safety(비접지), P = Protective(접지)", "h2": "[기전돌기] 전압강하에서는 기동 시간 중의 전동기 → 돌입전류가 큰 기타 기기 순서로 장면을 이어 간다.", "freq": "-", "src": "-", "verify": "공사요약집 p.275 수록 문항 (공사기사 공통)"}, {"id": 551, "chap": "KEC·설비기준·용어", "topic": "전압강하", "q": "KEC 수용가 설비의 인입구~기기 간 전압강하 기준[%]을 쓰시오. (조명 / 기타)", "ans": "A (저압으로 수전) : 조명 3[%], 기타 5[%]\nB (고압 이상으로 수전) : 조명 6[%], 기타 8[%]\n(배선설비 100[m] 초과분은 미터당 0.005[%] 증가 가능, 증가분은 0.5[%] 이하)", "h1": "저압 3·5 / 고압 6·8", "h2": "불평형 숫자는 3 → 4 → 30 → 40 순서로 묶고, “3상 30% · 단3 40%”라는 리듬으로 외운다.", "freq": "★ 2회", "src": "[21-1] [19-1]", "verify": "350제 288번 일치"}, {"id": 552, "chap": "KEC·설비기준·용어", "topic": "전압강하", "q": "KEC 전압강하 표보다 더 큰 전압강하를 허용할 수 있는 경우 2가지를 쓰시오.", "ans": "① 기동 시간 중의 전동기\n② 돌입전류가 큰 기타 기기", "h1": "기전돌기", "h2": "불평형 계산은 설비 불평형률 = (각 선간에 접속되는 단상부하 총 설비용량의 최대와 최소의 차) / (총 부하설비용량 × 1/3) × 100 [%] 순서로 쓴다. 입으로는 “(최대 − 최소) ÷ (총용량/3)”라고 읽는다.", "freq": "★ 2회", "src": "[21-1] [19-1]", "verify": "전기요약집 p.219 · 350제 288번 일치"}, {"id": 553, "chap": "KEC·설비기준·용어", "topic": "불평형", "q": "저압·고압·특고압 수전의 3상 3선식 또는 3상 4선식에서 설비 불평형률은 몇 [%] 이하로 하는 것을 원칙으로 하는가? 또 저압 단상 3선식은?", "ans": "3상 3선식·3상 4선식 : 30 [%] 이하\n저압 단상 3선식 : 40 [%] 이하", "h1": "3상 30% · 단3 40%", "h2": "불평형 숫자는 100 → 2 순서로 묶고, “저전용 · 단상 100 · 차 100 · 역V 100”라는 리듬으로 외운다.", "freq": "★★★ 11회", "src": "[19-1] [15-2] [11-2] [10-3] [09-1] [05-3] [05-2] [05-1] [04-3] [04-2] [03-2]", "verify": "공사요약집 p.264 일치 전기요약집 p.210 · 350제 282번 일치"}, {"id": 554, "chap": "KEC·설비기준·용어", "topic": "불평형", "q": "3상 3선식·3상 4선식 설비 불평형률 계산식을 쓰시오.", "ans": "설비 불평형률 = (각 선간에 접속되는 단상부하 총 설비용량의 최대와 최소의 차) / (총 부하설비용량 × 1/3) × 100 [%]", "h1": "(최대 − 최소) ÷ (총용량/3)", "h2": "[1개] 불평형에서는 1개 역V → 2개 스코트 → 3개 평형 순서로 장면을 이어 간다.", "freq": "-", "src": "-", "verify": "공사요약집 p.264 수록 문항 (공사기사 공통)"}, {"id": 555, "chap": "KEC·설비기준·용어", "topic": "불평형", "q": "3상 설비 불평형률 30[%] 이하 원칙을 따르지 않아도 되는 경우 4가지를 쓰시오.", "ans": "① 저압 수전에서 전용 변압기 등으로 수전하는 경우\n② 고압·특고압 수전에서 100[kVA] 이하의 단상부하인 경우\n③ 고압·특고압 수전에서 단상부하 용량의 최대와 최소의 차가 100[kVA] 이하인 경우\n④ 특고압 수전에서 100[kVA] 이하의 단상 변압기 2대로 역V결선하는 경우", "h1": "저전용 · 단상 100 · 차 100 · 역V 100", "h2": "[30] 분전반점검표에서 30 m → 42개 → 자립형 → 1.8/1.4/1.0 → 격벽 순서로 확인한다.", "freq": "★★★ 8회", "src": "[11-2] [10-3] [09-1] [05-2] [05-1] [04-3] [04-2] [03-2]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 556, "chap": "KEC·설비기준·용어", "topic": "불평형", "q": "특고압·고압 수전에서 대용량 단상 전기로 등으로 불평형 부하 제한을 따르기 어려운 경우의 시설 방법 빈칸을 채우시오.\n단상부하 1개 → ( ① ) 접속 (300[kVA] 초과 금지) / 2개 → ( ② ) 접속 / 3개 이상 → 선로전류가 ( ③ )이 되도록 각 선간에 접속", "ans": "① 2차 역V\n② 스코트\n③ 평형", "h1": "1개 역V · 2개 스코트 · 3개 평형", "h2": "[접다전] 과전류차단기에서는 접지공사의 접지도체 → 다선식 전로의 중성선 → 전로 일부에 접지공사를 한 저압 가공전선로의 접지측 전선 순서로 장면을 이어 간다.", "freq": "★ 1회", "src": "[13-2]", "verify": "전기요약집 p.212 일치"}, {"id": 557, "chap": "KEC·설비기준·용어", "topic": "분전반", "q": "분전반 설치 기준 빈칸을 채우시오.\n분기회로 길이 ( ① )[m] 이하 / 과전류장치는 예비회로(10~20%) 포함 ( ② )개 이하, 초과 시 2개 분전반 또는 ( ③ )형 / 설치 높이 : 상단 기준 ( ④ )[m], 중간 기준 ( ⑤ )[m], 하단 기준 ( ⑥ )[m] / 2개 이상 전원 수용 시 동일 재질 ( ⑦ ) 설치", "ans": "① 30\n② 42\n③ 자립\n④ 1.8\n⑤ 1.4\n⑥ 1.0\n⑦ 격벽", "h1": "30 m · 42개 · 자립형 · 1.8/1.4/1.0 · 격벽", "h2": "과전류차단기: “분기점에서 3 m”가 떠오르면 정답 문장을 복원한다 — 3 [m]", "freq": "★ 1회", "src": "[19-2]", "verify": "전기요약집 p.220 일치"}, {"id": 558, "chap": "KEC·설비기준·용어", "topic": "과전류차단기", "q": "과전류 차단기를 시설해서는 안 되는 장소 3가지를 쓰시오.", "ans": "① 접지공사의 접지도체\n② 다선식 전로의 중성선\n③ 전로 일부에 접지공사를 한 저압 가공전선로의 접지측 전선", "h1": "접다전", "h2": "중성선은 문지기다. 끊을 때는 선도체보다 늦게 나가고, 붙일 때는 먼저 들어온다.", "freq": "★ 1회", "src": "[22-1]", "verify": "공사요약집 p.214 일치 350제 291번 일치"}, {"id": 559, "chap": "KEC·설비기준·용어", "topic": "과전류차단기", "q": "분기회로 과부하 보호장치(P)의 설치 위치 특례 빈칸을 채우시오.\n전원측 분기점(O) 사이에 다른 분기회로·콘센트 접속이 없고 단락·화재 위험이 최소화된 경우, 보호장치(P)는 분기점으로부터 ( )[m]까지 이동 설치할 수 있다.", "ans": "3 [m]", "h1": "분기점에서 3 m", "h2": "주택용 차단기는 정격전류의 1.13배에서는 버티고 1.45배에서는 정해진 시간 안에 동작한다.", "freq": "★ 1회", "src": "[23-3]", "verify": "엑셀 원문 기준 (교재·HWP 미수록)"}, {"id": 560, "chap": "KEC·설비기준·용어", "topic": "과전류차단기", "q": "중성선을 차단 및 재폐로하는 회로의 개폐기·차단기 조건 빈칸을 채우시오.\n차단 시 중성선이 선도체보다 ( ① ) 차단되고, 재폐로 시 선도체와 동시 또는 그 ( ② )에 재폐로되는 것", "ans": "① 늦게\n② 이전", "h1": "중성선은 늦게 끊고 먼저 붙인다", "h2": "[현장조작] 개폐기에서는 현장조작 각극 → 전용분기 순서로 장면을 이어 간다.", "freq": "★ 1회", "src": "[23-3]", "verify": "전기요약집 p.234 일치"}, {"id": 561, "chap": "KEC·설비기준·용어", "topic": "과전류차단기", "q": "주택용 배선차단기(정격전류 63[A] 이하)의 60분 기준 불용단(부동작)전류와 용단(동작)전류는 정격전류의 몇 배인가?", "ans": "불용단(부동작) 전류 : 1.13배\n용단(동작) 전류 : 1.45배", "h1": "주택용 1.13 / 1.45", "h2": "개폐기: “3 kW↑ 전용회로”가 떠오르면 정답 문장을 복원한다 — 3 [kW] 이상", "freq": "-", "src": "-", "verify": "공사요약집 p.248 수록 문항 (공사기사 공통) 350제 298번 일치"}, {"id": 562, "chap": "KEC·설비기준·용어", "topic": "개폐기", "q": "전동기·가열장치·전력장치 배선에 각개 개폐기 또는 콘센트를 시설하지 않아도 되는 경우 2가지를 쓰시오.", "ans": "① 배선 중에 시설하는 현장조작 개폐기가 전로의 각 극을 개폐할 수 있는 경우\n② 전용 분기회로에서 공급되는 경우", "h1": "현장조작 각극 · 전용분기", "h2": "인입구: “6개 이하 생략”가 떠오르면 정답 문장을 복원한다 — 6개 이하", "freq": "★ 1회", "src": "[12-1]", "verify": "전기요약집 p.77 · 350제 258번 일치"}, {"id": 563, "chap": "KEC·설비기준·용어", "topic": "개폐기", "q": "정격 소비전력이 몇 [kW] 이상인 전기기계기구에 전용 개폐기 및 과전류 차단기를 시설하는가?", "ans": "3 [kW] 이상", "h1": "3 kW↑ 전용회로", "h2": "[3종] 가공전선에서는 3종 → 2 m → 0.12 m 순서로 장면을 이어 간다.", "freq": "-", "src": "-", "verify": "공사요약집 p.217 수록 문항 (공사기사 공통)"}, {"id": 564, "chap": "KEC·설비기준·용어", "topic": "인입구", "q": "저압 인입구 장치 시설 장소에서 개폐기 합계가 몇 개 이하이고 집합 시설하는 경우 전용 인입 개폐기를 생략할 수 있는가?", "ans": "6개 이하", "h1": "6개 이하 생략", "h2": "가공전선에서는 0.8(0.4) → 0.3 → 0.6 순서로 장면을 이어 간다.", "freq": "-", "src": "-", "verify": "전기요약집 p.83 일치"}, {"id": 565, "chap": "KEC·설비기준·용어", "topic": "가공전선", "q": "특고압 가공전선과 저·고압 가공전선의 접근·교차 빈칸을 채우시오.\n1차 접근상태 시 ( ① ) 특고압 보안공사 / 이격거리 ( ② )[m], 사용전압 60[kV] 초과 시 10[kV] 또는 그 단수마다 ( ③ )[m]를 더한 값", "ans": "① 제3종\n② 2\n③ 0.12", "h1": "3종 · 2 m · 0.12 m", "h2": "가공전선 숫자는 6 → 6.5 → 3.5 → 5 순서로 묶고, “6 · 6.5 · 3.5 · 5”라는 리듬으로 외운다.", "freq": "★ 1회", "src": "[25-1]", "verify": "전기요약집 p.214 일치"}, {"id": 566, "chap": "KEC·설비기준·용어", "topic": "가공전선", "q": "고압 가공전선과 가공 약전류전선 등의 접근 시 이격거리 빈칸을 채우시오.\n전선 간 ( ① )[m] 이상(케이블 ( ② )[m]) / 약전류전선로 지지물과는 저압 ( ③ )[m], 고압 ( ④ )[m] 이상(케이블 0.3[m])", "ans": "① 0.8\n② 0.4\n③ 0.3\n④ 0.6", "h1": "0.8(0.4) · 0.3 · 0.6", "h2": "가공전선 숫자는 6 → 6.5 → 3.5 → 3 순서로 묶고, “6 · 6.5 · 3.5(절연 3)”라는 리듬으로 외운다.", "freq": "★ 1회", "src": "[25-1]", "verify": "전기요약집 p.241 일치"}, {"id": 567, "chap": "KEC·설비기준·용어", "topic": "가공전선", "q": "고압 가공인입선의 높이 기준을 쓰시오.", "ans": "도로 횡단 : 지표상 6[m] 이상\n철도 또는 궤도 횡단 : 레일면상 6.5[m] 이상\n횡단보도교 위 : 노면상 3.5[m] 이상\n그 외 : 지표상 5[m] 이상 (위험 표시 시 3.5[m])", "h1": "6 · 6.5 · 3.5 · 5", "h2": "[아크] 기구 시설에서는 아크 기구 고압 1 m → 특고 2 m 순서로 장면을 이어 간다.", "freq": "-", "src": "-", "verify": "HWP 기준 (엑셀·교재 미수록)"}, {"id": 568, "chap": "KEC·설비기준·용어", "topic": "가공전선", "q": "저압 가공전선의 높이 기준을 쓰시오.", "ans": "도로 횡단 : 지표상 6[m] 이상\n철도·궤도 횡단 : 레일면상 6.5[m] 이상\n횡단보도교 위 : 노면상 3.5[m] 이상 (절연전선·다심형·케이블은 3[m])", "h1": "6 · 6.5 · 3.5(절연 3)", "h2": "발전기 보호 숫자는 500 → 100 → 2,000 → 10,000 순서로 묶고, “과전류·과전압 / 500 수차 · 100 풍차 · 2000 베어링 · 1만 내부고장 · 1만kW 터빈”라는 리듬으로 외운다.", "freq": "-", "src": "-", "verify": "공사요약집 p.276 수록 문항 (공사기사 공통)"}, {"id": 569, "chap": "KEC·설비기준·용어", "topic": "기구 시설", "q": "고압용 개폐기·차단기·피뢰기 등 동작 시 아크가 생기는 기구는 목재 벽·천장 등 가연성 물체로부터 몇 [m] 이상 이격해야 하는가?", "ans": "고압용 : 1 [m] 이상 (특고압용 : 2 [m] 이상)", "h1": "아크 기구 고압 1 m · 특고 2 m", "h2": "[170] 변전소에서는 170 kV → 순회 → 상시감시 순서로 장면을 이어 간다.", "freq": "★ 1회", "src": "[24-3]", "verify": "엑셀 원문 기준 (교재·HWP 미수록)"}, {"id": 570, "chap": "KEC·설비기준·용어", "topic": "발전기 보호", "q": "KEC에 따라 발전기를 자동적으로 전로로부터 차단하는 장치를 시설해야 하는 경우를 쓰시오.", "ans": "① 발전기에 과전류나 과전압이 생긴 경우\n② 500[kVA] 이상 수차발전기의 압유장치 유압, 전동식 가이드밴·니들·디플렉터 제어장치 전원전압이 현저히 저하한 경우\n③ 100[kVA] 이상 풍차발전기의 압유장치 유압, 압축공기장치 공기압, 전동식 브레이드 제어장치 전원전압이 현저히 저하한 경우\n④ 2,000[kVA] 이상 수차발전기의 스러스트 베어링 온도가 현저히 상승한 경우\n⑤ 10,000[kVA] 이상 발전기의 내부고장\n⑥ 정격출력 10,000[kW] 초과 증기터빈의 스러스트 베어링 마모 또는 온도 상승", "h1": "공사요약집 p.273 대조·보완: 상주감시 불요 발전소는 2", "h2": "000[kVA] 초과 시 내부고장 차단 필요", "freq": "전기요약집 p.238 일치", "src": "★ 1회", "verify": "[24-3]"}, {"id": 571, "chap": "KEC·설비기준·용어", "topic": "변전소", "q": "KEC 351.9 상주감시를 하지 않는 변전소 시설 빈칸을 채우시오.\n사용전압 ( ① )[kV] 이하의 변압기를 시설하는 변전소로서 기술원이 수시로 ( ② )하거나 제어소에서 ( ③ )하는 경우에 한한다.", "ans": "① 170\n② 순회\n③ 상시 감시", "h1": "170 kV · 순회 · 상시감시", "h2": "[호텔] 센서등에서는 호텔 1분 → 집 3분 순서로 장면을 이어 간다.", "freq": "★ 1회", "src": "[24-1]", "verify": "전기요약집 p.236 일치"}, {"id": 572, "chap": "KEC·설비기준·용어", "topic": "수중조명", "q": "수중조명등에 전기를 공급하는 절연변압기 기준을 쓰시오.", "ans": "① 1차측 사용전압 400[V] 이하, 2차측 사용전압 150[V] 이하\n② 2차측 30[V] 이하 : 1·2차 권선 사이에 금속제 혼촉방지판 설치 후 접지\n③ 2차측 30[V] 초과 : 정격감도전류 30[mA] 이하 누전차단기 시설", "h1": "공사요약집 p.189 대조·보완: 400/150 V 일치", "h2": "30 V 기준은 HWP", "freq": "400/150 · 30 V 이하 혼촉방지판 · 30 V 초과 30 mA", "src": "-", "verify": "-"}, {"id": 573, "chap": "KEC·설비기준·용어", "topic": "센서등", "q": "KEC에 따른 센서등(타임스위치 포함)의 소등시간을 쓰시오. (관광숙박업 객실 입구등 / 주택·아파트 현관등)", "ans": "관광숙박업·숙박업 객실 입구등 : 1분 이내\n일반주택·아파트 현관등 : 3분 이내", "h1": "호텔 1분 · 집 3분", "h2": "[갈흑회] 전선 색상에서는 L1 : 갈색 → L2 : 흑색 → L3 : 회색 → N : 청색 → 보호도체 : 녹색-노란색 순서로 장면을 이어 간다.", "freq": "-", "src": "-", "verify": "공사요약집 p.189 수록 문항 (공사기사 공통)"}, {"id": 574, "chap": "KEC·설비기준·용어", "topic": "변전소", "q": "154[kV] 옥외 변전소에 높이 2[m] 울타리를 시설할 때 울타리로부터 충전부까지의 거리는 몇 [m] 이상인가?", "ans": "4 [m] 이상 (35~160[kV] : 울타리 높이 + 거리 합계 6[m] 이상 → 6 − 2 = 4)", "h1": "160 kV 이하 합계 6 m", "h2": "전기품질 숫자는 110 → 6 → 220 → 22 → 10 → 2025.6 → 13 → 380 → 38 → 60 → 0.2 순서로 묶고, “6 · 22 · 38 · 0.2 (220 V는 ±10%)”라는 리듬으로 외운다.", "freq": "-", "src": "-", "verify": "HWP 기준 (엑셀·교재 미수록)"}, {"id": 575, "chap": "KEC·설비기준·용어", "topic": "전선 색상", "q": "KEC 전선 식별 색상을 쓰시오. (L1 · L2 · L3 · N · 보호도체)", "ans": "L1 : 갈색\nL2 : 흑색\nL3 : 회색\nN : 청색\n보호도체 : 녹색-노란색", "h1": "갈흑회 청 녹노", "h2": "[사업용] 전기설비 체크리스트를 펼쳐 사업용 → 일반용 → 자가용 순서로 하나씩 짚는다.", "freq": "★ 2회", "src": "[22-2] [08-2]", "verify": "공사요약집 p.229 일치 350제 293번 일치"}, {"id": 576, "chap": "KEC·설비기준·용어", "topic": "전기품질", "q": "전기사업법에 따른 표준전압·표준주파수의 허용오차를 쓰시오. (110V · 220V · 380V · 60Hz)", "ans": "110[V] : 상하 6[V] 이내\n220[V] : 상하 22[V] 이내 (±10[%]) ※ 2025.6.13 개정 전 13[V]\n380[V] : 상하 38[V] 이내\n60[Hz] : 상하 0.2[Hz] 이내", "h1": "대조·보완: 전기요약집 p.232·350제 272번 22[V] / 법령 확인: 전기사업법 시행규칙 별표3(2025.6.13 개정) → HWP의 13[V]는 개정 전 값", "h2": "6 · 22 · 38 · 0.2 (220 V는 ±10%)", "freq": "-", "src": "-", "verify": "대조·보완: 전기요약집 p.232·350제 272번 22[V] / 법령 확인: 전기사업법 시행규칙 별표3(2025.6.13 개정) → HWP의 13[V]는 개정 전 값"}, {"id": 577, "chap": "KEC·설비기준·용어", "topic": "전기설비", "q": "전기사업법에서 정의하는 전기설비의 종류 3가지를 쓰시오.", "ans": "① 전기사업용 전기설비\n② 일반용 전기설비\n③ 자가용 전기설비", "h1": "사업용 · 일반용 · 자가용", "h2": "[전선] 용어에서는 전선 : 강전류 전기의 전송에 사용하는 전기 도체(절연물 피복 및 보호 피복 포함) → 전로 : 통상의 사용 상태에서 전기가 통하고 있는 곳 → 전선로 : 발전소·변전소·개폐소·전기사용장소 상호 간의 전선 및 이를 지지하거나 수용하는 시설물 순서로 장면을 이어 간다.", "freq": "-", "src": "-", "verify": "공사요약집 p.151 수록 문항 (공사기사 공통) 350제 133번 일치"}, {"id": 578, "chap": "KEC·설비기준·용어", "topic": "소세력", "q": "전자개폐기 조작회로·초인벨 등 소세력 회로의 최대 사용전압과, 소세력 회로에 전기를 공급하는 변압기 조건을 쓰시오.", "ans": "최대 사용전압 : 60 [V] 이하\n공급 변압기 : 절연변압기 (1차측 대지전압 300[V] 이하)", "h1": "소세력 60 V · 절연변압기", "h2": "변전소 울타리 거리는 35 kV 이하 5 m, 160 kV 이하 6 m, 그 초과는 6 m에 10 kV마다 0.12 m를 더한다.", "freq": "-", "src": "-", "verify": "공사요약집 p.240 일치"}, {"id": 579, "chap": "KEC·설비기준·용어", "topic": "용어", "q": "KEC 용어 중 전선, 전로, 전선로의 정의를 쓰시오.", "ans": "전선 : 강전류 전기의 전송에 사용하는 전기 도체(절연물 피복 및 보호 피복 포함)\n전로 : 통상의 사용 상태에서 전기가 통하고 있는 곳\n전선로 : 발전소·변전소·개폐소·전기사용장소 상호 간의 전선 및 이를 지지하거나 수용하는 시설물", "h1": "전선 = 도체 / 전로 = 전기 통하는 곳 / 전선로 = 전선 + 지지물", "h2": "[15] 콘센트점검표에서 15 mA → 0.03초 → 3 kVA 순서로 확인한다.", "freq": "-", "src": "-", "verify": "전기요약집 p.123 수록 문항"}, {"id": 580, "chap": "KEC·설비기준·용어", "topic": "변전소", "q": "발·변전소 울타리의 높이와 울타리~충전부 거리의 합계를 사용전압별로 쓰시오.", "ans": "35[kV] 이하 : 5[m]\n35[kV] 초과 160[kV] 이하 : 6[m]\n160[kV] 초과 : 6[m] + (160[kV] 초과 10[kV] 단수 × 0.12[m])", "h1": "5 · 6 · 6+0.12×단수", "h2": "전압강하 숫자는 120 → 4 → 5 → 200 → 6 → 7 순서로 묶고, “120-4·5 / 200-5·6 / 초과-6·7”라는 리듬으로 외운다.", "freq": "-", "src": "-", "verify": "350제 267번 수록 문항"}, {"id": 581, "chap": "KEC·설비기준·용어", "topic": "콘센트", "q": "욕실 등 인체가 물에 젖은 상태에서 전기를 사용하는 장소의 콘센트 시설 조건 빈칸을 채우시오.\n인체감전보호용 누전차단기(정격감도전류 ( ① )[mA] 이하, 동작시간 ( ② )초 이하) 또는 절연변압기(정격용량 ( ③ )[kVA] 이하)로 보호된 전로에 접속", "ans": "① 15\n② 0.03\n③ 3", "h1": "15 mA · 0.03초 · 3 kVA", "h2": "케이블 숫자는 2023.07 → 11 → 2023.11 → 21 순서로 묶고, “특고압 = 파연알”라는 리듬으로 외운다.", "freq": "-", "src": "-", "verify": "전기요약집 p.87 수록 문항"}, {"id": 582, "chap": "KEC·설비기준·용어", "topic": "전압강하", "q": "공급변압기 2차측 단자(인입선 접속점)에서 최원단 부하까지 전선 길이가 60[m]를 넘는 경우의 전압강하 허용값을 쓰시오. (전기사업자 공급 / 전용변압기 공급)", "ans": "120[m] 이하 : 4[%] / 5[%]\n200[m] 이하 : 5[%] / 6[%]\n200[m] 초과 : 6[%] / 7[%]", "h1": "350제 281번 수록 문항 · 근거 확인 필요: 내선규정 표 기준으로 보임", "h2": "120-4·5 / 200-5·6 / 초과-6·7", "freq": "-", "src": "-", "verify": "350제 281번 수록 문항 · 근거 확인 필요: 내선규정 표 기준으로 보임"}, {"id": 583, "chap": "KEC·설비기준·용어", "topic": "케이블", "q": "KEC 개정(2023)으로 특고압 케이블 규정은 어떻게 바뀌었으며, 특고압 케이블 종류 3가지를 쓰시오.", "ans": "개정 : 사용 가능 전선 종류 나열을 삭제하고 KS 적합 또는 동등 이상 성능을 만족하도록 규정 (2023.07.11 저압케이블, 2023.11.21 고압·특고압케이블)\n종류 : ① 파이프형 압력케이블 ② 연피케이블 ③ 알루미늄피케이블", "h1": "특고압 = 파연알", "h2": "가공전선 숫자는 5 → 3 → 6.5 순서로 묶고, “저압 인입 도로 5 m · 철도 6.5 m”라는 리듬으로 외운다.", "freq": "-", "src": "-", "verify": "전기요약집 p.223 수록 문항"}, {"id": 584, "chap": "KEC·설비기준·용어", "topic": "전기방식", "q": "전기방식설비의 전원장치 구성요소 4가지와 최대사용전압을 쓰시오.", "ans": "구성 : ① 절연변압기 ② 정류기 ③ 개폐기 ④ 과전류 차단기\n최대사용전압 : 직류 60[V] 이하", "h1": "절정개과 60", "h2": "", "freq": "-", "src": "-", "verify": "전기요약집 p.224 수록 문항"}, {"id": 585, "chap": "KEC·설비기준·용어", "topic": "가공전선", "q": "저압 가공인입선의 높이 기준을 쓰시오. (도로 횡단 / 철도·궤도 횡단)", "ans": "도로 횡단 : 노면상 5[m] 이상 (기술상 부득이하고 교통 지장 없으면 3[m])\n철도·궤도 횡단 : 레일면상 6.5[m] 이상", "h1": "저압 인입 도로 5 m · 철도 6.5 m", "h2": "[배치도] 감리원 신고에서는 배치도 완료도 30일, 시 → 도지사 순서로 장면을 이어 간다.", "freq": "-", "src": "-", "verify": "전기요약집 p.235 수록 문항"}, {"id": 586, "chap": "감리·안전관리", "topic": "감리원 신고", "q": "전력기술관리법에 따른 감리 신고 기한 빈칸을 채우시오.\n감리업자는 소속 감리원을 배치(변경 배치 포함)한 경우 그 배치현황을 ( ① )일 이내에 ( ② )에게 신고하고, 공사감리 용역이 끝나면 공사감리 완료보고서를 ( ③ )일 이내에 신고하여야 한다(발주자 확인).", "ans": "① 30\n② 시·도지사\n③ 30", "h1": "배치도 완료도 30일, 시·도지사", "h2": "[설계와] 감리원 권한 대책반이 설계와 다르면 재시공 → 중지 순서로 조치하는 장면을 그린다.", "freq": "★★ 3회", "src": "[25-3] [25-2] [16-3]", "verify": "전기요약집 p.266 일치"}, {"id": 587, "chap": "감리·안전관리", "topic": "감리원 신고", "q": "전력시설물 공사감리는 대통령령으로 정하는 바에 따라 누구에게 신청하여 감리원 자격을 인정받은 사람이 하여야 하는가?", "ans": "기후에너지환경부장관 (2025.10 정부조직 개편 전 : 산업통상자원부장관)", "h1": "전기요약집 p.265(2026년판) 기후에너지환경부장관 / 350제 270번·법령 검색은 산업통상자원부장관 → 근거 확인 필요: 시험 시행일 기준 법령 확인", "h2": "감리원 자격 = 에너지 주무 장관", "freq": "★ 1회", "src": "[25-2]", "verify": "전기요약집 p.265(2026년판) 기후에너지환경부장관 / 350제 270번·법령 검색은 산업통상자원부장관 → 근거 확인 필요: 시험 시행일 기준 법령 확인"}, {"id": 588, "chap": "감리·안전관리", "topic": "감리원 권한", "q": "감리원은 공사업자가 설계도서 등과 적합하지 아니하게 전력시설물 설치·보수 공사를 하는 경우 어떤 조치를 할 수 있는가?", "ans": "재시공 또는 공사중지 명령이나 그 밖에 필요한 조치", "h1": "설계와 다르면 재시공·중지", "h2": "[부분] 감리원 권한에서는 부분 → 전면 순서로 장면을 이어 간다.", "freq": "★ 2회", "src": "[25-3] [16-3]", "verify": "전기요약집 p.266 일치"}, {"id": 589, "chap": "감리·안전관리", "topic": "감리원 권한", "q": "감리원이 시공된 공사가 품질 확보 미흡 또는 중대한 위해를 발생시킬 우려가 있다고 판단될 때 지시하는 공사중지의 구분 2가지를 쓰시오.", "ans": "① 부분 중지\n② 전면 중지", "h1": "부분 · 전면", "h2": "설계도서가 충돌하면 공사시방서 → 설계도면 → 전문시방서 → 표준시방서 → 산출내역서 → 감리자 지시 순으로 적용한다. [공설전표산감]", "freq": "★ 1회", "src": "[16-3]", "verify": "전기요약집 p.246 일치"}, {"id": 590, "chap": "감리·안전관리", "topic": "설계도서", "q": "설계도서·감리자 지시 등이 서로 일치하지 않을 때의 적용 우선순위를 쓰시오. (설계도면·공사시방서·산출내역서·전문시방서·표준시방서·감리자 지시사항)", "ans": "① 공사시방서 → ② 설계도면 → ③ 전문시방서 → ④ 표준시방서 → ⑤ 산출내역서 → ⑥ 감리자의 지시사항\n(350제 확장 보기) … 산출내역서 → 승인된 상세시공도면 → 관계법령의 유권해석 → 감리자의 지시사항", "h1": "공설전표산감 (공사시방서가 1등)", "h2": "[현시다] 설계도서점검표에서 현장 → 시공가능 → 다른공정 → 상호일치 → 누락 → 수량 → 예상문제 순서로 확인한다.", "freq": "★ 1회", "src": "[22-1]", "verify": "350제 292번 일치"}, {"id": 591, "chap": "감리·안전관리", "topic": "설계도서", "q": "감리원이 공사 시작 전 설계도서를 검토할 때 검토 내용에 포함되어야 하는 사항을 쓰시오.", "ans": "① 현장 조건에 부합 여부\n② 시공의 실제 가능 여부\n③ 다른 사업 또는 다른 공정과의 상호 부합 여부\n④ 설계도면·설계설명서·기술계산서·산출내역서 등의 상호 일치 여부\n⑤ 설계도서의 누락·오류 등 불명확한 부분의 존재 여부\n⑥ 발주자 제공 물량내역서와 공사업자 제출 산출내역서의 수량 일치 여부\n⑦ 시공상의 예상 문제점 및 대책", "h1": "현시다 상누수예 → 현장 · 시공가능 · 다른공정 · 상호일치 · 누락 · 수량 · 예상문제", "h2": "[개도설계수] 설계변경에서는 개요서 → 도면 → 설명서 → 계산서 → 수량조서 순서로 장면을 이어 간다.", "freq": "★★ 3회", "src": "[24-3] [19-2] [17-1]", "verify": "전기요약집 p.248 · 350제 283번 일치"}, {"id": 592, "chap": "감리·안전관리", "topic": "설계변경", "q": "발주자가 설계변경을 지시할 때 서면으로 누구에게 지시하며, 첨부해야 하는 서류 5가지를 쓰시오.", "ans": "지시 대상 : 책임감리원\n첨부 서류 : ① 설계변경 개요서 ② 설계변경 도면 ③ 설계설명서 ④ 계산서 ⑤ 수량산출조서\n(발주자가 설계변경 도서를 작성할 수 없으면 설계변경 개요서만 첨부 가능)", "h1": "개도설계수 → 개요서 · 도면 · 설명서 · 계산서 · 수량조서", "h2": "[설계] 설계변경에서는 설계자 : 책임감리원 → 심사자 : 비상주감리원 → (대규모 통합감리는 실제 설계 담당 감리원과 책임감리원이 설계자로 날인) 순서로 장면을 이어 간다.", "freq": "★ 2회", "src": "[25-1] [17-2]", "verify": "엑셀 원문 기준 (교재·HWP 미수록)"}, {"id": 593, "chap": "감리·안전관리", "topic": "설계변경", "q": "설계변경으로 인한 계약금액 조정 시 변경 설계도서의 설계자와 심사자는 각각 누가 날인하는가?", "ans": "설계자 : 책임감리원\n심사자 : 비상주감리원\n(대규모 통합감리는 실제 설계 담당 감리원과 책임감리원이 설계자로 날인)", "h1": "설계 = 책임, 심사 = 비상주", "h2": "[착공] 착공에서는 착공 7일 → 시공예품 계사현 안작 순서로 장면을 이어 간다.", "freq": "★ 1회", "src": "[22-2]", "verify": "전기요약집 p.259 일치"}, {"id": 594, "chap": "감리·안전관리", "topic": "착공", "q": "감리원은 공사업자로부터 착공신고서를 제출받아 며칠 이내에 발주자에게 보고하며, 착공신고서에 포함되는 서류를 쓰시오.", "ans": "보고 기한 : 7일 이내\n포함 서류 : ① 시공관리책임자 지정통지서(현장조직표·안전관리자) ② 공사예정공정표 ③ 품질관리계획서 ④ 공사도급계약서 사본 및 산출내역서 ⑤ 공사 시작 전 사진 ⑥ 현장기술자 경력사항 확인서 및 자격증 사본 ⑦ 안전관리계획서 ⑧ 작업인원 및 장비투입 계획서 ⑨ 그 밖에 발주자가 지정한 사항", "h1": "착공 7일 · 시공예품 계사현 안작", "h2": "현장 서식은 하도급 → 주요 인력·장비 → 작업계획 → 기자재 공급원 승인 → 주간 공정실적 순으로 챙긴다.", "freq": "★ 1회", "src": "[20-2]", "verify": "전기요약집 p.253 일치"}, {"id": 595, "chap": "감리·안전관리", "topic": "현장 서식", "q": "공사감리업무 수행지침에서 정하는 전기공사업자가 공사현장에 비치하고 기록·보관해야 하는 서식 5가지를 쓰시오.", "ans": "① 하도급 현황\n② 주요 인력 및 장비 투입 현황\n③ 작업계획서\n④ 기자재 공급원 승인 현황\n⑤ 주간 공정계획 및 실적보고서", "h1": "하주작기주", "h2": "[조체재산교] 안전관리에서는 안전관리 조직표 → 안전보건 관리체제 → 재해발생 현황 → 산재요양신청서 사본 → 안전교육 실적표 순서로 장면을 이어 간다.", "freq": "★ 2회", "src": "[24-1] [18-1]", "verify": "전기요약집 p.251 · 350제 277번 일치"}, {"id": 596, "chap": "감리·안전관리", "topic": "안전관리", "q": "감리원이 매 분기마다 공사업자로부터 제출받는 안전관리 결과보고서에 포함되어야 하는 서류 5가지를 쓰시오.", "ans": "① 안전관리 조직표\n② 안전보건 관리체제\n③ 재해발생 현황\n④ 산재요양신청서 사본\n⑤ 안전교육 실적표", "h1": "조체재산교", "h2": "[일항절장기] 시운전에서는 시운전 일정 → 시운전 항목 및 종류 → 시운전 절차 → 시험장비 확보 및 보정 → 기계·기구 사용계획 순서로 장면을 이어 간다.", "freq": "★ 1회", "src": "[16-2]", "verify": "전기요약집 p.245 일치"}, {"id": 597, "chap": "감리·안전관리", "topic": "시운전", "q": "감리원이 준공검사 전 사전 시운전을 위해 공사업자에게 시운전 계획을 수립하여 30일 이내 제출하도록 할 때 포함 서류 5가지를 쓰시오.", "ans": "① 시운전 일정\n② 시운전 항목 및 종류\n③ 시운전 절차\n④ 시험장비 확보 및 보정\n⑤ 기계·기구 사용계획\n(그 외) 운전요원 및 검사요원 선임계획", "h1": "일항절장기(운)", "h2": "[운점지] 시운전에서는 운전개시·가동절차 및 방법 → 점검항목점검표 → 운전지침 → 기기류 단독 시운전 방법 검토 및 계획서 → 실가동 다이어그램(Diagram) 순서로 장면을 이어 간다.", "freq": "★ 1회", "src": "[20-4]", "verify": "전기요약집 p.255 일치"}, {"id": 598, "chap": "감리·안전관리", "topic": "시운전", "q": "시운전 완료 후 감리원이 공사업자로부터 성과품을 제출받아 검토 후 발주자에게 인계해야 할 서류 5가지를 쓰시오.", "ans": "① 운전개시·가동절차 및 방법\n② 점검항목 점검표\n③ 운전지침\n④ 기기류 단독 시운전 방법 검토 및 계획서\n⑤ 실가동 다이어그램(Diagram)\n(그 외) 시험 구분·방법·사용매체 검토 및 계획서, 시험성적서, 성능시험성적서", "h1": "운점지 단실", "h2": "[일지] 설계감리에서는 일지 → 지시 → 기록 → 요청 → 협의 순서로 장면을 이어 간다.", "freq": "★ 1회", "src": "[16-1]", "verify": "전기요약집 p.244 일치"}, {"id": 599, "chap": "감리·안전관리", "topic": "설계감리", "q": "책임설계감리원이 설계감리 기성 및 준공 처리 시 제출하는 준공서류 중 감리 기록서류 5가지를 쓰시오.", "ans": "① 설계감리 일지\n② 설계감리 지시부\n③ 설계감리 기록부\n④ 설계감리 요청서\n⑤ 설계자와 협의사항 기록부", "h1": "일지 · 지시 · 기록 · 요청 · 협의", "h2": "설계감리 서류함에서 ‘공사’가 붙은 예정공정표·기성신청서는 시공 쪽으로 빼고, 설계수행계획서는 설계자 쪽으로 뺀다.", "freq": "★ 1회", "src": "[20-3]", "verify": "전기요약집 p.254 · 350제 287번 일치"}, {"id": 600, "chap": "감리·안전관리", "topic": "설계감리", "q": "설계감리원이 비치해야 하는 문서가 아닌 것 3가지를 쓰시오. (보기 : 근무상황부, 공사예정공정표, 설계감리 검토의견 및 조치결과서, 설계도서 검토의견서, 공사기성신청서, 설계자와 협의사항 기록부, 설계수행계획서, 설계감리 주요검토결과, 수발신 공문서)", "ans": "① 공사예정공정표\n② 공사기성신청서\n③ 설계수행계획서", "h1": "'공사'가 붙은 건 시공단계 서류 + 설계수행계획서는 설계자 서류", "h2": "공사시방서: “도면에 못 그리는 것을 글로 = 공사시방서”가 떠오르면 정답 문장을 복원한다 — 공사별 건설공사 수행 기준으로 계약문서의 일부가 되며, 설계도면에 표시하기 곤란하거나 불편한 내용과 공사 재료·공법·품질시험·검사 등 품질관리·안전관리 사항을 기술하고, 지역 여건·공사방법 등을 고려하여 공사별로 정하여 시행하는 시공기준", "freq": "★ 1회", "src": "[21-3]", "verify": "전기요약집 p.257 · 350제 290번 일치"}, {"id": 601, "chap": "감리·안전관리", "topic": "공사시방서", "q": "공사시방서란 무엇인지 쓰시오.", "ans": "공사별 건설공사 수행 기준으로 계약문서의 일부가 되며, 설계도면에 표시하기 곤란하거나 불편한 내용과 공사 재료·공법·품질시험·검사 등 품질관리·안전관리 사항을 기술하고, 지역 여건·공사방법 등을 고려하여 공사별로 정하여 시행하는 시공기준", "h1": "도면에 못 그리는 것을 글로 = 공사시방서", "h2": "[일상] 안전관리자에서는 일상 = 평상시 외관 → 작동 → 기능 순서로 장면을 이어 간다.", "freq": "★ 1회", "src": "[10-3]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 602, "chap": "감리·안전관리", "topic": "안전관리자", "q": "전기안전관리자 직무 고시에 따른 일상점검의 정의를 쓰시오.", "ans": "전기설비의 외관·작동·기능 점검 등을 실시하여 이상 유무를 확인하기 위하여 평상시 점검하는 것", "h1": "일상 = 평상시 외관·작동·기능", "h2": "안전관리자 숫자는 1 → 300 → 20 → 2 → 10 → 500 → 700 → 3 → 7 → 1,500 → 4 → 5 순서로 묶고, “횟수 1-2-3-4-5-6회 / 간격 20-10-7-5-4-3일”라는 리듬으로 외운다.", "freq": "★ 1회", "src": "[25-2]", "verify": "엑셀 원문 기준 (교재·HWP 미수록)"}, {"id": 603, "chap": "감리·안전관리", "topic": "안전관리자", "q": "안전관리 업무를 대행하는 전기안전관리자의 용량별 점검 횟수 및 간격 빈칸을 채우시오. (엑셀 기출 원문 기준)", "ans": "저압 : 1~300[kW] 이하 월 1회(20일 이상) / 300[kW] 초과 월 2회(10일 이상)\n고압 이상 : 1~300[kW] 이하 월 1회(20일 이상)\n300 초과~500[kW] 이하 월 2회(10일 이상)\n500 초과~700[kW] 이하 월 3회(7일 이상)\n700 초과~1,500[kW] 이하 월 4회(5일 이상)\n1,500 초과~2,000[kW] 이하 월 5회(4일 이상)\n2,000[kW] 초과 월 6회(3일 이상)", "h1": "횟수 1-2-3-4-5-6회 / 간격 20-10-7-5-4-3일", "h2": "[기록] 안전관리자에서는 기록 4년 → 월 1회 입력 순서로 장면을 이어 간다.", "freq": "★ 1회", "src": "[25-2]", "verify": "전기요약집 p.260·350제 348번 일치 (엑셀 원문의 깨진 표 복원)"}, {"id": 604, "chap": "감리·안전관리", "topic": "안전관리자", "q": "전기안전관리자는 점검 결과를 기록한 서류를 몇 년간 보존해야 하며, 전기안전종합정보시스템에 어떻게 입력하면 정기검사 시 제출을 생략할 수 있는가?", "ans": "보존 기간 : 4년\n제출 생략 : 전기안전종합정보시스템에 매월 1회 이상 안전관리를 위한 확인·점검 결과를 입력한 경우", "h1": "기록 4년 · 월 1회 입력", "h2": "[누언무결의] 안전관리자점검표에서 누가 → 언제 → 무엇을 → 결과 → 의견 순서로 확인한다.", "freq": "★ 1회", "src": "[23-2]", "verify": "전기요약집 p.263 일치"}, {"id": 605, "chap": "감리·안전관리", "topic": "안전관리자", "q": "전기안전관리자가 점검 후 기록해야 하는 사항을 쓰시오.", "ans": "① 점검자\n② 점검 연월일, 설비명(상호), 설비용량\n③ 점검 실시 내용 (점검항목별 기준치·측정치)\n④ 점검의 결과\n⑤ 그 밖에 전기설비 안전관리에 관한 의견", "h1": "누가·언제·무엇을·결과·의견", "h2": "[재중시경] 감리원 권한에서는 재시공·하자 → 중대위험 → 시정 3회 → 경고 2회 순서로 장면을 이어 간다.", "freq": "★ 1회", "src": "[23-2]", "verify": "전기요약집 p.262 일치"}, {"id": 606, "chap": "감리·안전관리", "topic": "감리원 권한", "q": "감리원이 부분중지를 지시할 수 있는 경우 빈칸을 채우시오.\n( ① )이 이행되지 않는 상태에서 다음 공정 진행 시 ( ② )이 될 수 있을 때 / 시공 안전상 ( ③ )이 예상될 때 / 동일 공정에 ( ④ )이 이행되지 않을 때 / 동일 공정에 ( ⑤ )이 있었음에도 이행되지 않을 때", "ans": "① 재시공 지시\n② 하자 발생\n③ 중대한 위험\n④ 3회 이상 시정지시\n⑤ 2회 이상 경고", "h1": "재시공·하자 / 중대위험 / 시정 3회 / 경고 2회", "h2": "[가안계이유] 시공상세도에서는 설계·시공 가능 여부 → 안정성 확보 여부 → 계산의 정확성 → 현장 시공기술자가 명확하게 이해할 수 있는지 여부 → 도면으로 표시 곤란한 내용이 시공 시 유의사항으로 작성되었는지 여부 순서로 장면을 이어 간다.", "freq": "-", "src": "-", "verify": "전기요약집 p.246 수록 문항"}, {"id": 607, "chap": "감리·안전관리", "topic": "시공상세도", "q": "감리원이 시공상세도를 검토·확인할 때의 항목 5가지를 쓰시오.", "ans": "① 설계·시공 가능 여부\n② 안정성 확보 여부\n③ 계산의 정확성\n④ 현장 시공기술자가 명확하게 이해할 수 있는지 여부\n⑤ 도면으로 표시 곤란한 내용이 시공 시 유의사항으로 작성되었는지 여부", "h1": "가안계이유", "h2": "[발전기] 안전관리자에서는 발전기 1억 → 수용설비 5천만 순서로 장면을 이어 간다.", "freq": "-", "src": "-", "verify": "전기요약집 p.247 수록 문항"}, {"id": 608, "chap": "감리·안전관리", "topic": "안전관리자", "q": "전기안전관리자가 공사감리 업무를 수행할 수 있는 공사 2가지를 쓰시오.", "ans": "① 비상용 예비발전설비의 설치·변경공사로서 총공사비 1억원 미만인 공사\n② 전기수용설비의 증설·변경공사로서 총공사비 5천만원 미만인 공사", "h1": "발전기 1억 · 수용설비 5천만", "h2": "감리원 업무는 조사 → 설계변경 검토 → 금액 심사 → 기성·준공 확인 → 정기점검 순으로 이어진다.", "freq": "-", "src": "-", "verify": "전기요약집 p.249 수록 문항"}, {"id": 609, "chap": "감리·안전관리", "topic": "감리원", "q": "비상주 감리원의 업무를 5가지 쓰시오.", "ans": "① 상주감리원이 수행하지 못하는 현장 조사분석, 시공상 문제점 기술검토, 민원 현지조사·해결방안 검토\n② 중요한 설계변경에 대한 기술검토\n③ 설계변경 및 계약금액 조정의 심사\n④ 기성 및 준공검사\n⑤ 정기적(분기·월별) 현장 시공상태 종합 점검·확인·평가 및 기술지도", "h1": "조사 · 설계변경검토 · 금액심사 · 기성준공 · 정기점검", "h2": "[조교점비] 감리원에서는 안전관리 조직 → 안전교육 실적 → 안전점검 실적 → 안전관리비 사용실적 순서로 장면을 이어 간다.", "freq": "-", "src": "-", "verify": "전기요약집 p.250 수록 문항"}, {"id": 610, "chap": "감리·안전관리", "topic": "감리원", "q": "책임감리원이 감리기간 종료 후 제출하는 최종감리보고서 중 안전관리 실적 항목을 쓰시오.", "ans": "① 안전관리 조직\n② 안전교육 실적\n③ 안전점검 실적\n④ 안전관리비 사용실적", "h1": "조교점비", "h2": "[총괄] 감리원에서는 총괄 → 보좌 → 지원 순서로 장면을 이어 간다.", "freq": "-", "src": "-", "verify": "전기요약집 p.252 수록 문항"}, {"id": 611, "chap": "감리·안전관리", "topic": "감리원", "q": "책임감리원, 보조감리원, 비상주감리원의 정의를 쓰시오.", "ans": "책임감리원 : 감리업자를 대표하여 현장에 상주하며 해당 공사 전반의 책임감리 업무를 총괄하는 사람\n보조감리원 : 책임감리원을 보좌하며 담당 감리업무를 책임감리원과 연대하여 책임지는 사람\n비상주감리원 : 감리업체에 근무하면서 상주감리원의 업무를 기술적·행정적으로 지원하는 사람", "h1": "총괄 · 보좌 · 지원", "h2": "공정이 월간 계획보다 10% 늦거나 누계가 5% 늦으면 지연 관리 대상으로 잡는다. [월10·누5]", "freq": "-", "src": "-", "verify": "전기요약집 p.267 수록 문항"}, {"id": 612, "chap": "감리·안전관리", "topic": "공정", "q": "감리원이 공사업자에게 부진공정 만회대책을 지시해야 하는 기준(월간·누계 지연율)을 쓰시오.", "ans": "월간 공정실적 10[%] 이상 지연 또는 누계 공정실적 5[%] 이상 지연", "h1": "월 10 · 누계 5", "h2": "설계감리: “생애주기비용 = 경제성 검토”가 떠오르면 정답 문장을 복원한다 — 설계의 경제성 검토", "freq": "-", "src": "-", "verify": "전기요약집 p.258 수록 문항"}, {"id": 613, "chap": "감리·안전관리", "topic": "설계감리", "q": "설계감리업무 수행지침에서 전력시설물의 현장적용 적합성 및 생애주기비용 등을 검토하는 것을 무엇이라 하는가?", "ans": "설계의 경제성 검토", "h1": "생애주기비용 = 경제성 검토", "h2": "[기술사] 공사업에서는 기술사 → 설계사 → 보조자 순서로 장면을 이어 간다.", "freq": "-", "src": "-", "verify": "전기요약집 p.259 수록 문항"}, {"id": 614, "chap": "감리·안전관리", "topic": "공사업", "q": "종합설계업 등록을 위한 기술인력 3가지를 쓰시오.", "ans": "① 전기 분야 기술사\n② 설계사\n③ 설  {"id": 621, "chap": "측정·시험", "topic": "절연저항", "q": "KEC 저압전로의 사용전압별 DC 시험전압과 절연저항 기준값을 쓰시오.", "ans": "SELV 및 PELV : DC 250[V], 0.5[MΩ] 이상\nFELV, 500[V] 이하 : DC 500[V], 1.0[MΩ] 이상\n500[V] 초과 : DC 1,000[V], 1.0[MΩ] 이상", "h1": "250-0.5 / 500-1.0 / 1000-1.0", "h2": "[저압] 절연저항 체크리스트를 펼쳐 명칭 : 절연저항계 (메거, Megger) → 전압급 : 500 [V]급 순서로 하나씩 짚는다.", "freq": "★★ 4회", "src": "[21-3] [21-1] [16-3] [14-2]", "verify": "공사요약집 p.271 일치 전기요약집 p.228 일치"}, {"id": 622, "chap": "측정·시험", "topic": "절연저항", "q": "사용전압 저압 전로에서 정전이 어려워 절연저항 측정이 곤란한 경우 저항성분의 누설전류는 몇 [mA] 이하로 유지해야 하는가?", "ans": "1 [mA] 이하", "h1": "누설전류 1 mA", "h2": "[절최결] 절연내력에서는 결정된 시험전압 → 연속 10분 순서로 장면을 이어 간다.", "freq": "★ 2회", "src": "[21-1] [14-2]", "verify": "전기요약집 p.228 일치"}, {"id": 623, "chap": "측정·시험", "topic": "절연저항", "q": "저압 전로의 배선이나 기기의 절연 측정에 사용하는 절연저항계의 명칭과 사용 전압급은?", "ans": "명칭 : 절연저항계 (메거, Megger)\n전압급 : 500 [V]급", "h1": "저압 메거 500 V", "h2": "절연내력 숫자는 7 → 1.5 → 500 → 25 → 0.92 → 60 → 0.72 → 170 → 0.64 → 1.25 → 10,500 → 1.1 순서로 묶고, “1.5 · 0.92 · 1.25 · 1.1 · 0.72 · 0.64”라는 리듬으로 외운다.", "freq": "-", "src": "-", "verify": "공사요약집 p.243 일치"}, {"id": 624, "chap": "측정·시험", "topic": "절연내력", "q": "고압 및 특고압 전로의 절연내력 시험방법을 설명하시오.", "ans": "최대사용전압에 의해 결정되는 시험전압을 전로와 대지 사이(다심케이블은 심선 상호 간 및 심선과 대지 사이)에 연속하여 10분간 가하여 견디어야 한다.", "h1": "절최결 → 결정된 시험전압 · 연속 10분", "h2": "절연내력 숫자는 0.72 → 154,000 → 110,880 순서로 묶고, “직접접지 60 kV 초과 = 0.72배”라는 리듬으로 외운다.", "freq": "★★ 3회", "src": "[21-3] [16-3] [14-2]", "verify": "공사요약집 p.285 일치"}, {"id": 625, "chap": "측정·시험", "topic": "절연내력", "q": "KEC 전로의 절연내력 시험전압 배수를 쓰시오. (7[kV] 이하 / 7~25[kV] 중성점 다중접지 / 60[kV] 초과 중성점 직접접지 / 170[kV] 초과 직접접지·중성점 직접접지)", "ans": "7[kV] 이하 : 최대사용전압 × 1.5배 (최저 500[V])\n7[kV] 초과 25[kV] 이하 다중접지 : × 0.92배\n60[kV] 초과 중성점 직접접지 : × 0.72배\n170[kV] 초과 중성점 직접접지(중성점 직접접지 발·변전소) : × 0.64배\n(7~60[kV] 비접지 등 : × 1.25배(최저 10,500[V]), 60[kV] 초과 비접지 : × 1.25배, 60[kV] 초과 접지(피뢰기) : × 1.1배(최저 75[kV]))", "h1": "공사요약집 p.285 대조·보완: 1.5배·0.92배 일치", "h2": "1.5 · 0.92 · 1.25 · 1.1 · 0.72 · 0.64", "freq": "★ 2회", "src": "[16-3] [11-3]", "verify": "공사요약집 p.285 대조·보완: 1.5배·0.92배 일치"}, {"id": 626, "chap": "측정·시험", "topic": "절연내력", "q": "사용전압 154[kV] 중성점 직접접지식 전로의 절연내력 시험전압은?", "ans": "산출식 : 시험전압 = 최대사용전압 × 0.72\n적용 : 154,000 × 0.72\n결과 : 110,880 [V]", "h1": "직접접지 60 kV 초과 = 0.72배", "h2": "[PT] 절연내력을 설치하는 목표는 PT : 피시험기에 인가되는 절연내력 시험전압 측정 → 전류계 : 누설전류 측정이다.", "freq": "★ 2회", "src": "[16-3] [11-3]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 627, "chap": "측정·시험", "topic": "절연내력", "q": "최대사용전압 6,900[V] 변압기(피시험기)의 절연내력 시험전압과, 시험전압 인가시간을 쓰시오.", "ans": "산출식 : 시험전압 = 최대사용전압 × 1.5\n적용 : 6,900 × 1.5\n결과 : 10,350 [V], 연속 10분간", "h1": "7 kV 이하 1.5배 · 10분", "h2": "절연내력 시험은 최대사용전압의 1.5배를 전로와 대지 사이에 10분간 가한다. [배대분]", "freq": "★★ 4회", "src": "[23-3] [08-1] [03-3] [02-3]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 628, "chap": "측정·시험", "topic": "절연내력", "q": "절연내력 시험회로에서 PT와 전류계(mA)의 설치 목적을 쓰시오.", "ans": "PT : 피시험기에 인가되는 절연내력 시험전압 측정\n전류계 : 누설전류 측정", "h1": "PT = 시험전압, mA계 = 누설전류", "h2": "[작중액접절] 계측기에서는 작은 R = 켈빈 → 중간 R = 휘스톤 → 액체 → 접지 = 콜라우시 → 절연 = 메거 순서로 장면을 이어 간다.", "freq": "★★ 4회", "src": "[23-3] [08-1] [03-3] [02-3]", "verify": "엑셀 원문 기준 (교재·HWP 미수록)"}, {"id": 629, "chap": "측정·시험", "topic": "절연내력", "q": "6,600[V] 전로에 사용하는 다심케이블의 절연내력 시험 빈칸을 채우시오.\n최대사용전압의 ( ① )배 시험전압을 심선 상호 및 심선과 ( ② ) 사이에 연속하여 ( ③ )간 가한다.", "ans": "① 1.5\n② 대지\n③ 10분", "h1": "1.5배 · 대지 · 10분", "h2": "[활선] 계측기에서는 절연저항계(메거) → 휘스톤 브리지 → 후크온 미터 (클램프 미터) → 접지저항계 (콜라우시 브리지) → 와이어 게이지 순서로 장면을 이어 간다.", "freq": "-", "src": "-", "verify": "전기요약집 p.130 일치"}, {"id": 630, "chap": "측정·시험", "topic": "계측기", "q": "다음을 측정하는 데 적합한 방법(계측기)을 쓰시오.\n① 굵은 나전선의 저항 ② 수천 옴의 전선 저항 ③ 전해액의 저항 ④ 옥내 절연저항", "ans": "① 켈빈 더블 브리지\n② 휘스톤 브리지\n③ 콜라우시 브리지\n④ 메거(절연저항계)", "h1": "작은 R = 켈빈 · 중간 R = 휘스톤 · 액체·접지 = 콜라우시 · 절연 = 메거", "h2": "적산전력계: “무부하 110% → 1회전 이상 = 잠동”가 떠오르면 정답 문장을 복원한다 — 무부하 상태에서 정격주파수 및 정격전압의 110[%]를 인가하였을 때 계기의 원판이 1회전 이상 회전하는 현상", "freq": "★ 1회", "src": "[01-1]", "verify": "공사요약집 p.232 일치"}, {"id": 631, "chap": "측정·시험", "topic": "계측기", "q": "다음 항목을 측정하는 데 알맞은 계측기를 쓰시오.\n① 변압기 절연저항 ② 검류계 내부저항 ③ 배전선의 전류 ④ 접지극의 접지저항 ⑤ 단선인 전선의 굵기", "ans": "① 절연저항계(메거)\n② 휘스톤 브리지\n③ 후크온 미터 (클램프 미터)\n④ 접지저항계 (콜라우시 브리지)\n⑤ 와이어 게이지", "h1": "활선 전류 = 후크온, 굵기 = 와이어게이지", "h2": "[구멍] 적산전력계에서는 구멍 → 철편 순서로 장면을 이어 간다.", "freq": "-", "src": "-", "verify": "공사요약집 p.232 일치"}, {"id": 632, "chap": "측정·시험", "topic": "적산전력계", "q": "교류 적산전력계의 잠동 현상에 대하여 설명하시오.", "ans": "무부하 상태에서 정격주파수 및 정격전압의 110[%]를 인가하였을 때 계기의 원판이 1회전 이상 회전하는 현상", "h1": "무부하 110% → 1회전 이상 = 잠동", "h2": "[과부] 적산전력계에서는 과부하내량 → 부하특성 → 주파수온도보상 → 기계적강도 → 옥내외 순서로 장면을 이어 간다.", "freq": "★★ 3회 120제", "src": "[18-3] [05-3] [05-1]", "verify": "120제 일치"}, {"id": 633, "chap": "측정·시험", "topic": "적산전력계", "q": "적산전력계의 잠동을 막기 위한 방법 2가지를 쓰시오.", "ans": "① 원판에 작은 구멍을 뚫는다.\n② 원판에 작은 철편을 붙인다.", "h1": "구멍 · 철편", "h2": "[외보접절절] 검사 체크리스트를 펼쳐 외관 → 보호장치 → 접지저항 → 절연저항 → 절연내력 순서로 하나씩 짚는다.", "freq": "★★ 3회", "src": "[18-3] [05-3] [05-1]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 634, "chap": "측정·시험", "topic": "적산전력계", "q": "적산전력계가 구비해야 할 특성을 쓰시오.", "ans": "① 과부하 내량이 클 것\n② 부하 특성이 좋을 것\n③ 온도·주파수 변화에 보상이 될 것\n④ 기계적 강도가 클 것\n⑤ 옥내·옥외 설치가 적당할 것", "h1": "과부 주기옥 → 과부하내량 · 부하특성 · 주파수온도보상 · 기계적강도 · 옥내외", "h2": "절연내력 숫자는 7 → 1.5 → 500 → 1.25 → 10.5 → 1 → 10 순서로 묶고, “회전기 1.5 / 1.25 · 10분”라는 리듬으로 외운다.", "freq": "★★ 3회", "src": "[18-3] [05-3] [05-1]", "verify": "전기요약집 p.37 · 350제 36번 일치"}, {"id": 635, "chap": "측정·시험", "topic": "검사", "q": "자가용 전기설비의 중요 검사(시험) 항목을 쓰시오.", "ans": "① 외관 검사\n② 접지저항 측정\n③ 절연저항 측정\n④ 절연내력 시험\n⑤ 보호장치 설치 및 동작 시험\n(그 외) 절연유 시험", "h1": "외보접절절 → 외관 · 보호장치 · 접지저항 · 절연저항 · 절연내력", "h2": "절연내력 숫자는 60 → 1 → 500 → 10 → 1.1 순서로 묶고, “정류기 60 kV 기준 1배 / 1.1배”라는 리듬으로 외운다.", "freq": "★ 2회", "src": "[06-1] [02-3]", "verify": "공사요약집 p.147 일치 전기요약집 p.128 일치"}, {"id": 636, "chap": "측정·시험", "topic": "절연내력", "q": "KEC 회전기(발전기·전동기 등)의 절연내력 시험전압과 시험방법을 쓰시오.", "ans": "최대사용전압 7[kV] 이하 : 1.5배 (최저 500[V])\n최대사용전압 7[kV] 초과 : 1.25배 (최저 10.5[kV])\n회전변류기 : 직류측 최대사용전압의 1배 교류전압 (최저 500[V])\n시험방법 : 권선과 대지 사이에 연속하여 10분간 가한다.", "h1": "회전기 1.5 / 1.25 · 10분", "h2": "", "freq": "-", "src": "-", "verify": "전기요약집 p.150 수록 문항"}, {"id": 637, "chap": "측정·시험", "topic": "절연내력", "q": "KEC 정류기의 절연내력 시험전압을 쓰시오.", "ans": "최대사용전압 60[kV] 이하 : 직류측 최대사용전압의 1배 교류전압 (최저 500[V]), 충전부분과 외함 간 10분\n최대사용전압 60[kV] 초과 : 교류측 최대사용전압의 1.1배 교류전압 또는 직류측 최대사용전압의 1.1배 직류전압, 교류측·직류 고전압측 단자와 대지 사이 10분", "h1": "정류기 60 kV 기준 1배 / 1.1배", "h2": "동기발전기 병렬운전은 기전력의 크기 → 위상 → 주파수 → 파형을 맞춘다. [크위주파]", "freq": "-", "src": "-", "verify": "전기요약집 p.151 수록 문항"}, {"id": 638, "chap": "신재생·발전기", "topic": "동기발전기", "q": "동기발전기의 병렬운전 조건 4가지를 쓰시오.", "ans": "① 기전력의 크기가 같을 것\n② 기전력의 위상이 같을 것\n③ 기전력의 주파수가 같을 것\n④ 기전력의 파형이 같을 것\n(그 외) 기전력의 상회전 방향이 같을 것", "h1": "크위주파 (기전력의 크기·위상·주파수·파형)", "h2": "단락비가 크면 발전기는 크고 비싼 철기계가 된다. 손실은 커져 효율은 낮고, 전압변동률은 작으며 안정도는 높다.", "freq": "★★★ 8회 120제", "src": "[23-3] [20-3] [17-1] [15-1] [14-2] [05-3] [04-3] [03-3]", "verify": "공사요약집 p.269 일치 전기요약집 p.208 · 120제 일치"}, {"id": 639, "chap": "신재생·발전기", "topic": "동기발전기", "q": "동기발전기 병렬운전 시 조건이 맞지 않아 흐르는 횡류 3가지와 그 작용을 쓰시오.", "ans": "① 무효 순환전류 (기전력 크기 차) : 두 발전기 역률이 달라지고 발전기 과열\n② 동기화 전류(유효 횡류) (위상 차) : 출력이 주기적으로 동요, 발전기 과열\n③ 고조파 무효 순환전류 (파형 차) : 저항손 증가, 권선 가열", "h1": "고무동 → 고조파(파형) · 무효(크기) · 동기화(위상)", "h2": "동기발전기: “느린 수차 = 철기계 = 단락비 큼”가 떠오르면 정답 문장을 복원한다 — 수차 발전기 (0.9~1.2, 터빈 발전기 0.6~1.0)", "freq": "★ 2회", "src": "[15-3] [09-3]", "verify": "HWP 기준 (엑셀·교재 미수록)"}, {"id": 640, "chap": "신재생·발전기", "topic": "동기발전기", "q": "단락비가 큰 교류 동기발전기의 특성을 크다/작다·높다/낮다로 쓰시오.", "ans": "자속수가 크다, 기계 치수가 크다, 가격이 높다, 풍손·마찰손·철손이 크다, 효율은 낮다, 전압변동률은 작다, 안정도는 높다.", "h1": "단락비↑ = 철기계(크고 무거움) → 효율↓ · 변동률↓ · 안정도↑", "h2": "동기발전기: “흔들흔들 = 난조 (방지 : 제동권선)”가 떠오르면 정답 문장을 복원한다 — 난조 (Hunting)", "freq": "★★★ 7회 120제", "src": "[20-3] [17-1] [15-1] [14-2] [05-3] [04-3] [03-3]", "verify": "120제 일치"}, {"id": 641, "chap": "신재생·발전기", "topic": "동기발전기", "q": "단락비는 수차 발전기와 터빈 발전기 중 어느 쪽이 더 큰가?", "ans": "수차 발전기 (0.9~1.2, 터빈 발전기 0.6~1.0)", "h1": "느린 수차 = 철기계 = 단락비 큼", "h2": "[규태친자확] 태양광 적용 장면에서는 규모무관 → 태양있는곳 → 친환경 → 자원반영구 → 확산광 순서로 장점이 차례로 나타난다.", "freq": "★★ 4회", "src": "[20-3] [17-1] [15-1] [14-2]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 642, "chap": "신재생·발전기", "topic": "동기발전기", "q": "병렬운전 중 부하 급변 시 동기화력에 의한 진동 주기가 고유 진동 주기에 가까워져 공진으로 진동이 증대하는 현상은?", "ans": "난조 (Hunting)", "h1": "흔들흔들 = 난조 (방지 : 제동권선)", "h2": "[태비초] 태양광 점검 장면에서는 태양 밀도↓ → 비 → 흐림 → 초기비용 순서로 단점이 드러난다.", "freq": "-", "src": "-", "verify": "공사요약집 p.272 수록 문항 (공사기사 공통)"}, {"id": 643, "chap": "신재생·발전기", "topic": "태양광", "q": "태양광 발전의 장점 4가지를 쓰시오.", "ans": "① 규모에 관계없이 발전 효율이 일정하다.\n② 확산광(산란광)도 이용할 수 있다.\n③ 자원이 반영구적이다.\n④ 친환경 에너지이다.\n(그 외) 태양빛이 있는 곳이면 어디든 설치 가능, 보수 용이", "h1": "규태친자확 → 규모무관 · 태양있는곳 · 친환경 · 자원반영구 · 확산광", "h2": "[인버터] 태양광점검표에서 인버터 → 개방전압 → IPX4 순서로 확인한다.", "freq": "★ 2회 120제", "src": "[19-1] [11-2]", "verify": "공사요약집 p.267 일치 120제 일치"}, {"id": 644, "chap": "신재생·발전기", "topic": "태양광", "q": "태양광 발전의 단점 2가지를 쓰시오.", "ans": "① 태양광의 에너지 밀도가 낮다(넓은 면적 필요).\n② 날씨의 영향을 받는다(비·흐린 날 발전능력 저하).\n(그 외) 초기 투자비용이 높다.", "h1": "태비초 → 태양 밀도↓ · 비·흐림 · 초기비용", "h2": "태양광 모듈 두 개를 병렬로 묶으면 전압은 그대로이고 전류가 더해진다.", "freq": "★ 2회", "src": "[19-1] [11-2]", "verify": "엑셀·HWP 교차 확인 (교재 4종 미수록)"}, {"id": 645, "chap": "신재생·발전기", "topic": "태양광", "q": "KEC에 따른 태양광 인버터·절연변압기·계통연계 보호장치 등 전력변환장치 시설 기준 빈칸을 채우시오.\n( ① )는 실내·실외용을 구분할 것 / 각 직렬군 태양전지 ( ② )은 인버터 입력전압 범위 이내일 것 / 옥외 시설 시 방수등급 ( ③ ) 이상일 것", "ans": "① 인버터\n② 개방전압\n③ IPX4", "h1": "인버터 · 개방전압 · IPX4", "h2": "[효환용열부] 연료전지 체크리스트를 펼쳐 효율 → 환경 → 용적↓ → 열병합 → 부하조정 순서로 하나씩 짚는다.", "freq": "★ 1회", "src": "[25-1]", "verify": "전기요약집 p.239 일치"}, {"id": 646, "chap": "신재생·발전기", "topic": "태양광", "q": "KEC 태양전지 모듈 시설 기준 빈칸을 채우시오.\n1대의 인버터(MPPT 제어기)에 연결된 모듈 직렬군이 ( ① ) 이상일 경우 각 직렬군의 출력전압 및 ( ② )가 동일하게 형성되도록 배열할 것", "ans": "① 2병렬\n② 출력전류", "h1": "2병렬 이상 → 전압·전류 동일", "h2": "[과전류] 연료전지에서는 과전류 → 산소 → 연료가스 → 온도 순서로 장면을 이어 간다.", "freq": "-", "src": "-", "verify": "공사요약집 p.204 수록 문항 (공사기사 공통)"}, {"id": 647, "chap": "신재생·발전기", "topic": "연료전지", "q": "연료전지의 특징을 쓰시오.", "ans": "① 발전 효율이 높다.\n② 환경상 문제가 없어 수용가 근처
